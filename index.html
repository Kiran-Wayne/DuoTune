<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#d7deec">
<title>♡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fbe4ea'/%3E%3Ccircle cx='12.5' cy='16' r='8' fill='%23e48aa6'/%3E%3Ccircle cx='19.5' cy='16' r='8' fill='%231f1519' fill-opacity='.9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@200;300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Telugu:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ivory:#f8f9fc; --blush:#ebeef4; --blush2:#c0cde9; --rose:#819bd6; --rose2:#4165b3;
  --ink:#101318; --mut:rgba(16,19,24,.55); --hair:rgba(16,19,24,.09);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --tab:60px; --top:52px; --ease:cubic-bezier(.3,.8,.3,1);
}
@property --w{syntax:'<percentage>';inherits:false;initial-value:-8%}
@property --c1{syntax:'<color>';inherits:false;initial-value:rgba(16,19,24,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#b9c8e8;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose2);outline-offset:3px}
.hidden{display:none!important}
.i{width:24px;height:24px;display:block;flex:none}

/* ============ SHELL ============ */
#app{position:relative;width:100%;max-width:480px;height:var(--duo-vh,100dvh);min-height:0;margin:0 auto;overflow:hidden;
  background:linear-gradient(172deg,#f2f4f9 0%,#dfe4ef 48%,#adbee5 100%)}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.artglow{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(56px) saturate(1.25);opacity:0;transition:opacity 1.2s;transform:scale(1.25)}
.artglow.on{opacity:.5}
.veil{position:absolute;inset:0;background:linear-gradient(172deg,rgba(242,244,249,.62),rgba(223,228,239,.42) 50%,rgba(173,190,229,.4))}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
.blob.a{width:340px;height:340px;background:#d7def1;top:-90px;left:-110px}
.blob.b{width:380px;height:380px;background:#819fde;bottom:-140px;right:-150px;animation-duration:32s;opacity:.36}
.blob.c{width:240px;height:240px;background:#f2f4fb;top:38%;left:46%;animation-duration:38s;opacity:.45}
.grain{position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .3 0 0 0 0 .38 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes drift{to{transform:translate3d(46px,-38px,0) scale(1.14)}}

/* ============ WELCOME ============ */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;z-index:5;
  padding:calc(env(safe-area-inset-top) + 24px) 26px calc(env(safe-area-inset-bottom) + 24px);transition:opacity .45s,transform .45s var(--ease)}
.screen::-webkit-scrollbar{display:none}
.screen.leave{opacity:0;transform:scale(1.02);pointer-events:none}
.w-top{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:36px;height:27px}
.wordmark{font-weight:600;letter-spacing:.34em;font-size:12px;text-transform:uppercase}
.wordmark b{color:var(--rose2);font-weight:600}
.w-art{flex:1 1 0;min-height:130px;display:grid;place-items:center;margin:2px -14px 0}
.w-art svg{height:100%;width:auto;max-width:100%;max-height:440px;overflow:visible}
.orb-a{animation:bob 9s ease-in-out infinite alternate}
.orb-b{animation:bob 11s ease-in-out infinite alternate-reverse}
@keyframes bob{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.rip ellipse{transform-box:view-box;transform-origin:200px 336px;animation:ripple 7s ease-out infinite;opacity:0}
.rip ellipse:nth-child(2){animation-delay:2.3s}.rip ellipse:nth-child(3){animation-delay:4.6s}
@keyframes ripple{0%{transform:scale(.35);opacity:.8}100%{transform:scale(1.2);opacity:0}}
.tw{animation:tw 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw:nth-of-type(2n){animation-delay:1.4s}.tw:nth-of-type(3n){animation-delay:2.6s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.w-form{flex:none;animation:rise .9s var(--ease) both .15s}
.hello{font-size:clamp(30px,9.4vw,40px);line-height:1.05;font-weight:600;letter-spacing:-.04em;margin:0 0 16px}
.hello em{font-family:var(--serif);font-style:italic;font-weight:600;letter-spacing:-.01em;font-size:1.16em}
.hello .h{color:var(--rose2);font-weight:400}
.f{display:block;width:100%;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);border-radius:16px;
  padding:16px 18px;font-size:16px;margin-bottom:10px;outline:none;transition:background .2s,border-color .2s}
.f::placeholder{color:rgba(16,19,24,.38)}
.f:focus{background:rgba(255,255,255,.88);border-color:var(--rose)}
.idrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.idrow .f{margin:0;height:56px;padding:0 18px;flex:1;min-width:0}
.avatar-btn{position:relative;flex:none;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);cursor:pointer}
.avatar-btn #avatarPreview{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--rose2);font-size:20px}
.avatar-btn::after{content:"+";position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--ivory);font-size:14px;line-height:18px;text-align:center;border:2px solid #dfe4ef}
.primary{width:100%;height:58px;border-radius:29px;background:var(--ink);color:var(--ivory);font-weight:600;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;transition:transform .2s,background .2s}
.primary:active{transform:scale(.98)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ============ ROOM FRAME ============ */
#room{position:absolute;inset:0;min-height:0;display:flex;flex-direction:column;opacity:0;transition:opacity .6s}
#room.in{opacity:1}
.top{flex:none;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;justify-content:center;position:relative;z-index:3}
.pill{display:flex;align-items:center;gap:0;height:38px;padding:0 13px 0 5px;border-radius:19px;background:rgba(255,255,255,.55);box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
.av{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.av.me{background:var(--ink);color:var(--ivory)}
.av.her{background:var(--rose);color:#fff}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:#9ea4b0;border:1.5px solid #ebeef4}
.av.on::after{background:#5fb48a}
.link{display:flex;align-items:flex-end;gap:2px;height:12px;margin:0 9px;opacity:.35}
.link i{width:2px;border-radius:1px;background:var(--rose2);height:4px}
.pill.together .link{opacity:1}
.pill.together.playing .link i{animation:eq 1s ease-in-out infinite}
.link i:nth-child(2){animation-delay:.2s!important}.link i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
main{flex:1 1 auto;position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .4s,transform .45s var(--ease)}
.view.active{opacity:1;pointer-events:auto;transform:none}

.tabbar{flex:none;height:calc(var(--tab) + env(safe-area-inset-bottom));padding:0 30px env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;
  background:rgba(248,249,252,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--hair);position:relative;z-index:3}
.tab{position:relative;width:68px;height:42px;border-radius:21px;display:grid;place-items:center;color:var(--mut);transition:background .25s,color .25s}
.tab .i{width:26px;height:26px}
.tab.active{background:rgba(129,155,214,.2);color:var(--rose2)}
.tab .dot{position:absolute;top:7px;right:19px;width:9px;height:9px;border-radius:50%;background:var(--rose2);border:1.5px solid var(--ivory)}

/* ============ NOW PLAYING ============ */
#v-player{padding:0 28px max(8px,env(safe-area-inset-bottom));align-items:stretch;min-height:0}
@media(max-height:760px){#v-player{padding-top:2px}.art{width:clamp(150px,calc(100dvh - 450px),100%)}.info{margin-top:10px}.transport button{height:52px}.t-play .i{width:60px;height:60px}.vol{margin:4px 4px 2px}}
.art-stage{flex:1;min-height:0;display:grid;place-items:center}
.art{width:clamp(170px,calc(100dvh - 390px),100%);aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(145deg,#d7deed,#7b9bdf);
  box-shadow:0 30px 60px -22px rgba(51,76,129,.55),0 8px 20px -10px rgba(51,76,129,.3);transition:transform .7s var(--ease);transform:scale(.88)}
.playing .art{transform:scale(1)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art-css{position:absolute;inset:0;background:radial-gradient(circle at 62% 38%,var(--s,#eff1f8) 0 15%,transparent 15.5%),linear-gradient(160deg,var(--a),var(--b))}
.art-css::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;border-radius:50% 50% 0 0;background:linear-gradient(var(--c),var(--d));opacity:.9}
.mini-art,.q-art{position:relative;overflow:hidden;flex:none;background:linear-gradient(145deg,#d7deed,#7b9bdf)}
.mini-art{width:44px;height:44px;border-radius:9px}
.q-art{width:48px;height:48px;border-radius:9px}
.mini-art img,.q-art img{width:100%;height:100%;object-fit:cover;display:block}
.mini-art .art-css,.q-art .art-css{border-radius:0}
.info{display:flex;align-items:center;gap:14px;margin-top:18px}
.info .t{flex:1;min-width:0}
.title{font-size:22px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:17px;color:var(--rose2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(16,19,24,.07);flex:none}
.round .i{width:20px;height:20px}
.heart{color:var(--ink)}
.heart.on{color:var(--rose2)}
.heart.on .i{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.35)}}

.range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;outline:none;touch-action:none;display:block}
.range::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--ink) var(--p,0%),rgba(16,19,24,.14) var(--p,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .15s}
.range:active::-webkit-slider-thumb{transform:scale(1)}
.range::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--ink) var(--p,0%),rgba(16,19,24,.14) var(--p,0%))}
.range::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .15s}
.range:active::-moz-range-thumb{transform:scale(1)}
.seekwrap{margin-top:8px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:-2px}
.transport{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.transport button{display:grid;place-items:center;color:var(--ink);transition:transform .15s,opacity .15s;width:54px;height:60px}
.transport button:active{transform:scale(.86);opacity:.7}
.t-skip .i{width:30px;height:30px;opacity:.72}
.t-step .i{width:38px;height:38px}
.t-play{width:74px!important}
.t-play .i{width:68px;height:68px}
.flip{transform:scaleX(-1)}
.vol{display:flex;align-items:center;gap:12px;margin:8px 4px 4px;color:var(--mut)}
.vol .i{width:18px;height:18px}

/* ============ LYRICS + CHAT ============ */
.l-head{flex:none;display:flex;align-items:center;gap:12px;padding:2px 22px 10px}
.l-head .t{flex:1;min-width:0}
.l-head .title{font-size:16px}.l-head .artist{font-size:14px}
#lyrics{flex:1;min-height:0;position:relative;overflow-y:auto;scrollbar-width:none;padding:0 26px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 11%,#000 86%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 11%,#000 86%,transparent 100%)}
#lyrics::-webkit-scrollbar{display:none}
.pad{height:30%}.pad.b{height:70%}
.line{display:block;width:fit-content;max-width:100%;font-size:28px;line-height:1.22;font-weight:700;letter-spacing:-.025em;padding:10px 0;cursor:pointer;color:rgba(255,255,255,.42);
  transform-origin:left center;transform:scale(.93);opacity:max(.34,calc(1 - var(--d,4)*.2));
  filter:blur(calc(var(--d,4)*.45px));
  transition:transform .9s var(--e2,cubic-bezier(.32,.72,0,1)) calc(var(--k,0)*26ms),opacity .8s,filter .9s}
.line.active{transform:scale(1);opacity:1;filter:blur(0)}
.lyr-empty{font-family:var(--serif);font-style:italic;font-size:64px;color:rgba(65,101,179,.45);padding-top:14vh;text-align:center}
#lyricsSource{padding:0 26px 6px;text-align:center;font-size:11px;color:var(--mut);flex:none}
#lyricsSource:empty{display:none}

.dock{flex:none;position:relative;background:rgba(248,249,252,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:24px 24px 0 0;padding:2px 14px 12px;box-shadow:0 -10px 30px -18px rgba(51,76,129,.4)}
.grab{display:block;width:100%;height:20px;position:relative}
.grab::after{content:"";position:absolute;left:50%;top:8px;width:38px;height:4px;border-radius:2px;background:rgba(16,19,24,.18);transform:translateX(-50%)}
.msgwrap{height:0;overflow:hidden;transition:height .4s var(--ease)}
.dock.open .msgwrap{height:min(26dvh,220px)}
.msgs{height:100%;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px;padding:4px 2px 10px}
.msgs::-webkit-scrollbar{display:none}
.m{max-width:82%;display:flex;flex-direction:column;animation:rise .35s var(--ease) both}
.m.me{align-self:flex-end;align-items:flex-end}
.m.her{align-self:flex-start}
.mb{padding:9px 14px;border-radius:19px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.m.me .mb{background:var(--rose2);color:#fff;border-bottom-right-radius:6px}
.m.her .mb{background:#fff;border-bottom-left-radius:6px}
.mq{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--rose2);border-left:2px solid var(--rose);padding:1px 0 1px 9px;margin:0 4px 4px;max-width:100%}
.m.me .mq{text-align:right;border-left:0;border-right:2px solid var(--rose);padding:1px 9px 1px 0}
.quote{display:flex;align-items:center;gap:8px;margin:0 2px 8px;padding:7px 8px 7px 12px;border-radius:14px;background:rgba(129,155,214,.16)}
.quote span{flex:1;min-width:0;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--rose2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote button{width:24px;height:24px;color:var(--mut)}.quote .i{width:16px;height:16px}
.reacts{display:flex;justify-content:space-between;padding:0 6px 8px}
.reacts button{font-size:23px;width:48px;height:38px;border-radius:19px;transition:transform .15s,background .15s}
.reacts button:active{transform:scale(1.28);background:rgba(129,155,214,.22)}
.chat-form{display:flex;gap:8px;align-items:center}
.chat-form input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--hair);background:#fff;padding:0 18px;font-size:16px;outline:none}
.chat-form input:focus{border-color:var(--rose)}
@media(max-height:560px){.dock.open .msgwrap{height:min(24dvh,150px)}.dock{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
.send{width:44px;height:44px;border-radius:50%;background:var(--rose2);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,opacity .2s}
.send:active{transform:scale(.9)}.send:disabled{opacity:.35}

/* ============ LIBRARY ============ */
#v-library{padding:0 20px}
.seg{display:flex;background:rgba(16,19,24,.07);border-radius:12px;padding:3px;margin:2px 0 12px;flex:none}
.seg button{flex:1;height:34px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut);transition:all .25s}
.seg button.on{background:var(--ivory);color:var(--ink);box-shadow:0 1px 4px rgba(51,76,129,.15)}
.pane{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:88px}
.pane::-webkit-scrollbar{display:none}
.add-row{display:flex;gap:8px;margin-bottom:6px}
.add-row .f{margin:0;padding:12px 16px;border-radius:14px;font-size:16px}
.add-btn{flex:none;height:46px;padding:0 16px;border-radius:14px;background:var(--ink);color:var(--ivory);font-weight:600;font-size:14px}
.search{position:relative;flex:1;min-width:0}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);pointer-events:none}
.search .f{padding-left:42px;height:46px}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;width:100%;text-align:left}
a.row{color:inherit;text-decoration:none}
.row:active{background:rgba(255,255,255,.5)}
.row .t{flex:1;min-width:0}
.row .n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .n{color:var(--rose2)}
.ib,.plus{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(16,19,24,.06);color:var(--ink);flex:none;transition:background .2s,transform .15s}
.ib:active,.plus:active{transform:scale(.9);background:rgba(129,155,214,.25)}
.ib .i,.plus .i{width:18px;height:18px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 4px;min-height:36px}
.qhead .label{margin:0}
.qtools{display:flex;gap:8px}
.qrow{transition:transform .22s var(--ease);position:relative}
.qrow.dragging{transition:none;z-index:3;background:rgba(248,249,252,.96);box-shadow:0 12px 28px -12px rgba(51,76,129,.55)}
.grip{width:26px;height:44px;display:grid;place-items:center;color:rgba(16,19,24,.35);touch-action:none;cursor:grab;flex:none;margin-left:-4px}
.grip .i{width:18px;height:18px}
.q-play{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.pl-meta{font-size:12px;color:var(--mut);margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:2px;height:14px;width:16px;flex:none}
.bars i{flex:1;background:var(--rose2);border-radius:1px;height:4px}
.playing .row.cur .bars i{animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.25s!important}.bars i:nth-child(3){animation-delay:.5s!important}
.label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 6px 8px}
.pl-ico{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.6);display:grid;place-items:center;color:var(--rose2);flex:none}
.empty{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--mut);text-align:center;padding:22px 0}
.room-foot{text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(16,19,24,.35);padding:22px 0 6px}
.ghost{display:flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:19px;background:rgba(255,255,255,.55);font-size:14px;font-weight:600}
.ghost .i{width:16px;height:16px}
.imp{display:flex;justify-content:flex-end;padding:4px 2px 6px}
.stats{display:flex;align-items:flex-end;gap:24px;padding:6px 6px 26px}
.stat b{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:44px;line-height:1;letter-spacing:-.01em}
.stat b small{font-family:var(--sans);font-style:normal;font-size:14px;color:var(--mut);margin:0 6px 0 2px;font-weight:500;letter-spacing:0}
.stat span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:7px}
.wk{margin-left:auto;display:flex;align-items:flex-end;gap:6px;height:44px}
.wk i{position:relative;width:8px;height:100%;display:flex;align-items:flex-end}
.wk u{display:block;width:8px;height:var(--h);border-radius:4px;background:linear-gradient(var(--rose),var(--rose2));opacity:.85}
.wk em{position:absolute;top:100%;left:0;right:0;margin-top:4px;text-align:center;font-style:normal;font-size:9px;color:var(--mut)}
.fsel{display:flex;gap:8px;margin:0 0 6px;overflow-x:auto;scrollbar-width:none}
.fsel button{height:32px;padding:0 15px;border-radius:16px;font-size:14px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.5);flex:none;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsel button.on{background:var(--ink);color:var(--ivory)}
.both{display:flex;flex:none;margin-right:2px}
.both .i{width:16px;height:16px}
.both .i+.i{margin-left:-6px}
.minibar{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:16px;background:rgba(248,249,252,.92);box-shadow:0 10px 30px -14px rgba(51,76,129,.5)}
.minibar .t{flex:1;min-width:0}
.minibar .title{font-size:15px}.minibar .artist{font-size:13px}
.minibar .pp{width:38px;height:38px;display:grid;place-items:center}.minibar .pp .i{width:26px;height:26px}

/* ============ OVERLAYS ============ */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.rx{position:absolute;bottom:150px;font-size:36px;filter:drop-shadow(0 4px 10px rgba(65,101,179,.35));animation:rise-fx 2.8s ease-out forwards}
@keyframes rise-fx{0%{opacity:0;transform:translateY(0) scale(.5)}12%{opacity:1}100%{opacity:0;transform:translateY(-340px) translateX(var(--dx,0)) scale(1.25)}}
.banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:8;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:18px;
  background:rgba(248,249,252,.95);box-shadow:0 14px 34px -14px rgba(51,76,129,.55);transform:translateY(-140%);transition:transform .5s var(--ease);text-align:left;width:calc(100% - 24px)}
.banner.show{transform:none}
.banner .t{flex:1;min-width:0}
.banner .n{font-size:13px;font-weight:700}
.banner .s{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-bg{position:absolute;inset:0;background:rgba(16,19,24,.28);z-index:9;opacity:0;pointer-events:none;transition:opacity .35s}
.sheet-bg.show{opacity:1;pointer-events:auto}
#dlgBg{z-index:12}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--ivory);border-radius:26px 26px 0 0;padding:10px 24px calc(env(safe-area-inset-bottom) + 24px);
  transform:translateY(105%);transition:transform .5s var(--ease)}
#dlg{z-index:13}
.sheet.show{transform:none}
.sheet .gr{width:36px;height:4px;border-radius:2px;background:rgba(16,19,24,.18);margin:0 auto 18px}
.sheet-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.who{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:17px;font-weight:600}
.who small{margin-left:auto;font-size:13px;font-weight:500;color:var(--mut)}
.code-box{display:none!important;display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;padding:14px 16px;border-radius:16px;background:var(--blush)}
.code-box strong{font-size:22px;letter-spacing:.2em;font-weight:600}
.code-box button{color:var(--rose2);width:34px;height:34px;display:grid;place-items:center}
.leave-btn{width:100%;height:50px;margin-top:8px;font-size:15px;font-weight:600;color:var(--rose2)}
#dlgText{font-size:18px;font-weight:600;line-height:1.35;margin:6px 0 18px;text-align:center}
.toast{position:absolute;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 90px);transform:translate(-50%,10px);z-index:14;background:var(--ink);color:var(--ivory);
  padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:all .35s var(--ease);max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Official YouTube player viewport. Keep it visible and large enough for the embed requirements. */
.yt-embed-shell{flex:none;display:flex;justify-content:center;align-items:center;padding:4px 0 2px}
.yt-embed-frame{width:200px;height:200px;min-width:200px;min-height:200px;border-radius:18px;overflow:hidden;background:rgba(16,19,24,.08);box-shadow:0 14px 28px -16px rgba(35,55,105,.45)}
#yt-player,#yt-player iframe{width:200px!important;height:200px!important;display:block}
#yt-status{font-size:11px;line-height:1.3;text-align:center;color:var(--mut);padding:3px 0;min-height:18px}
#v-player{overflow-y:auto;scrollbar-width:none}
#v-player::-webkit-scrollbar{display:none}
.art-stage{flex:0 0 auto;min-height:0;padding:8px 0 10px}
.art{width:clamp(116px,34vw,156px);transform:scale(1)}
.info{margin-top:8px}
@media (prefers-reduced-motion:reduce){*:not(.rx){animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== welcome v3: rose, centred photo, name + password ===== */
.w-art{margin:0 -14px;min-height:150px}
.w-art svg{overflow:visible}
.rose{transform-box:view-box;transform-origin:200px 190px;animation:sway 16s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(5deg) scale(1.035)}}
.rose .lay{transform-box:view-box;transform-origin:200px 190px;animation:bloom 1.9s var(--ease) both;animation-delay:calc(var(--i)*.16s)}
@keyframes bloom{from{transform:scale(.25) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.halo{animation:halo 7s ease-in-out infinite alternate;transform-box:view-box;transform-origin:200px 190px}
@keyframes halo{from{opacity:.75;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
.fp{transform-box:fill-box;transform-origin:center;opacity:0;animation:fall 18s linear infinite}
@keyframes fall{
  0%{transform:translate(var(--x),-40px) rotate(0) scale(var(--s));opacity:0}
  8%{opacity:.95}
  50%{transform:translate(calc(var(--x) + 34px),200px) rotate(170deg) scale(var(--s))}
  100%{transform:translate(calc(var(--x) - 14px),470px) rotate(340deg) scale(var(--s));opacity:0}}
.w-form{text-align:center}
.avatar-btn.big{display:block;width:92px;height:92px;margin:-52px auto 8px;border:3px solid rgba(255,255,255,.95);
  box-shadow:0 16px 32px -14px rgba(42,71,130,.55);z-index:2;background:linear-gradient(145deg,#fff,#ebeef4)}
.avatar-btn.big #avatarPreview{font-size:32px}
.avatar-btn.big::after{width:28px;height:28px;line-height:23px;font-size:18px;right:-2px;bottom:-2px;border:3px solid #dfe4ef}
.hello{text-align:center;margin:0 0 14px}
.field{position:relative;margin-bottom:10px;text-align:left}
.field .i{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--rose2);opacity:.85;pointer-events:none}
.field .f{margin:0;height:56px;padding:0 18px 0 49px}
/* ===== v3 polish ===== */
:root{--e2:cubic-bezier(.32,.72,0,1);
  --sh1:0 1px 2px rgba(51,76,129,.10),0 4px 12px -4px rgba(51,76,129,.18);
  --sh2:0 2px 4px rgba(51,76,129,.08),0 10px 24px -8px rgba(51,76,129,.30),0 22px 44px -22px rgba(51,76,129,.30);
  --sh3:0 4px 8px rgba(38,56,95,.10),0 18px 40px -10px rgba(42,71,130,.42),0 40px 80px -30px rgba(42,71,130,.45)}
html,body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;left:50%;top:var(--vvt,0px);transform:translateX(-50%);height:var(--vvh,100dvh);transition:none}
button{transition:transform .25s var(--e2),background .25s,box-shadow .3s,opacity .25s}
button:active{transform:scale(.97)}
.view{transition:opacity .5s var(--e2),transform .6s var(--e2)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* shadows */
.tabbar{box-shadow:0 -14px 36px -18px rgba(51,76,129,.5),inset 0 1px 0 rgba(255,255,255,.7);border-top:0;transition:height .35s var(--e2),padding .35s var(--e2),opacity .25s}
.tab{transition:background .35s var(--e2),color .3s,box-shadow .35s var(--e2),transform .25s var(--e2)}
.tab.active{background:linear-gradient(180deg,#fff,rgba(241,244,250,.9));box-shadow:var(--sh1),inset 0 1px 0 #fff}
.pill{box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.8)}
.art{box-shadow:var(--sh3);transition:transform .7s var(--e2),box-shadow .7s}
.playing .art{box-shadow:0 6px 10px rgba(38,56,95,.12),0 26px 50px -12px rgba(42,71,130,.55),0 50px 90px -34px rgba(42,71,130,.5)}
.dock{box-shadow:0 -16px 40px -18px rgba(51,76,129,.5),inset 0 1px 0 rgba(255,255,255,.75)}
.row{background:rgba(255,255,255,.55);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.8);padding:8px 10px;margin-bottom:7px;border-radius:16px;animation:rise .5s var(--e2) both}
.row:nth-child(2){animation-delay:.04s}.row:nth-child(3){animation-delay:.08s}.row:nth-child(4){animation-delay:.12s}.row:nth-child(5){animation-delay:.16s}.row:nth-child(n+6){animation-delay:.2s}
.row.cur{background:rgba(255,255,255,.82);box-shadow:var(--sh2)}
.pl-ico{box-shadow:var(--sh1)}
.ib,.plus{box-shadow:var(--sh1);background:rgba(255,255,255,.7)}
.seg{box-shadow:inset 0 1px 3px rgba(51,76,129,.18)}
.seg button{transition:all .35s var(--e2)}
.seg button.on{box-shadow:var(--sh1)}
.sheet{box-shadow:0 -4px 10px rgba(38,56,95,.06),0 -24px 60px -12px rgba(42,71,130,.5);transition:transform .55s var(--e2)}
.sheet-bg{transition:opacity .45s var(--e2)}
.banner{box-shadow:var(--sh3);transition:transform .55s var(--e2),opacity .4s}
.banner .av{width:40px;height:40px;font-size:15px;box-shadow:0 0 0 2px #fff,0 6px 14px -4px rgba(65,101,179,.6);overflow:hidden}
.banner .av::after{display:none}
.primary{box-shadow:0 2px 4px rgba(16,19,24,.18),0 14px 28px -10px rgba(16,19,24,.55)}
.toast{box-shadow:var(--sh3)}

/* stats numerals */
.stat b{font-family:"SF Pro Rounded",ui-rounded,var(--sans);font-style:normal;font-weight:200;font-size:48px;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  background:linear-gradient(170deg,#98afe0,#3c5ca0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 6px 10px rgba(65,101,179,.25))}
.stat b small{font-family:inherit;font-size:15px;font-weight:300;letter-spacing:0;margin:0 7px 0 3px}
.wk u{box-shadow:0 4px 8px -3px rgba(65,101,179,.5);transition:height .8s var(--e2)}

/* login steps */
.subrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.subrow.hidden{display:none}
.linkbtn{font-size:13.5px;font-weight:600;color:var(--rose2);padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.55);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.8)}
.linkbtn:active{background:rgba(255,255,255,.9)}
.dotsep{width:4px;height:4px;border-radius:50%;background:var(--rose)}
#passwordField:not(.hidden){animation:rise .5s var(--e2) both}
#nameInput[readonly]{opacity:.65}


/* ---- visible official YouTube embed; DuoTune metadata remains in its own UI ---- */

/* ---- anti-flicker: no backdrop-filter inside fading views, promoted layers ---- */
.view{will-change:opacity,transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dock{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(248,249,252,.92);transition:background-color .6s var(--e2),box-shadow .6s}
.tabbar{transition:height .35s var(--e2),padding .35s var(--e2),opacity .25s,background-color .6s var(--e2),box-shadow .6s}
.tab{transition:background-color .5s var(--e2),color .5s,box-shadow .4s var(--e2),transform .25s var(--e2)}
body.lyr .tabbar{backdrop-filter:none;-webkit-backdrop-filter:none}
.veil,.lyrbg,.artglow{will-change:opacity}

/* ---- ambient player backdrop ---- */
.bg::before,.bg::after{content:"";position:absolute;width:90%;aspect-ratio:1;border-radius:50%;filter:blur(46px);opacity:.55;pointer-events:none;transition:opacity 1s}
.bg::before{left:-30%;top:-8%;background:radial-gradient(circle,#d2dbef,transparent 65%);animation:drift 22s ease-in-out infinite alternate}
.bg::after{right:-35%;bottom:6%;background:radial-gradient(circle,#97b4f2,transparent 65%);animation:drift 28s ease-in-out -9s infinite alternate-reverse}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(14%,10%,0) scale(1.18)}}
body.lyr .bg::before,body.lyr .bg::after{opacity:.25}
body:not(.lyr) .artglow.on{opacity:.8}
.art{border-radius:24px}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -40px 60px -40px rgba(22,46,95,.35);pointer-events:none}
.title{letter-spacing:-.025em}

/* ---- chat header + panel ---- */
.msgwrap{display:flex;flex-direction:column}
.dock.open .msgwrap{height:min(31dvh,250px);transition:height .35s var(--e2)}
.msgwrap{transition:height .35s var(--e2)}
.msgs{flex:1;min-height:0;height:auto;gap:7px;padding:2px 4px 10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msgs *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chat-head{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 0 7px;max-height:72px;overflow:hidden;transition:max-height .35s var(--e2),opacity .25s,padding .35s var(--e2)}
.av.ch{width:38px;height:38px;font-size:16px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 6px 14px -4px rgba(8,16,31,.45);overflow:visible}
.av.ch::after{width:10px;height:10px;right:-1px;bottom:-1px;border:2px solid #34559a}
.ch-t{display:flex;align-items:center;gap:6px;line-height:1}
.ch-t b{font-size:13px;font-weight:650;letter-spacing:-.01em}
.ch-t span{font-size:11px;color:var(--rose2)}
.ch-t span:empty{display:none}
.ch-clear{position:absolute;right:0;top:0;width:32px;height:32px}
.ch-clear .i{width:16px;height:16px}
body.kb .chat-head{max-height:0;opacity:0;padding:0}
body.kb .tabbar{height:0;padding:0;opacity:0;pointer-events:none;overflow:hidden;border:0;box-shadow:none}
body.kb .dock.open .msgwrap{height:clamp(90px,calc(var(--vvh,100dvh)*.3),160px)}
body.kb .dock{padding-bottom:6px}
.m{max-width:80%;animation:mrise .5s var(--e2) both}
.m .mb{font-size:15.5px;line-height:1.3;padding:9px 15px;transition:transform .25s var(--e2),filter .25s}
.m.me .mb{background:linear-gradient(135deg,#8dacf1,#3b71e7);color:#fff;border-radius:20px 20px 6px 20px;box-shadow:0 8px 18px -8px rgba(59,113,231,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.m.her .mb{background:#fff;color:#1b263c;border-radius:20px 20px 20px 6px;box-shadow:0 8px 18px -10px rgba(11,23,47,.55)}
.m.pressed .mb{transform:scale(.95);filter:brightness(.92)}
@keyframes mrise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.quote{background:rgba(255,255,255,.2)}
.quote span{color:#fff}
.reacts button{background:rgba(255,255,255,.55);box-shadow:var(--sh1)}

/* ---- Apple-Music-style timestamped lyrics ---- */
:root{--spring:cubic-bezier(.22,1,.36,1)}
.lyrbg{position:absolute;inset:0;opacity:0;transition:opacity .9s var(--e2);pointer-events:none;
  background:radial-gradient(110% 60% at 50% -5%,rgba(179,200,245,.5),transparent 62%),linear-gradient(176deg,#5d85df 0%,#2e59b4 48%,#27457f 100%)}
body.lyr .lyrbg{opacity:1}
body.lyr .artglow.on{opacity:.16}
body.lyr .veil{opacity:0}
.veil{transition:opacity .6s}
body.lyr .l-head .title,body.lyr .l-head .artist{color:#fff}
body.lyr .l-head .artist{opacity:.75}
.line{translate:0 0;color:#fff;transform-origin:left center;transform:scale(.94);opacity:.4;
  filter:blur(calc(min(var(--d,4),5)*.55px));
  transition:transform .8s var(--spring),opacity .7s var(--e2),filter .8s var(--e2),translate 1.05s var(--spring) calc(var(--k,0)*42ms)}
.line.active{transform:scale(1);opacity:1;filter:blur(0)}
.line.picked{color:#e9edf6}
body.lyr #lyricsSource{color:#fff;opacity:.9;font-size:17px;font-weight:600;padding:0 26px 18px;letter-spacing:-.01em}
.lyr-empty{color:rgba(255,255,255,.55);font-size:72px}
body.lyr .dock{background:rgba(255,255,255,.15);box-shadow:0 -16px 40px -18px rgba(11,26,55,.55),inset 0 1px 0 rgba(255,255,255,.3)}
body.lyr .grab::after{background:rgba(255,255,255,.5)}
body.lyr .tabbar{background:rgba(255,255,255,.14);box-shadow:0 -14px 36px -18px rgba(11,26,55,.5),inset 0 1px 0 rgba(255,255,255,.25)}
body.lyr .tab{color:rgba(255,255,255,.7)}
body.lyr .tab.active{background:rgba(255,255,255,.26);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px rgba(11,26,55,.5)}
body.lyr .ch-clear{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
body.lyr .mq{color:#e9edf6;border-color:rgba(255,255,255,.55)}
body.lyr .chat-form input{background:rgba(255,255,255,.96);border-color:transparent;color:#1b263c;box-shadow:var(--sh1)}
body.lyr .dock .heart{color:#fff}

/* now-playing card inside lyrics tab */
.l-head{margin:2px 14px 10px;padding:10px 12px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.35);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 14px 30px -14px rgba(11,26,55,.55),0 3px 6px rgba(11,26,55,.12)}
.l-head .mini-art{box-shadow:0 8px 16px -6px rgba(11,26,55,.6);border-radius:12px;overflow:hidden}
.l-head .round{background:#fff;color:#2e59b4;box-shadow:0 10px 20px -8px rgba(11,26,55,.7),0 1px 0 #fff inset}
.l-head .title{font-weight:650}

/* send arrow with depth */
.send{background:linear-gradient(145deg,#96b2f2,#3c71e4);color:#fff;box-shadow:0 12px 22px -8px rgba(30,76,175,.85),0 2px 4px rgba(30,76,175,.25),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .25s var(--e2),opacity .3s,filter .3s}
.send:disabled{opacity:1;filter:saturate(.55) brightness(1.08);background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.28));box-shadow:0 8px 16px -8px rgba(11,26,55,.55),inset 0 1px 0 rgba(255,255,255,.7)}
.send .i{filter:drop-shadow(0 1px 1px rgba(15,41,95,.35))}

/* chat header: her portrait */
.chat-head{max-height:118px;padding:8px 0 10px;gap:6px}
.av.ch{width:60px;height:60px;font-size:24px;background-size:cover;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 6px rgba(255,255,255,.22),0 14px 24px -8px rgba(11,26,55,.6)}
.av.ch::after{width:14px;height:14px;right:1px;bottom:1px;border:2.5px solid #2e59b4}
.ch-t{flex-direction:column;gap:3px}
.ch-t b{font-family:var(--serif);font-style:italic;font-size:23px;font-weight:600;letter-spacing:0;color:#fff;line-height:1}
.ch-t span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.dock.open .msgwrap{height:min(36dvh,300px)}

/* login: premium glass fields + rose button */
#welcomeForm .f{height:58px;padding:0 20px 0 52px;border-radius:29px;font-weight:500;letter-spacing:.01em;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.74));border:1px solid rgba(255,255,255,.95);
  box-shadow:0 1px 0 #fff inset,0 12px 26px -14px rgba(46,84,167,.55),0 2px 4px rgba(46,84,167,.08);
  transition:box-shadow .4s var(--e2),transform .4s var(--e2),background .3s}
#welcomeForm .f:focus{background:#fff;transform:translateY(-1px);box-shadow:0 0 0 4px rgba(60,113,228,.15),0 16px 32px -14px rgba(46,84,167,.6)}
#welcomeForm .field .i{left:20px;width:20px;height:20px;transition:color .3s,transform .4s var(--e2)}
#welcomeForm .field:focus-within .i{color:#3c71e4;transform:translateY(-50%) scale(1.12)}
#welcomeForm .primary{background:linear-gradient(135deg,#96b1ee 0%,#4e7de2 50%,#2956b6 100%);color:#fff;height:60px;border-radius:30px;font-weight:650;letter-spacing:.01em;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 -2px 0 rgba(15,41,95,.12) inset,0 18px 32px -12px rgba(36,81,177,.8),0 4px 8px rgba(36,81,177,.22);overflow:hidden}
#welcomeForm .primary::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:shine 4.2s ease-in-out 1.2s infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.primary.busy::before{display:none}
#welcomeForm .avatar-btn.big{box-shadow:0 14px 28px -10px rgba(46,84,167,.6),0 1px 0 #fff inset}
#welcomeForm .avatar-btn::after{background:linear-gradient(135deg,#7c9fe9,#2956b6);color:#fff;border-color:#fff}
.linkbtn{box-shadow:0 8px 18px -10px rgba(46,84,167,.55),inset 0 1px 0 rgba(255,255,255,.9)}
.hello{text-shadow:0 8px 24px rgba(46,84,167,.18)}

@keyframes pulseI{50%{opacity:.35}}
@keyframes sweep{to{background-position:-200% 0}}
/* top pill only on the listening tab */
.top{transition:height .4s var(--e2),opacity .3s,padding .4s var(--e2)}

/* keyboard: animate the single resize */
#app{transition:height .3s var(--e2)}
@media(prefers-reduced-motion:reduce){.bg::before,.bg::after,#welcomeForm .primary::before{animation:none}}
/* ---- touch feedback ---- */
.primary,.send,.tab,.linkbtn,.reacts button{position:relative}
.primary.busy{pointer-events:none}
.primary.busy #goLabel::after{content:"";display:inline-block;width:14px;height:14px;margin-left:10px;vertical-align:-2px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .42s var(--e2)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.view,.row,.m{animation-fill-mode:both}
@media(prefers-reduced-motion:reduce){.bg::before,.bg::after{animation:none}}

/* ---- v6 stability ---- */
#welcomeForm .field{position:relative}
#welcomeForm .field .i{z-index:3}
#welcomeForm .f{position:relative;z-index:1;-webkit-tap-highlight-color:transparent}
#welcomeForm .f:-webkit-autofill,#welcomeForm .f:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px #fff inset;-webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
#app{transition:none}
body.in-room #app{transition:height .3s var(--e2)}
.bg::before,.bg::after{filter:none;will-change:transform}
.w-art{transition:min-height .35s var(--e2),opacity .3s}
body.kb #welcome .w-art{min-height:0;opacity:0}
.line{filter:blur(calc(min(var(--d,4),3)*.6px))}
.line.active{filter:blur(0)}
#welcomeForm .primary{transform:translateZ(0)}

/* ================= v7: layering + flicker audit ================= */
html{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
/* app shell: no transform-centering (sub-pixel flicker) */
#app{left:0;right:0;margin:0 auto;transform:none;width:100%;max-width:480px}
/* top pill overlays the player only; layout never changes between tabs */
.top{position:absolute;left:0;right:0;top:0;height:calc(var(--top) + env(safe-area-inset-top));transition:opacity .3s var(--e2)}
body:not(.vp) .top{opacity:0;pointer-events:none}
#v-player{padding-top:calc(var(--top) + env(safe-area-inset-top))}
#v-lyrics,#v-library{padding-top:calc(env(safe-area-inset-top) + 8px)}
/* tab crossfade: outgoing leaves first, incoming follows (no double-exposure flash) */
.view{transition:opacity .2s ease,transform .45s var(--spring)}
.view.active{transition:opacity .38s ease .1s,transform .6s var(--spring) .05s}
.lyrbg{transition:opacity .55s ease}
body.lyr .bg::before,body.lyr .bg::after{display:none}
.row{animation:none}
.seg button{transition:background .3s var(--e2),color .3s,box-shadow .3s}

/* lyrics fill the whole view; the chat dock floats over them (zero relayout when it opens) */
#v-lyrics{position:absolute}
#v-lyrics .l-head{position:relative;z-index:3}
#lyrics{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px + 84px);bottom:0;flex:none;padding-top:0}
#lyricsSource{position:absolute;left:0;right:0;top:46%;z-index:1;padding:0 26px}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:4}
body.lyr .dock{background:linear-gradient(180deg,#6387d9,#3a60b6);box-shadow:0 -18px 44px -16px rgba(25,43,84,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.dock{border-radius:26px 26px 0 0;padding:0 14px 10px;transition:box-shadow .5s}
.grab{height:22px;transition:opacity .25s}
.dock.open .grab::after{opacity:0}
.grab::after{transition:opacity .25s}

/* chat dock: compact, avatar-only badge */
.chat-head{display:block;padding:0;max-height:none;overflow:visible;gap:0;position:absolute;left:50%;top:-24px;margin-left:-23px;width:46px;height:46px;z-index:5;pointer-events:none;opacity:0;transform:translateY(10px) scale(.8);transition:opacity .3s,transform .5s var(--spring)}
.dock.open .chat-head{opacity:1;transform:none}
.av.ch{flex:none;width:46px;height:46px;font-size:18px;background-size:cover;box-shadow:0 0 0 2.5px rgba(255,255,255,.95),0 10px 20px -6px rgba(18,35,76,.6)}
.av.ch::after{width:12px;height:12px;right:-1px;bottom:-1px;border:2.5px solid #3a60b6}
.av.ch.typing{animation:avpulse 1.2s ease-in-out infinite}
@keyframes avpulse{50%{box-shadow:0 0 0 2.5px rgba(255,255,255,.95),0 0 0 9px rgba(255,255,255,.22),0 10px 20px -6px rgba(18,35,76,.6)}}
.ch-clear{position:absolute;right:12px;top:8px;width:30px;height:30px;z-index:5;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.dock.open .ch-clear{opacity:1;pointer-events:auto}
.ch-clear .i{width:15px;height:15px}
.msgwrap{display:block;height:0;overflow:hidden;transition:height .45s var(--spring)}
body .dock.open .msgwrap{height:min(36dvh,300px)}
body.kb .dock.open .msgwrap{height:clamp(110px,calc(var(--vvh,100dvh)*.36),220px)}
.msgs{height:100%;padding:30px 4px 8px;gap:3px;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38px);mask-image:linear-gradient(to bottom,transparent 0,#000 38px)}
.reacts{padding:6px 2px 6px;gap:6px}
.reacts button{width:auto;flex:1;height:32px;font-size:19px;border-radius:16px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.reacts button:active{background:rgba(255,255,255,.4)}
.chat-form input{height:42px;border-radius:21px}
.send{width:42px;height:42px}
.quote{margin:0 2px 6px;padding:6px 8px 6px 12px;background:rgba(255,255,255,.2)}
.quote.land{animation:land .5s var(--spring)}
@keyframes land{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
.lyric-drop{position:fixed;z-index:30;pointer-events:none;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:#fff;transform-origin:left center;text-shadow:none}

/* bubbles */
.m{max-width:78%;animation:mrise .45s var(--spring) both;margin-top:0}
.m.me + .m.her,.m.her + .m.me{margin-top:9px}
.m .mb{position:relative;font-size:15.5px;line-height:1.32;padding:9px 15px;letter-spacing:-.005em;border-radius:22px}
.m.me .mb{background:linear-gradient(150deg,#eaf0fe 0%,#b4c8f6 100%);color:#1c2d55;box-shadow:0 8px 18px -10px rgba(13,31,77,.7),inset 0 1px 0 rgba(255,255,255,.9);border-bottom-right-radius:7px}
.m.her .mb{background:rgba(255,255,255,.96);color:#1b2742;box-shadow:0 8px 18px -12px rgba(13,31,77,.65);border-bottom-left-radius:7px}
.m.me:has(+ .m.me) .mb{border-bottom-right-radius:22px}
.m.me + .m.me .mb{border-top-right-radius:7px}
.m.her:has(+ .m.her:not(.typing)) .mb{border-bottom-left-radius:22px}
.m.her + .m.her .mb{border-top-left-radius:7px}
.m.me + .m.me,.m.her + .m.her{margin-top:0}
.mq{font-family:var(--serif);font-style:italic;font-size:14.5px;color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.6);margin-bottom:3px}
.m.typing .mb{display:flex;gap:4px;align-items:center;padding:13px 16px;border-bottom-left-radius:7px}
.m.typing i{width:7px;height:7px;border-radius:50%;background:#6e8dd7;animation:tdot 1.1s ease-in-out infinite}
.m.typing i:nth-child(2){animation-delay:.15s}.m.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.m.typing.out{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
.line.tapped{animation:tapline .5s var(--spring)}
@keyframes tapline{40%{transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){.av.ch.typing{animation:none}}

/* ================= v8: Pearl & Midnight Sapphire ================= */
:root{--sap1:#5f7bef;--sap2:#3550c8;--sap3:#202f86;--navy:#141f5c;--pearl:#f6f8ff;--ink:#101a3d;--mut:rgba(16,26,61,.56);--rose:#7f95f2;--rose2:#3550c8;--hair:rgba(16,26,61,.09)}
*:focus,*:focus-visible,button:focus-visible,input:focus-visible{outline:none!important}
body{color:var(--ink)}
/* ---- pearl screens: whiter, cleaner */
#app{background:linear-gradient(172deg,#fbfcff 0%,#e9eefc 52%,#c9d5f8 100%)}
/* ---- login: elegant fields + sapphire button */
#welcomeForm .f{height:58px;padding:0 20px 0 54px;border-radius:29px;font-size:16px;font-weight:500;letter-spacing:.005em;color:#14204f;
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.84));border:1px solid rgba(255,255,255,.95);
  box-shadow:0 1px 0 #fff inset,0 14px 28px -16px rgba(40,60,160,.55),0 2px 4px rgba(40,60,160,.07)}
#welcomeForm .f::placeholder{color:rgba(20,32,79,.38);font-weight:400}
#welcomeForm .f:focus{background:#fff;transform:translateY(-1px);box-shadow:0 1px 0 #fff inset,0 20px 36px -16px rgba(40,60,160,.65),0 2px 6px rgba(40,60,160,.1)}
#welcomeForm .field .i{color:#3550c8;opacity:.9}
#welcomeForm .primary{background:linear-gradient(135deg,#6a85f2 0%,#3550c8 52%,#1f2d86 100%);color:#fff;height:60px;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -2px 0 rgba(10,18,70,.25) inset,0 20px 34px -14px rgba(35,55,170,.85),0 4px 8px rgba(35,55,170,.25)}
#welcomeForm .avatar-btn.big{box-shadow:0 16px 30px -12px rgba(40,60,160,.6),0 1px 0 #fff inset;background:linear-gradient(180deg,#fff,#eef2ff)}
#welcomeForm .avatar-btn::after{background:linear-gradient(135deg,#6a85f2,#2f49b8);color:#fff;border-color:#fff}
.hello{color:var(--ink);text-shadow:none}
.shake{animation:shake .42s var(--e2)}
body.restoring #welcome .w-form{visibility:hidden}
/* ---- floating glass tab bar */
.tabbar{margin:0 18px calc(env(safe-area-inset-bottom) + 10px);height:64px;padding:0 8px;border-radius:32px;border:1px solid rgba(255,255,255,.95);
  background:rgba(255,255,255,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);gap:6px;justify-content:space-between;
  box-shadow:0 22px 44px -16px rgba(32,48,140,.5),0 4px 10px rgba(32,48,140,.12),inset 0 1px 0 #fff}
.tab{flex:1;width:auto;height:48px;border-radius:24px;color:rgba(16,26,61,.5)}
.tab.active{background:linear-gradient(145deg,#6a85f2,#2f49b8);color:#fff;box-shadow:0 10px 20px -8px rgba(47,73,184,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.tab .dot{border-color:#fff;background:#ffd36a}
body.kb .tabbar{display:none}
/* ---- segmented control + library fields */
.seg{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);padding:4px;border-radius:17px;box-shadow:0 10px 22px -14px rgba(32,48,140,.45),inset 0 1px 0 #fff}
.seg button{height:36px;border-radius:13px;color:rgba(16,26,61,.55);transition:background .3s var(--e2),color .3s,box-shadow .3s}
.seg button.on{background:linear-gradient(145deg,#6a85f2,#2f49b8);color:#fff;box-shadow:0 8px 16px -8px rgba(47,73,184,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.add-row .f,#addForm .f{height:50px;border-radius:25px;padding:0 20px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.85));border:1px solid rgba(255,255,255,.95);box-shadow:0 12px 24px -16px rgba(40,60,160,.5),inset 0 1px 0 #fff;margin:0}
.add-btn{background:linear-gradient(145deg,#6a85f2,#2f49b8)!important;color:#fff!important;box-shadow:0 10px 18px -8px rgba(47,73,184,.8)}
.row{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.7));border:0;box-shadow:0 12px 24px -16px rgba(32,48,140,.5),0 1px 0 #fff inset}
.row.cur{background:#fff;box-shadow:0 16px 30px -14px rgba(32,48,140,.6),0 1px 0 #fff inset}
/* ---- lyrics + chat: deep sapphire */
.lyrbg{background:radial-gradient(120% 60% at 50% -5%,rgba(170,190,255,.5),transparent 62%),linear-gradient(176deg,#4d69dc 0%,#2f45ab 46%,#131e5a 100%)}
body.lyr .dock{background:linear-gradient(180deg,#2d409c,#1a2677);box-shadow:0 -20px 46px -16px rgba(5,10,60,.75),inset 0 1px 0 rgba(255,255,255,.3)}
body.lyr .tabbar{background:rgba(14,22,84,.6);border-color:rgba(255,255,255,.16);box-shadow:0 22px 44px -16px rgba(5,10,60,.7),inset 0 1px 0 rgba(255,255,255,.15)}
body.lyr .tab{color:rgba(255,255,255,.6)}
body.lyr .tab.active{background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.14));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 20px -8px rgba(0,0,0,.45)}
.l-head{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));border-color:rgba(255,255,255,.3);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 18px 34px -16px rgba(5,10,60,.7)}
.l-head .round{color:#2f49b8}
.av.ch::after{display:none}
.av.ch{box-shadow:0 0 0 2.5px rgba(255,255,255,.95),0 12px 22px -6px rgba(5,10,60,.7)}
/* lyric area = space above the chat dock */
#lyrics{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 calc(var(--vis,100%) - 80px),transparent var(--vis,100%));mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 calc(var(--vis,100%) - 80px),transparent var(--vis,100%))}
.plainlyr{white-space:pre-wrap;font-size:20px;font-weight:600;line-height:1.7;padding:18px 0;color:rgba(255,255,255,.92)}
/* keyboard: one clean step, no animated resize */
#app,body.in-room #app{transition:none}
body.kb .msgwrap,body.kb .dock{transition:none}
/* bubbles: sender and receiver clearly different */
.m.me .mb{background:linear-gradient(150deg,#6a85f2 0%,#3550c8 100%);color:#fff;box-shadow:0 12px 22px -12px rgba(5,10,70,.85),inset 0 1px 0 rgba(255,255,255,.35);border-radius:22px 22px 7px 22px}
.m.her .mb{background:linear-gradient(180deg,#ffffff,#eef2ff);color:#1b2556;box-shadow:0 12px 22px -14px rgba(5,10,70,.65),inset 0 1px 0 #fff;border-radius:22px 22px 22px 7px}
.m.me:has(+ .m.me) .mb{border-bottom-right-radius:22px}.m.me + .m.me .mb{border-top-right-radius:7px}
.m.her:has(+ .m.her:not(.typing)) .mb{border-bottom-left-radius:22px}.m.her + .m.her .mb{border-top-left-radius:7px}
.m.me .mq{color:rgba(255,255,255,.88);border-color:rgba(255,255,255,.6)}
.m.her .mq{color:#3550c8;border-color:#9db0f6}
.m.typing i{background:#7f95f2}
.send{background:linear-gradient(145deg,#6a85f2,#2f49b8);box-shadow:0 12px 22px -8px rgba(5,10,70,.75),0 2px 4px rgba(5,10,70,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.send:disabled{background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(255,255,255,.24));filter:none;opacity:1}
.reacts button{background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.rx{filter:drop-shadow(0 6px 12px rgba(30,50,160,.4))}
.search{position:relative}
.search .i{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;z-index:3;pointer-events:none}
.search input.f{padding-left:46px!important}

/* Movie soundtrack search */
.album-result{display:flex;gap:12px;align-items:center;padding:10px;margin:8px 0 12px;border-radius:16px;background:rgba(255,255,255,.72);box-shadow:var(--sh1)}
.album-result img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:#d7deed}
.album-result .t{flex:1;min-width:0}.album-result .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-result .s{font-size:13px;color:var(--mut);margin-top:3px}
.album-result button,.album-actions button{border-radius:18px;background:var(--ink);color:#fff;padding:8px 12px;font-size:12px;font-weight:650;white-space:nowrap}
.album-detail{margin:12px 0;padding:12px;border-radius:18px;background:rgba(255,255,255,.76);box-shadow:var(--sh1)}
.album-detail-head{display:flex;gap:12px;align-items:center}.album-detail-head img{width:88px;height:88px;border-radius:12px;object-fit:cover;background:#d7deed}
.album-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.album-actions button.secondary{background:rgba(16,19,24,.08);color:var(--ink)}
.album-track{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--hair)}.album-track .t{flex:1;min-width:0}.album-track .n{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album-track .s{font-size:12px;color:var(--mut)}
.album-track button{width:34px;height:34px;border-radius:50%;background:rgba(16,19,24,.07);flex:none}

/* ================= v9: Ocean theme (soft tide player + library, deep ocean lyrics) ================= */
body.in-room{--ink:#0B3A47;--mut:rgba(11,58,71,.58);--rose:#5CD9EC;--rose2:#0B8CA6;--hair:rgba(11,58,71,.09);--oc:#1FC0DA;--oc2:#0FA3BF;--oc3:#0A7F98}
body.in-room #app{background:linear-gradient(176deg,#F8FDFE 0%,#E8F9FC 52%,#C6EFF6 100%)}
body.in-room .veil{background:linear-gradient(172deg,rgba(248,253,254,.55),rgba(232,249,252,.38) 50%,rgba(198,239,246,.4))}
body.in-room .blob.a{background:#BDEFF7}
body.in-room .blob.b{background:#6FD8EA}
body.in-room .blob.c{background:#EAFBFE}
body.in-room .bg::before{background:radial-gradient(circle,#CDF3F9,transparent 65%)}
body.in-room .bg::after{background:radial-gradient(circle,#7FDDEC,transparent 65%)}
body.in-room .sheet{background:#F8FDFE}
.av.her{background:#1FC0DA}

/* artwork + shadows */
.art,.mini-art,.q-art,.alb-cov{background:linear-gradient(145deg,#CDF3F9,#1FC0DA)}
.art{box-shadow:0 30px 60px -22px rgba(6,70,92,.5),0 8px 20px -10px rgba(6,70,92,.3)}
.playing .art{box-shadow:0 6px 10px rgba(6,56,78,.12),0 26px 50px -12px rgba(11,120,150,.55),0 50px 90px -34px rgba(11,120,150,.5)}
.art::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -40px 60px -40px rgba(6,56,78,.3)}

/* sliders */
.range::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--oc,#1FC0DA) var(--p,0%),rgba(11,58,71,.14) var(--p,0%))}
.range::-moz-range-track{background:linear-gradient(to right,var(--oc,#1FC0DA) var(--p,0%),rgba(11,58,71,.14) var(--p,0%))}
.range::-webkit-slider-thumb{background:#fff;box-shadow:0 0 0 2px #1FC0DA,0 2px 6px rgba(6,56,78,.3)}
.range::-moz-range-thumb{background:#fff;box-shadow:0 0 0 2px #1FC0DA,0 2px 6px rgba(6,56,78,.3)}
.t-play{color:#0FA3BF}

/* player: artwork centred like Apple Music, YouTube frame lives offscreen */
#v-player{padding-left:30px;padding-right:30px}
.art-stage{flex:1 1 auto;min-height:0;display:grid;place-items:center;padding:6px 0 10px}
.art{width:clamp(190px,calc(var(--vvh,100dvh) - 480px),100%);max-width:360px;transform:scale(.86);border-radius:22px}
.yt-host{position:fixed;left:-320px;top:0;width:200px;height:200px;overflow:hidden;pointer-events:none}
#yt-status{display:none!important}

/* tab bar */
body.in-room .tab{color:rgba(11,58,71,.5)}
body.in-room .tab.active{background:linear-gradient(145deg,#4FD6EA,#0FA3BF);color:#fff;box-shadow:0 10px 20px -8px rgba(15,163,191,.85),inset 0 1px 0 rgba(255,255,255,.45)}
body.in-room .tabbar{box-shadow:0 22px 44px -16px rgba(11,120,150,.45),0 4px 10px rgba(11,120,150,.12),inset 0 1px 0 #fff}

/* library */
.seg{box-shadow:0 10px 22px -14px rgba(11,120,150,.45),inset 0 1px 0 #fff}
.seg button{color:rgba(11,58,71,.55)}
.seg button.on{background:linear-gradient(145deg,#4FD6EA,#0FA3BF);color:#fff;box-shadow:0 8px 16px -8px rgba(15,163,191,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.add-btn{background:linear-gradient(145deg,#4FD6EA,#0FA3BF)!important;color:#fff!important;box-shadow:0 10px 18px -8px rgba(15,163,191,.8)}
.row{box-shadow:0 12px 24px -16px rgba(11,120,150,.45),0 1px 0 #fff inset}
.row.cur{box-shadow:0 16px 30px -14px rgba(11,120,150,.55),0 1px 0 #fff inset}
.ib,.plus{box-shadow:0 1px 2px rgba(11,120,150,.1),0 4px 12px -4px rgba(11,120,150,.2)}
.ib:active,.plus:active{background:rgba(31,192,218,.25)}
.stat b{background:linear-gradient(170deg,#5FDCEE,#0A8AA6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 6px 10px rgba(15,163,191,.25))}
.minibar{box-shadow:0 10px 30px -14px rgba(11,120,150,.5)}
.qrow.played{opacity:.62}
.qrow.fresh{animation:fresh 1.8s var(--e2)}
@keyframes fresh{0%{box-shadow:0 0 0 3px rgba(31,192,218,.75),0 0 28px 4px rgba(31,192,218,.55)}100%{box-shadow:0 0 0 0 rgba(31,192,218,0),0 12px 24px -16px rgba(11,120,150,.45)}}

/* search results: albums + OST */
.res-label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:14px 6px 8px}
.alb-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 12px;margin:0 -4px;scroll-snap-type:x proximity}
.alb-row::-webkit-scrollbar{display:none}
.alb-card{flex:none;width:132px;text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.alb-cov{position:relative;display:block;width:132px;height:132px;border-radius:16px;overflow:hidden;box-shadow:0 18px 30px -16px rgba(11,120,150,.7),0 2px 4px rgba(11,120,150,.12)}
.alb-cov img{width:100%;height:100%;object-fit:cover;display:block}
.alb-cov em{position:absolute;left:8px;top:8px;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.92);color:#0A7F98}
.alb-nm{font-size:14px;font-weight:650;line-height:1.2;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alb-sb{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* album detail */
.alb{padding:2px 0 6px}
.alb-back{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 14px 0 8px;border-radius:17px;background:rgba(255,255,255,.78);box-shadow:var(--sh1);font-size:14px;font-weight:600;color:var(--rose2);margin:2px 0 12px}
.alb-back .i{width:18px;height:18px}
.alb-hero{position:relative;display:flex;gap:16px;align-items:flex-end;padding:16px;border-radius:24px;background:linear-gradient(165deg,#1FC0DA,#0A7F98);color:#fff;overflow:hidden;box-shadow:0 24px 40px -20px rgba(11,120,150,.8)}
.alb-hero::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.16)}
.alb-hero::after{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.alb-hero .cov{position:relative;z-index:1;flex:none;width:112px;height:112px;border-radius:16px;overflow:hidden;background:#CDF3F9;box-shadow:0 16px 28px -12px rgba(2,28,42,.6)}
.alb-hero .cov img{width:100%;height:100%;object-fit:cover;display:block}
.alb-meta{position:relative;z-index:1;min-width:0}
.alb-type{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.alb-meta h3{margin:4px 0;font-size:21px;font-weight:800;line-height:1.1;letter-spacing:-.03em;color:#fff;overflow-wrap:anywhere}
.alb-sub{font-size:13px;color:rgba(255,255,255,.9)}
.alb-actions{display:flex;gap:10px;margin:14px 0 10px}
.alb-actions button{flex:1;height:48px;border-radius:24px;font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}
.alb-actions .i{width:18px;height:18px}
.alb-actions .alb-play{background:linear-gradient(145deg,#4FD6EA,#0FA3BF);color:#fff;box-shadow:0 14px 24px -10px rgba(15,163,191,.85),inset 0 1px 0 rgba(255,255,255,.45)}
.alb-actions .alb-addall{background:rgba(255,255,255,.85);color:#0A7F98;box-shadow:var(--sh1)}
.alb-tracks{background:rgba(255,255,255,.72);border-radius:20px;padding:4px 8px;box-shadow:var(--sh1)}
.alb-track{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--hair)}
.alb-track:first-child{border-top:0}
.alb-track .no{width:22px;text-align:center;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.alb-track .t{flex:1;min-width:0}
.alb-track .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb-track .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb-track .d{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.alb-track button{width:34px;height:34px;border-radius:50%;background:rgba(31,192,218,.14);color:#0A8AA6;display:grid;place-items:center;flex:none}
.alb-track button .i{width:16px;height:16px}

/* lyrics page: deep ocean */
body.in-room .lyrbg{background:radial-gradient(120% 60% at 50% -5%,rgba(31,192,218,.5),transparent 62%),linear-gradient(176deg,#0E86A3 0%,#0A5C78 46%,#05364C 100%)}
body.in-room.lyr .dock{background:linear-gradient(180deg,#0A6A87,#06384E);box-shadow:0 -20px 46px -16px rgba(2,28,42,.75),inset 0 1px 0 rgba(255,255,255,.3)}
body.in-room.lyr .tabbar{background:rgba(4,44,62,.62);border-color:rgba(255,255,255,.16);box-shadow:0 22px 44px -16px rgba(2,28,42,.7),inset 0 1px 0 rgba(255,255,255,.15)}
body.in-room.lyr .tab{color:rgba(255,255,255,.62)}
body.in-room.lyr .tab.active{background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.14));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 20px -8px rgba(0,0,0,.4)}
.l-head{background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.1));box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 18px 34px -16px rgba(2,28,42,.7)}
.l-head .round{color:#0A7F98}

/* lyrics type + word sweep (Apple Music style) */
#lyrics{font-family:"Plus Jakarta Sans","Noto Sans Telugu","SF Pro Display",var(--sans)}
.line{font-size:31px;font-weight:800;line-height:1.16;letter-spacing:-.035em;padding:9px 0;color:#fff;opacity:.42;transform:scale(.92);
  filter:blur(calc(min(var(--d,4),3)*.6px)) drop-shadow(0 0 0 rgba(110,230,250,0));
  transition:transform .8s var(--spring),opacity .7s var(--e2),filter .8s var(--e2),translate 1.05s var(--spring) calc(var(--k,0)*42ms)}
.line.active{transform:scale(1);opacity:1;filter:blur(0) drop-shadow(0 0 16px rgba(110,230,250,.4))}
.line .w{display:inline-block;transform-origin:50% 90%;transition:transform .5s var(--spring),filter .5s var(--e2)}
.line.active .w{color:transparent;background:linear-gradient(90deg,#fff calc(var(--wp,0)*118% - 18%),rgba(255,255,255,.36) calc(var(--wp,0)*118%));-webkit-background-clip:text;background-clip:text}
.line.active .w.on{transform:translateY(-3px) scale(1.07);filter:drop-shadow(0 0 12px rgba(150,245,255,.95))}
#lyrics.plainmode .line{opacity:.95;transform:none;filter:none;font-size:24px;font-weight:700;line-height:1.35;cursor:default}
.lyr-empty{font-family:"Plus Jakarta Sans",var(--sans);font-style:normal;font-weight:800;font-size:26px;letter-spacing:-.02em;color:rgba(255,255,255,.88);text-align:center;padding-top:20vh}
.lyr-empty.load{display:flex;justify-content:center;gap:8px}
.lyr-empty.load i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.4;animation:tdot 1.1s ease-in-out infinite}
.lyr-empty.load i:nth-child(2){animation-delay:.15s}
.lyr-empty.load i:nth-child(3){animation-delay:.3s}
#lyricsSource{display:none!important}
.lyr-toggle{position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 8px + 88px);z-index:3;height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:600;letter-spacing:.02em}

/* chat bubbles */
.m.me .mb{background:linear-gradient(150deg,#35D2E8 0%,#0A93AF 100%);color:#fff;box-shadow:0 12px 22px -12px rgba(2,28,42,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.m.her .mb{background:linear-gradient(180deg,#fff,#E6F8FB);color:#0B3A47;box-shadow:0 12px 22px -14px rgba(2,28,42,.65),inset 0 1px 0 #fff}
.m.her .mq{color:#0A8AA6;border-color:#8EDCEA}
.m.typing i{background:#35D2E8}
.send{background:linear-gradient(145deg,#4FD6EA,#0FA3BF);box-shadow:0 12px 22px -8px rgba(2,28,42,.7),0 2px 4px rgba(2,28,42,.25),inset 0 1px 0 rgba(255,255,255,.5)}

/* swipe to reply */
.m{position:relative;touch-action:pan-y;animation-fill-mode:backwards;transition:transform .35s var(--spring)}
.m.swiping{transition:none}
.rpi{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:rgba(255,255,255,.95);color:#0A8AA6;display:grid;place-items:center;opacity:var(--sw,0);transform:scale(calc(.5 + var(--sw,0)*.5));pointer-events:none;box-shadow:0 6px 14px -6px rgba(2,28,42,.6)}
.rpi.l{left:-42px}.rpi.r{right:-42px}
.rpi .i{width:16px;height:16px}
.m.fired .rpi{background:#1FC0DA;color:#fff}
.quote{display:flex;align-items:stretch;gap:10px;padding:8px 8px 8px 10px;border-radius:14px;background:rgba(255,255,255,.18);margin:0 2px 8px}
.quote .qbar{width:3px;border-radius:2px;background:#5CE0F2;flex:none}
.quote .qtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.quote .qtxt b{font-size:12px;font-weight:700;color:#7FE7F6;letter-spacing:.02em}
.quote .qtxt span{display:block;flex:none;font-family:var(--sans);font-style:normal;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote button{align-self:center}

/* message popup */
.banner{left:14px;right:14px;width:calc(100% - 28px);padding:12px 14px 15px;border-radius:22px;gap:12px;background:rgba(255,255,255,.88);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 20px 40px -14px rgba(6,70,92,.5),0 4px 10px rgba(6,70,92,.12);overflow:hidden;opacity:0;transform:translateY(-150%) scale(.96);transition:transform .6s var(--spring),opacity .4s}
.banner.show{transform:none;opacity:1}
.banner .av{width:44px;height:44px;font-size:16px;box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px rgba(31,192,218,.55),0 8px 16px -6px rgba(6,70,92,.5)}
.banner .n{font-size:13px;font-weight:700;color:#0A7F98;letter-spacing:.01em}
.banner .s{font-size:15px;color:#0B3A47;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.bn-time{align-self:flex-start;font-size:11px;color:var(--mut);margin-top:2px}
.bn-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,#4FD6EA,#0FA3BF);transform-origin:left;transform:scaleX(0)}
.banner.show .bn-bar{animation:bnbar 4.8s linear forwards}
@keyframes bnbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* login arrival popup */
.greet{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:11;display:flex;align-items:center;gap:12px;padding:9px 22px 9px 9px;border-radius:34px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid #fff;
  box-shadow:0 22px 44px -14px rgba(6,70,92,.55),0 4px 10px rgba(6,70,92,.14);transform:translate(-50%,-170%) scale(.9);opacity:0;pointer-events:none;transition:transform .7s var(--spring),opacity .35s;max-width:calc(100% - 28px);white-space:nowrap}
.greet.show{transform:translate(-50%,0) scale(1);opacity:1}
.gv{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center}
.gv::before,.gv::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #1FC0DA;opacity:0}
.greet.show .gv::before{animation:gring 1.8s ease-out .2s 2}
.greet.show .gv::after{animation:gring 1.8s ease-out .8s 2}
@keyframes gring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.greet .av{width:46px;height:46px;font-size:18px;box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px rgba(31,192,218,.6)}
.greet .av::after{display:none}
.gt{display:flex;flex-direction:column;gap:3px;min-width:0}
.gt small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#0A8AA6;font-weight:600}
.gt b{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#0B3A47;overflow:hidden;text-overflow:ellipsis}

/* reactions */
.rx-ring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid rgba(255,255,255,.9);box-shadow:0 0 24px 6px rgba(31,192,218,.7),inset 0 0 18px rgba(31,192,218,.5);animation:rxring .85s cubic-bezier(.2,.7,.2,1) forwards;pointer-events:none}
@keyframes rxring{from{transform:scale(.3);opacity:.95}to{transform:scale(6);opacity:0}}
.rxe{position:absolute;display:grid;place-items:center;line-height:1;pointer-events:none;will-change:transform,opacity;filter:drop-shadow(0 6px 14px rgba(6,70,92,.45))}
.rxe img{width:100%;height:100%;object-fit:contain;display:block}
.reacts{gap:8px;padding:6px 2px 8px}
.reacts button{height:44px;font-size:24px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 16px -10px rgba(2,28,42,.7)}
.reacts button.hit{animation:hitpop .55s var(--spring)}
@keyframes hitpop{0%{transform:scale(1)}30%{transform:scale(1.35) translateY(-5px)}100%{transform:scale(1)}}

/* ===== Sunset ocean + blush clouds background ===== */
.sunset{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#bfe6f2 0%,#d9ecf3 18%,#fbe1e2 40%,#ffd0cf 54%,#f8b9c0 64%,#7fc4d8 66%,#2aa3c4 78%,#0b6d94 100%)}
.sunset .sun{position:absolute;left:50%;top:50%;width:230px;height:230px;margin-left:-115px;border-radius:50%;background:radial-gradient(circle,#fff6ee 0 28%,rgba(255,214,205,.95) 42%,rgba(255,170,185,.45) 62%,transparent 72%);filter:blur(4px);animation:sunbreath 9s ease-in-out infinite alternate}
.sunset .cloud{position:absolute;height:54px;border-radius:50px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,214,222,.7));filter:blur(9px);opacity:.8;animation:cloudmove 60s linear infinite}
.sunset .cloud.c1{width:230px;top:12%;left:-260px}
.sunset .cloud.c2{width:300px;top:24%;left:-340px;animation-duration:85s;animation-delay:-30s;opacity:.65}
.sunset .cloud.c3{width:200px;top:36%;left:-240px;animation-duration:70s;animation-delay:-52s;background:linear-gradient(180deg,rgba(255,226,232,.9),rgba(250,170,190,.6))}
.sunset .waves{position:absolute;left:0;right:0;bottom:0;height:46%}
.sunset .wv{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wavemove 14s linear infinite}
.sunset .wv.w2{animation-duration:20s;animation-direction:reverse;opacity:.75;bottom:-3%}
.sunset .wv.w3{animation-duration:28s;opacity:.55;bottom:-7%}
.sunset .glint{position:absolute;left:50%;top:60%;width:120px;height:36%;margin-left:-60px;background:repeating-linear-gradient(180deg,rgba(255,235,225,.75) 0 2px,transparent 2px 14px);filter:blur(1px);opacity:.45;mask-image:linear-gradient(180deg,#000,transparent);-webkit-mask-image:linear-gradient(180deg,#000,transparent);animation:sunbreath 6s ease-in-out infinite alternate}
.sunset .petal{position:absolute;top:-30px;width:12px;height:16px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#ffd6e0,#ff9fb8);opacity:.75;animation:petalfall linear infinite}
@keyframes sunbreath{from{transform:scale(.96);opacity:.85}to{transform:scale(1.06);opacity:1}}
@keyframes cloudmove{to{transform:translateX(calc(100vw + 600px))}}
@keyframes wavemove{to{transform:translateX(-50%)}}
@keyframes petalfall{0%{transform:translate3d(0,-30px,0) rotate(0)}50%{transform:translate3d(40px,48vh,0) rotate(180deg)}100%{transform:translate3d(-20px,105vh,0) rotate(360deg)}}
.veil{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 50%,rgba(6,70,100,.18))!important}
.blob,.bg::before,.bg::after,.grain{display:none!important}
.artglow.on{opacity:.18}
@media(prefers-reduced-motion:reduce){.sunset *{animation:none!important}}

/* ocean-blue text on the blush sky, frosted art shadow */
body.in-room .title{color:#0a4560}
body.in-room .artist{color:#0e86a8}
.playing .art{box-shadow:0 8px 14px rgba(120,40,70,.12),0 30px 60px -14px rgba(255,120,150,.55),0 50px 90px -34px rgba(11,120,150,.55)!important}

/* seek + volume: neutral, not blue */
.range::-webkit-slider-runnable-track{background:linear-gradient(to right,#37474f var(--p,0%),rgba(55,71,79,.2) var(--p,0%))!important}
.range::-moz-range-track{background:linear-gradient(to right,#37474f var(--p,0%),rgba(55,71,79,.2) var(--p,0%))!important}
.range::-webkit-slider-thumb{background:#fff!important;box-shadow:0 0 0 2px #37474f,0 2px 6px rgba(0,0,0,.25)!important}
.range::-moz-range-thumb{background:#fff!important;box-shadow:0 0 0 2px #37474f,0 2px 6px rgba(0,0,0,.25)!important}
.vol,.times{color:rgba(40,55,62,.7)!important}

/* favourite heart: red */
.heart.on,.heart.on .i,body.lyr .dock .heart.on{color:#ef233c!important}
.heart.on .i{filter:drop-shadow(0 2px 6px rgba(239,35,60,.45))}

/* ===== v3: login layout, birds, player, tabs, lyrics ===== */
.artglow,.veil{display:none!important}
.sunset .sun{top:42%;margin-top:-115px;width:240px;height:240px;margin-left:-120px}
#welcome{padding:calc(env(safe-area-inset-top) + 20px) 26px calc(env(safe-area-inset-bottom) + 22px)}
.w-head{flex:none;text-align:center}
#welcome .w-art{flex:1 1 0;min-height:0;margin:0}
#welcome .avatar-btn.big{margin:0 auto 6px;width:84px;height:84px}
#welcome .hello{margin:0;font-size:clamp(28px,8.4vw,36px);color:#0a4560;text-shadow:0 2px 14px rgba(255,255,255,.65)}
#welcome .hello .h{color:#e0607c}
body.kb #welcome .w-art{min-height:0;opacity:1}
#welcomeForm .field{margin-bottom:8px}
#welcomeForm .f{height:48px;border-radius:24px;font-size:15px;padding:0 18px 0 48px}
#welcomeForm .field .i{left:18px;width:18px;height:18px;color:#0b5d7a}
#welcomeForm .primary{height:50px;border-radius:25px;margin-top:2px;background:#e0607c;box-shadow:0 8px 16px -8px rgba(120,20,50,.55);backdrop-filter:none;-webkit-backdrop-filter:none}
#welcomeForm .primary::before{display:none!important}
#welcomeForm .avatar-btn::after{background:#e0607c;color:#fff}
#welcomeForm .avatar-btn.big{background:#fff}

/* birds */
.sunset .birds{position:absolute;inset:0;pointer-events:none}
.sunset .bird{position:absolute;left:-60px;color:rgba(110,45,80,.7);animation:birdfly linear infinite}
.sunset .bird svg{display:block;width:100%;height:auto;animation:flap .7s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes birdfly{0%{transform:translate(0,0)}25%{transform:translate(28vw,-16px)}50%{transform:translate(58vw,6px)}75%{transform:translate(88vw,-12px)}100%{transform:translate(calc(100vw + 120px),0)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}

/* room scene: horizon higher so info + controls sit on the ocean */
body.in-room .sunset{background:linear-gradient(180deg,#bfe6f2 0%,#d9ecf3 12%,#fbe1e2 26%,#ffd0cf 38%,#f8b9c0 46%,#7fc4d8 48%,#2aa3c4 62%,#0b6d94 82%,#075078 100%)}
body.in-room .sunset .waves{height:54%}
body.in-room .sunset .sun{top:30%}
body.in-room .sunset .glint{top:48%}

/* player text/controls: white on ocean */
#v-player .title{color:#fff;text-shadow:0 2px 12px rgba(4,50,80,.55)}
#v-player .artist{color:#ffe4ea;text-shadow:0 1px 8px rgba(4,50,80,.5)}
#v-player .heart{background:rgba(255,255,255,.22);color:#fff}
#v-player .heart.on{color:#ef233c!important;background:rgba(255,255,255,.9)}
#v-player .times,#v-player .vol{color:rgba(255,255,255,.88)!important}
#v-player .transport button,#v-player .t-play{color:#fff;filter:drop-shadow(0 3px 8px rgba(4,50,80,.4))}
