.range::-webkit-slider-runnable-track{background:linear-gradient(to right,#fff var(--p,0%),rgba(255,255,255,.32) var(--p,0%))!important}
.range::-moz-range-track{background:linear-gradient(to right,#fff var(--p,0%),rgba(255,255,255,.32) var(--p,0%))!important}
.range::-webkit-slider-thumb{background:#fff!important;box-shadow:0 0 0 2px rgba(255,255,255,.6),0 2px 8px rgba(4,50,80,.4)!important}
.range::-moz-range-thumb{background:#fff!important;box-shadow:0 0 0 2px rgba(255,255,255,.6),0 2px 8px rgba(4,50,80,.4)!important}

/* tabs: dusk rose instead of blue */
body.in-room .tabbar,.tabbar{background:rgba(255,255,255,.58);border-color:rgba(255,255,255,.8);box-shadow:0 18px 40px -16px rgba(80,30,60,.45),inset 0 1px 0 rgba(255,255,255,.8)}
body.in-room .tab,.tab{color:rgba(80,40,60,.6)}
body.in-room .tab.active,.tab.active{background:linear-gradient(145deg,#f4a2b3,#d9607a);color:#fff;box-shadow:0 10px 20px -8px rgba(217,96,122,.8),inset 0 1px 0 rgba(255,255,255,.45)}
.seg button.on,body.in-room .seg button.on{background:linear-gradient(145deg,#f4a2b3,#d9607a);color:#fff;box-shadow:0 8px 16px -8px rgba(217,96,122,.8)}
.add-btn{background:linear-gradient(145deg,#f4a2b3,#d9607a)!important;box-shadow:0 10px 18px -8px rgba(217,96,122,.8)!important}
.tab .dot{background:#ffd36a;border-color:#fff}

/* lyrics: sunset shows through, transparent header */
body.in-room .lyrbg,.lyrbg{background:linear-gradient(180deg,rgba(8,60,92,.38) 0%,rgba(7,70,102,.5) 55%,rgba(5,52,82,.72) 100%)}
.l-head{background:transparent!important;border:0!important;box-shadow:none!important}
body.lyr .l-head .title{color:#fff;text-shadow:0 2px 10px rgba(4,50,80,.55)}
body.lyr .l-head .artist{color:#ffe4ea;opacity:1}
.l-head .round{background:rgba(255,255,255,.9)!important;color:#d9607a!important}
body.in-room.lyr .dock,body.lyr .dock{background:rgba(7,60,90,.55)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.in-room.lyr .tabbar,body.lyr .tabbar{background:rgba(7,60,90,.5);border-color:rgba(255,255,255,.2)}
body.lyr .tab,body.in-room.lyr .tab{color:rgba(255,255,255,.75)}
body.lyr .tab.active,body.in-room.lyr .tab.active{background:linear-gradient(145deg,#f4a2b3,#d9607a);color:#fff}
.sunset .glint{opacity:.28;background:repeating-linear-gradient(180deg,rgba(255,235,225,.7) 0 2px,transparent 2px 18px)}
</style>
</head>

<div id="app">
  <div class="bg"><div class="sunset" id="sunset"><div class="sun"></div><div class="birds" id="birds"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="glint"></div><div class="waves">

<svg class="wv w2" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 90 Q150 40 300 90 T600 90 T900 90 T1200 90 V200 H0Z" fill="#0f7099"/></svg>

  <!-- =============== WELCOME =============== -->
  <section class="screen" id="welcome">
    <div class="w-head">
      <label for="avatarInput" id="avatarPick" class="avatar-btn big" aria-label="Choose your photo"><span id="avatarPreview">♡</span><span id="avatarPickText" hidden></span></label>
      <h1 class="hello">Hello, <em id="helloName">there</em> <span class="h">♡</span></h1>
    </div>
    <div class="w-art"></div>

    <form class="w-form" id="welcomeForm" autocomplete="off">
      <div class="field"><svg class="i"><use href="#i-user"/></svg><input class="f" id="nameInput" placeholder="Your name" maxlength="20" aria-label="Your name"></div>
      <input id="roomCodeInput" type="hidden" value="">
      <div class="field" id="passwordField"><svg class="i"><use href="#i-lock"/></svg><input class="f" id="roomPasswordInput" type="password" placeholder="Password" maxlength="24" aria-label="Password" autocomplete="current-password"></div>
      <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <button class="primary" id="goBtn" type="submit"><span id="goLabel">Let’s Listen!</span><svg class="i"><use href="#i-arrow"/></svg></button>
    </form>
  </section>

  <!-- =============== ROOM =============== -->
  <div id="room" class="hidden">
    <header class="top">
      <button class="pill" id="pill" aria-label="Room">
        <span class="av me on" id="avMe">K</span>
        <span class="link"><i></i><i></i><i></i></span>
        <span class="av her" id="avHer">♡</span>
      </button>
    </header>

    <main>
      <!-- NOW PLAYING -->
      <section class="view active" id="v-player">
        <div class="art-stage"><div class="art" id="art"></div></div>
        
        
        <div class="info">
          <div class="t"><div class="title" id="title">Pick your first song</div><div class="artist" id="artist">Add one in Library</div></div>
          <button class="round heart" id="fav" aria-label="Favourite"><svg class="i"><use href="#i-heart"/></svg></button>
        </div>
        <div class="seekwrap">
          <input class="range" id="seek" type="range" min="0" max="1000" value="0" aria-label="Progress">
          <div class="times"><span id="elapsed">0:00</span><span id="remain">-0:00</span></div>
        </div>
        <div class="transport">
          <button class="t-skip" id="back15" aria-label="Back 15 seconds"><svg class="i"><use href="#i-back15"/></svg></button>
          <button class="t-step" id="prev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
          <button class="t-play" id="play" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
          <button class="t-step" id="next" aria-label="Next"><svg class="i flip"><use href="#i-prev"/></svg></button>
          <button class="t-skip" id="fwd15" aria-label="Forward 15 seconds"><svg class="i"><use href="#i-fwd15"/></svg></button>
        </div>
        <div class="vol">
          <svg class="i"><use href="#i-vlow"/></svg>
          <input class="range" id="vol" type="range" min="0" max="100" value="75" aria-label="Volume">
          <svg class="i"><use href="#i-vhigh"/></svg>
        </div>
      </section>

      <!-- LYRICS + CHAT -->
      <section class="view" id="v-lyrics">
        <div class="l-head">
          <div class="mini-art" id="miniArt"></div>
          <div class="t"><div class="title" id="title2"></div><div class="artist" id="artist2"></div></div>
          <button class="round" id="play2" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
        </div>
        <div id="lyrics"></div><div id="lyricsSource"></div><button type="button" id="lyrToggle" class="lyr-toggle hidden"></button>
        <div class="dock" id="dock">
          <div id="floats" class="hidden"></div>
          <div class="chat-head" aria-hidden="true"><div class="av her ch" id="chatAv">♡</div></div>
          <button type="button" class="ib ch-clear" id="chatClearBtn" aria-label="Clear conversation"><svg class="i"><use href="#i-trash"/></svg></button>
          <button class="grab" id="grab" aria-label="Show conversation"></button>
          <div class="msgwrap"><div class="msgs" id="msgs"></div></div>
          <div class="quote hidden" id="quote"><i class="qbar"></i><div class="qtxt"><b id="quoteWho"></b><span id="quoteText"></span></div><button id="quoteX" aria-label="Remove quote"><svg class="i"><use href="#i-x"/></svg></button></div>

          <form class="add-row" id="addForm" autocomplete="off">

          <div id="results"></div>
          <div class="qhead"><span class="label">Up next</span><span class="qtools"><button type="button" id="shuffleQueueBtn" class="ib" aria-label="Shuffle queue"><svg class="i"><use href="#i-shuffle"/></svg></button><button type="button" id="clearQueueBtn" class="ib" aria-label="Clear queue"><svg class="i"><use href="#i-trash"/></svg></button></span></div>
          <div id="queue"></div>
          <div class="qhead"><span class="label">Suggested</span><button type="button" id="refreshRecsBtn" class="ib" aria-label="Refresh suggestions"><svg class="i"><use href="#i-refresh"/></svg></button></div>
          <div id="recommendations"><div class="empty">Suggestions appear as you listen</div></div>
        </div>

        <div class="pane hidden" id="panePl">
          <div class="label" id="lblMine">Yours</div>
          <form class="add-row" data-owner="me"><input class="f" placeholder="Paste a playlist link" aria-label="Your playlist link"><button class="add-btn" type="submit">Add</button></form>
          <div class="imp"><input id="spotifyCsvInput" type="file" accept=".csv,text/csv" hidden><button class="ghost" id="spotifyCsvBtn" type="button"><svg class="i"><use href="#i-down"/></svg>Import Spotify CSV</button></div>
          <div id="plMe"></div>
          <div class="label" id="lblHer">Hers</div>
          <div id="plHer"></div>
          <div class="room-foot" id="footCode"></div>
        </div>

        <div class="pane hidden" id="paneFav">
          <div class="stats" id="stats"></div>
          <div class="fsel" id="fsel"></div>
          <div id="favList"></div>
          <div class="qhead"><span class="label">Recently played</span><button type="button" class="ghost hidden" id="clearHistoryBtn" style="margin-left:auto;padding:6px 10px;font-size:12px">Clear</button></div>
          <div id="histList"></div>
        </div>

        <div class="minibar" id="minibar">
          <div class="mini-art" id="miniArt2"></div>
          <div class="t"><div class="title" id="title3"></div><div class="artist" id="artist3"></div></div>
          <button class="pp" id="play3" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab active" data-v="player" aria-label="Now playing"><svg class="i"><use href="#i-note"/></svg></button>
      <button class="tab" data-v="lyrics" aria-label="Lyrics and chat"><svg class="i"><use href="#i-lyrics"/></svg><span class="dot hidden" id="unreadDot"></span></button>
      <button class="tab" data-v="library" aria-label="Library"><svg class="i"><use href="#i-list"/></svg></button>
    </nav>
  </div>

  <!-- overlays -->
  <input id="duotune-avatar-file" type="file" accept="image/*" hidden>
  <div id="fx"></div>
  <div class="yt-host" aria-hidden="true"><div class="yt-embed-frame" id="yt-player"></div></div>
  <div id="yt-status" hidden></div>
  <button class="banner" id="banner"><span class="av her" id="banAv">♡</span><span class="t"><div class="n" id="banName"></div><div class="s" id="banText"></div></span><span class="bn-time">now</span><i class="bn-bar"></i></button>
  <div class="greet" id="greet"><span class="gv"><span class="av her" id="greetAv">♡</span></span><span class="gt"><small>Online now</small><b id="greetMain"></b></span></div>
  <div class="sheet-bg" id="sheetBg"></div>

<script>
  // Existing DuoTune application code
/* ==========================================================================
   DUOTUNE · frontend
   --------------------------------------------------------------------------
   HOW TO WIRE THE BACKEND
   1. Set MOCK = false.
   2. Listen for what the user does:       DuoTune.on('player:play', fn) ...
   3. Push remote state into the UI:       DuoTune.ui.setPlaying(true) ...

   UI → backend events (payloads)
     room:connect   {name, code, creating}     invite URL joins existing room
     room:leave     {}
     player:play    {seconds}   player:pause {seconds}   player:seek {seconds}
     player:next    {}          player:prev  {}           player:volume {value 0-100} (local only)
     queue:play     {index}     queue:add    {videoId?, url?, title?, artist?}
     search         {query}
     chat:send      {text, quote|null}      reaction:send {emoji}
     playlist:add   {owner:'me', url}   saves to personal library, not queue
     favorite:toggle {liked}

   backend → UI  (DuoTune.ui.*)
     enterRoom({name, code})      setPresence({me:{name,online}, her:{name,online}})
     setNowPlaying(song|null)     song = {id,title,artist,img?,dur}
     setPlaying(bool)             setProgress(pos, dur)
     setQueue(list, index)        setLyrics(lrcString)
     receiveMessage({text, quote?})   receiveReaction(emoji)
     setPlaylists({me:[urls], her:[urls]})   setSearchResults([{videoId,title,artist}])
   Own chat messages / reactions are shown optimistically by the UI.
   ========================================================================== */
const MOCK = false;

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = (id, cls='') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const fmt = t => { t = Math.max(0, Math.floor(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
const store = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };

/* ---------- event bridge ---------- */

const act = (type, payload, local) => { DuoTune.emit(type, payload); if (MOCK && local) local(); };

const S = { me:{name:'Kiran',online:true}, her:{name:'',online:false}, code:'', playing:false, pos:0, dur:0,

const PALETTES = [
  {a:'#d3f3f9',b:'#5fd3e6',c:'#1196b3',d:'#06384e',s:'#f2fcfe'},
  {a:'#dbf6fa',b:'#7fdcec',c:'#2aa9c4',d:'#0a4f66',s:'#f6fdfe'},
  {a:'#d6eef6',b:'#6fbfd8',c:'#1f7d9f',d:'#073b52',s:'#f3fafd'}];
/* ==========================================================================
   UI ADDITIONS · thumbnails, art glow, smooth progress, favourites, stats, dialogs
   (UI layer only; the Supabase adapter below is untouched except where marked "UI-FIX")
   ========================================================================== */
const ytThumb=(id,q)=>`https://i.ytimg.com/vi/${id}/${q}.jpg`;
const songKey=s=>{const k=s&&(ytVideoId(s)||s.videoId||s.id);return k||'';};
const gradArt=(i=0)=>{const p=PALETTES[(i<0?0:i)%PALETTES.length];return `<div class="art-css" style="--a:${p.a};--b:${p.b};--c:${p.c};--d:${p.d};--s:${p.s}"></div>`;};
/* thumbnail chain: maxres (big) -> mq -> default -> gradient. Square-crops the 16:9 frame, so no black bars. */
window.artErr=function(img){
  const n=+(img.dataset.try||0), id=img.dataset.id;
  if(id&&n<2){img.dataset.try=n+1;img.src=ytThumb(id,['mqdefault','default'][n]);return;}
  img.outerHTML=gradArt(0);
};
const artHTML=(song,i=0,big=false)=>{
  const k=song?songKey(song):'';
  const yt=/^[\w-]{11}$/.test(k)?k:null;
  const src=yt?ytThumb(yt,big?'maxresdefault':'mqdefault'):(song?.img||null);
  return src?`<img alt="" decoding="async" referrerpolicy="no-referrer" ${yt?`data-id="${yt}" data-try="${big?0:1}"`:''} src="${esc(src)}" onerror="artErr(this)">`:gradArt(i);
};
function setArtGlow(song){
  const el=$('#artglow'); if(!el)return;

  if(!src){el.classList.remove('on');return;}
  const im=new Image(); im.onload=()=>{el.style.backgroundImage=`url("${src}")`;el.classList.add('on');}; im.onerror=()=>el.classList.remove('on'); im.src=src;

/* ---- smooth progress: the player reports once a second, the UI interpolates between reports ---- */
const estPos=()=>S.playing?Math.min(S.dur||1e9,S.pos+(performance.now()-(S._tAt||performance.now()))/1000):S.pos;
function paintProgress(p){
  const pct=S.dur?Math.min(100,Math.max(0,p/S.dur*100)):0;
  if(!S.dragging){const sk=$('#seek');sk.value=pct*10;sk.style.setProperty('--p',pct+'%');}
  $('#elapsed').textContent=fmt(p); $('#remain').textContent='-'+fmt((S.dur||0)-p);
}
let _raf=0;
function frame(){
  _raf=0; if(!S.playing)return;
  const p=estPos();
  if(S.view==='player')paintProgress(p);
  if(S.view==='lyrics')updateLine(p);
  _raf=requestAnimationFrame(frame);
}
function kickFrame(){ if(!_raf&&S.playing)_raf=requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ S.pos=estPos(); S._tAt=performance.now(); kickFrame(); } /* Never pause or reload on backgrounding; browser/YouTube may still suspend playback. */ });
/* Viewport + keyboard: one rAF-throttled handler drives CSS variables only (no inline height/top fights). */
(function(){
  const root=document.documentElement, vv=window.visualViewport;
  let maxH=Math.max(window.innerHeight,vv?vv.height:0), raf=0, lastKb=null;
  const apply=()=>{
    raf=0;
    const h=vv?vv.height:window.innerHeight, top=vv?vv.offsetTop:0;
    if(h>maxH-60)maxH=Math.max(maxH,h);
    const kb=h<maxH-120;
    root.style.setProperty('--vvh',Math.round(h)+'px');
    root.style.setProperty('--vvt',Math.round(top)+'px');
    if(kb!==lastKb){ lastKb=kb; document.body.classList.toggle('kb',kb); if(window.followLine)followLine(420);
      if(kb)setTimeout(()=>{const l=document.getElementById('msgs'); if(l)l.scrollTop=l.scrollHeight;},330); }
  };
  const sched=()=>{ if(!raf)raf=requestAnimationFrame(apply); };
  (vv||window).addEventListener('resize',sched,{passive:true});
  if(vv)vv.addEventListener('scroll',()=>{ window.scrollTo(0,0); sched(); },{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(()=>{maxH=vv?vv.height:window.innerHeight;sched();},400));
  apply();
})();

/* ---- listening stats (kept on this device; history rows are merged in from the shared table when it exists) ---- */
const STATKEY=()=>'duotune_stats_'+(S.code||'room');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function statsLoad(){
  let st=null; try{st=JSON.parse(store.get(STATKEY())||'null');}catch{}
  S.stats=st&&typeof st==='object'?st:{sec:0,tracks:0,days:{},hist:[],resetAt:null};
  S.stats.days=S.stats.days||{}; S.stats.hist=S.stats.hist||[]; S.stats.resetAt=S.stats.resetAt||null;
}
let _statAcc=0,_statSong=null,_statCounted=false;
setInterval(()=>{
  if(!S.playing||!S.song||!S.stats)return;
  const k=songKey(S.song); if(k!==_statSong){_statSong=k;_statAcc=0;_statCounted=false;}
  S.stats.sec+=1; const d=dayKey(); S.stats.days[d]=(S.stats.days[d]||0)+1; _statAcc++;
  if(!_statCounted&&_statAcc>=30){
    _statCounted=true; S.stats.tracks++;
    S.stats.hist.unshift({id:k,title:S.song.title,artist:S.song.artist||'',img:S.song.img||null,by:S.me.name,at:Date.now()});
    S.stats.hist=S.stats.hist.slice(0,60);
  }
  if(_statAcc%15===0)store.set(STATKEY(),JSON.stringify(S.stats));
  if(S.view==='library'&&!$('#paneFav').classList.contains('hidden')&&_statAcc%5===0)renderStats();
},1000);
const fmtTime=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h}<small>h</small>${m}<small>m</small>`:`${m}<small>m</small>`;};
const ago=t=>{const s=Math.max(1,(Date.now()-t)/1000|0);if(s<3600)return Math.max(1,s/60|0)+'m ago';if(s<86400)return (s/3600|0)+'h ago';const d=s/86400|0;return d===1?'yesterday':d+'d ago';};
function resetListeningStats(resetAt=new Date().toISOString()){
  S.stats={sec:0,tracks:0,days:{},hist:[],resetAt};
  _statAcc=0; _statSong=S.song?songKey(S.song):null; _statCounted=false;
  store.set(STATKEY(),JSON.stringify(S.stats));
  renderStats();
}
async function duotuneSyncStatsReset(){
  if(!duotuneSupabase||!S.code)return;
  try{
    const {data,error}=await duotuneSupabase.from('duotune_stats_resets').select('reset_at').eq('room_code',S.code).maybeSingle();
    if(error)throw error;
    const shared=data?.reset_at?new Date(data.reset_at).getTime():0;
    const local=S.stats?.resetAt?new Date(S.stats.resetAt).getTime():0;
    if(shared>local)resetListeningStats(data.reset_at);
  }catch(e){console.warn('[DUOTUNE] Shared stats reset marker unavailable:',e.message);}
}
function renderStats(){
  const st=S.stats,el=$('#stats'); if(!el)return; if(!st){el.innerHTML='';return;}
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:dayKey(d),l:'SMTWTFS'[d.getDay()]});}
  const max=Math.max(60,...days.map(d=>st.days[d.k]||0));
  el.innerHTML=`<div class="stat"><b>${fmtTime(st.sec)}</b><span>listened</span></div><div class="stat"><b>${st.tracks}</b><span>tracks</span></div><div class="wk">${days.map(d=>`<i title="${d.k}"><u style="--h:${Math.max(6,Math.round((st.days[d.k]||0)/max*100))}%"></u><em>${d.l}</em></i>`).join('')}</div>`;
}
function mergedHistory(){
  const rem=(window.DUOTUNE_HISTORY||[]).map(r=>({id:r.track_id,title:r.title,artist:r.artist,img:r.artwork_url,by:r.played_by,at:new Date(r.played_at||r.created_at||0).getTime()}));
  const all=[...rem,...((S.stats&&S.stats.hist)||[])].filter(x=>x.title&&x.at).sort((a,b)=>b.at-a.at);
  const out=[];
  for(const x of all){ if(!out.find(o=>o.id===x.id&&Math.abs(o.at-x.at)<12*60*1000))out.push(x); if(out.length>=25)break; }
  return out;
}
function renderFavSel(){

const heartIco=c=>`<svg class="i" style="color:${c};--hf:${c}"><use href="#i-heart"/></svg>`;
function renderFavs(){

  const map=new Map();

  S.favs.her.forEach(s=>{const e=map.get(s.id);if(e)e.her=true;else map.set(s.id,{s,me:false,her:true});});
  let list=[...map.values()];
  if(S.favFilter==='me')list=list.filter(x=>x.me); else if(S.favFilter==='her')list=list.filter(x=>x.her);
  list.sort((a,b)=>(b.s.at||0)-(a.s.at||0));
  S._favView=list.map(x=>x.s);
  $('#favList').innerHTML=list.length?list.map((x,i)=>`<div class="row"><span class="q-art">${artHTML(x.s,i)}</span><span class="t"><div class="n">${esc(x.s.title)}</div><div class="s">${esc(x.s.artist||'')}</div></span><span class="both">${x.me&&x.her?heartIco('var(--ink)')+heartIco('var(--rose2)'):heartIco(x.me?'var(--ink)':'var(--rose2)')}</span><button type="button" class="plus" data-favadd="${i}" aria-label="Add to queue">${ico('plus')}</button></div>`).join(''):'<div class="empty">Tap ♡ on a song to keep it here</div>';
  const h=mergedHistory(); S._histView=h;

}

/* ---- drag to reorder the queue (grip handle) ---- */
(function(){
  const q=$('#queue'); let drag=null;
  q.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.grip'); if(!g)return; e.preventDefault();
    const row=g.closest('.qrow'), rows=[...q.querySelectorAll('.qrow:not(.played)')];
    drag={row,rows,from:rows.indexOf(row),to:rows.indexOf(row),startY:e.clientY,h:row.offsetHeight};
    row.classList.add('dragging'); try{g.setPointerCapture(e.pointerId);}catch{}
  });
  q.addEventListener('pointermove',e=>{
    if(!drag)return; const dy=e.clientY-drag.startY;
    drag.row.style.transform=`translateY(${dy}px)`;
    drag.to=Math.max(0,Math.min(drag.rows.length-1,drag.from+Math.round(dy/drag.h)));
    drag.rows.forEach((r,i)=>{ if(r===drag.row)return;
      let sh=0; if(drag.from<drag.to&&i>drag.from&&i<=drag.to)sh=-drag.h; else if(drag.from>drag.to&&i<drag.from&&i>=drag.to)sh=drag.h;
      r.style.transform=sh?`translateY(${sh}px)`:''; });
  });
  const end=()=>{ if(!drag)return; const d=drag; drag=null;
    d.rows.forEach(r=>{r.style.transform='';}); d.row.classList.remove('dragging');
    if(d.to!==d.from)DuoTune.emit('queue:move',{index:+d.rows[d.from].dataset.i,delta:d.to-d.from}); };
  q.addEventListener('pointerup',end); q.addEventListener('pointercancel',end);
})();

function renderQueue(){
  const sig = JSON.stringify(S.queue.map(x=>[songKey(x),x.title,x.artist,x.img||''])) + '|' + S.index;
  if (sig === S._qsig) return;                           /* sync heartbeat re-sends the queue every 1.5s: don't redraw (stops thumbnail flicker) */
  S._qsig = sig;
  const q = $('#queue'), start = Math.max(S.index,0);
  const row = (s,i,played) => `
    <div class="row qrow ${i===S.index?'cur':''} ${played?'played':''}" data-i="${i}" data-vid="${esc(ytVideoId(s)||'')}">
      ${played?'':`<button type="button" class="grip" aria-label="Reorder">${ico('grip')}</button>`}
      <button type="button" class="q-play" data-play="${i}">
        <span class="q-art">${artHTML(s,i)}</span>
        <span class="t"><div class="n">${esc(s.title)}</div><div class="s">${esc(s.artist||'')}</div></span>
        ${i===S.index?'<span class="bars"><i></i><i></i><i></i></span>':''}
      </button>
      <button type="button" class="ib q-remove" data-remove="${i}" aria-label="Remove ${esc(s.title)}">${ico('x')}</button>
    </div>`;
  if(!S.queue.length){ q.innerHTML='<div class="empty">Nothing queued yet</div>'; return; }
  /* playing + upcoming first (a newly added song sits right under the current one); already played tracks go below */
  const up = S.queue.slice(start).map((s,k)=>row(s,start+k,false)).join('');
  const done = S.queue.slice(0,start).map((s,i)=>row(s,i,true)).join('');
  q.innerHTML = up + (done?`<div class="label">Played earlier</div>${done}`:'');
  if(S._flashId){
    const el=[...q.querySelectorAll('.qrow')].find(r=>r.dataset.vid===S._flashId); S._flashId=null;
    if(el){ el.classList.add('fresh'); setTimeout(()=>el.classList.remove('fresh'),1900); }
  }
}

let duotuneAvatarUrl=null;
async function duotunePrepareAuth(){
  if(!window.supabase?.createClient) throw new Error('Supabase library did not load. Refresh the page and try again.');
  if(!duotuneSupabase) duotuneSupabase=window.supabase.createClient(DUOTUNE_SUPABASE_URL,DUOTUNE_SUPABASE_KEY,{realtime:{params:{eventsPerSecond:10}}});
  let {data,error}=await duotuneSupabase.auth.getSession();
  if(error) throw error;
  if(!data.session){
    const signed=await duotuneSupabase.auth.signInAnonymously();
    if(signed.error) throw new Error('Anonymous sign-in failed. Check that Anonymous Sign-ins are enabled in Supabase Auth.');
    data=signed.data;
  }
  S.authUserId=data.session?.user?.id||null;
  if(!S.authUserId) throw new Error('Could not establish your private device identity.');
}
const SESSION_KEY='duotune_session';
function resetLoginForm(){ $('#goBtn').classList.remove('busy'); $('#goBtn').disabled=false; $('#roomPasswordInput').value=''; }
const shake=el=>{ if(!el)return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
/* Password login contract: {action:'login', name, password}. */
async function duotuneLoginRequest(name,password){
  await duotunePrepareAuth();
  const {data:sessionData,error:sessionError}=await duotuneSupabase.auth.getSession();
  if(sessionError) throw sessionError;
  const accessToken=sessionData.session?.access_token;
  if(!accessToken) throw new Error('Your private device session expired. Please try again.');
  const response=await fetch(DUOTUNE_API_BASE+'/auth/login',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+accessToken},
    body:JSON.stringify({action:'login',name,password})
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data?.error||'Could not sign in.');
  if(!data?.success) throw new Error(data?.error||data?.message||'Incorrect password');
  if(data.userId&&data.userId!==S.authUserId) throw new Error('Login identity does not match this device.');
  if(data.name&&data.name.toLowerCase()!==name.toLowerCase()) throw new Error('Login name does not match.');
  return data;
}
async function duotuneUploadWelcomeAvatar(){
  if(!S.avatar) throw new Error('Please choose a profile picture first.');
  await duotunePrepareAuth();
  const blob=await (await fetch(S.avatar)).blob();
  const path=`${S.authUserId}/${Date.now()}-avatar.jpg`;
  const {error}=await duotuneSupabase.storage.from('duotune-avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
  if(error) throw new Error('Could not upload your DP: '+error.message);
  const {data}=duotuneSupabase.storage.from('duotune-avatars').getPublicUrl(path);
  if(!data?.publicUrl) throw new Error('Could not create your profile picture URL.');
  duotuneAvatarUrl=data.publicUrl;
  S.avatar=duotuneAvatarUrl;
  store.set('duotune_avatar_self',S.avatar);
  return S.avatar;
}

function ytVideoId(song){
  if(!song) return null;
  const direct=String(song.videoId||song.recording?.videoId||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(direct)) return direct;
  const raw=String(song.url||song.id||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
  try{
    const u=new URL(raw),host=u.hostname.replace(/^www\./,'').replace(/^m\./,'');
    let id='';
    if(host==='youtu.be') id=u.pathname.split('/').filter(Boolean)[0]||'';
    else if(host.endsWith('youtube.com')||host==='youtube-nocookie.com'){
      id=u.searchParams.get('v')||'';
      if(!id){const parts=u.pathname.split('/').filter(Boolean),marker=parts.findIndex(x=>['embed','shorts','live'].includes(x));if(marker>=0)id=parts[marker+1]||'';}
    }
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null;
  }catch{return null;}
}

async function duotuneYoutubeRequest(payload){
  if(!duotuneSupabase)throw new Error('Connect to the room first.');
  const {data:sessionData,error:sessionError}=await duotuneSupabase.auth.getSession();
  if(sessionError)throw sessionError;
  const accessToken=sessionData.session?.access_token;
  if(!accessToken)throw new Error('Your DUOTUNE session expired. Rejoin the room and try again.');
  const response=await fetch(DUOTUNE_API_BASE+'/youtube',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+accessToken},
    body:JSON.stringify(payload)
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok||data?.error)throw new Error(data?.error||'YouTube request failed. Try again shortly.');
  return data;
}
async function duotuneImportYouTubePlaylist(url){

  const data=await duotuneYoutubeRequest({action:'playlist',playlistId:listId});
  const tracks=(data.items||[]).map(x=>{const id=x.contentDetails?.videoId||x.snippet?.resourceId?.videoId;if(!id)return null;return{id,videoId:id,url:'https://www.youtube.com/watch?v='+id,title:x.snippet?.title||'YouTube track',artist:x.snippet?.videoOwnerChannelTitle||x.snippet?.channelTitle||'',img:x.snippet?.thumbnails?.medium?.url||null,dur:0,source:'YouTube'};}).filter(Boolean);
  if(!tracks.length)throw new Error('No accessible videos in this playlist.');
  return {title:data.playlistTitle||'YouTube playlist',url,source:'YouTube',tracks};

function spotifyPlaylistId(url){const u=new URL(url),m=u.pathname.match(/\/playlist\/([A-Za-z0-9]+)/);return m?.[1]||null;}
async function duotuneImportSpotifyPlaylist(url){
  const id=spotifyPlaylistId(url);if(!id)throw new Error('Invalid Spotify playlist URL.');
  throw new Error('Spotify playlist links need Spotify-authorized tracklist access. To avoid Developer App setup, export the playlist tracklist as CSV and import that file instead. A Spotify URL alone does not expose its full tracklist.');
}
function duotuneParseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}
  row.push(cell);if(row.some(v=>v.trim()))rows.push(row);
  if(rows.length<2)throw new Error('CSV has no track rows.');
  const headers=rows.shift().map(x=>x.trim().toLowerCase());
  const find=(names)=>headers.findIndex(h=>names.some(n=>h===n||h.includes(n)));
  const ti=find(['track name','track']),ai=find(['artist name','artist']);
  if(ti<0||ai<0)throw new Error('CSV must include Track Name and Artist Name columns.');
  return rows.map(r=>({title:(r[ti]||'').trim(),artist:(r[ai]||'').trim()})).filter(x=>x.title);
}
async function duotuneImportSpotifyCSV(file){
  const raw=duotuneParseCSV(await file.text());if(!raw.length)throw new Error('No tracks found in CSV.');
  const tracks=[];let missed=0;
  for(let i=0;i<raw.length;i++){
    const song=raw[i];
    try{const result=await duotuneYoutubeRequest({action:'search',query:song.title+' '+song.artist,maxResults:5});const hit=(result.items||[]).find(x=>x.id?.videoId);if(!hit){missed++;continue;}const id=hit.id.videoId;tracks.push({id,videoId:id,url:'https://www.youtube.com/watch?v='+id,title:song.title,artist:song.artist,img:hit.snippet?.thumbnails?.medium?.url||null,dur:0,source:'YouTube',spotifyTitle:song.title});}
    catch(e){missed++;console.warn('[DUOTUNE] Spotify CSV match skipped:',song.title,e.message);}
  }
  if(!tracks.length)throw new Error('Could not match any CSV tracks on YouTube.');
  return {title:file.name.replace(/\.csv$/i,'')||'Spotify import',url:'spotify-csv:'+file.name,source:'spotify',tracks,missed};
}

async function duotuneResolveSpotifyTrack(song){
  if(!song?.spotifyId||ytVideoId(song))return song;
  const d=await duotuneYoutubeRequest({action:'search',query:song.title+' '+song.artist,maxResults:5});
  const hit=(d.items||[]).find(x=>x.id?.videoId);if(!hit)throw new Error('No YouTube match for '+song.title);
  song.videoId=hit.id.videoId;song.id=hit.id.videoId;song.url='https://www.youtube.com/watch?v='+song.videoId;return song;
}

async function duotuneSearchYouTube(query){
  const data=await duotuneYoutubeRequest({action:'search',query,maxResults:12});
  const results=(data.items||[]).map(x=>({
    videoId:x.videoId||x.id?.videoId,
    title:x.title||x.snippet?.title||'Music track',
    artist:x.artist||x.snippet?.channelTitle||'',
    album:x.album||'',
    dur:Number(x.duration||x.contentDetails?.duration||0),
    img:x.snippet?.thumbnails?.medium?.url||x.snippet?.thumbnails?.default?.url||'',
    recording:x.recording||null,
    source:'YouTube Music'
  })).filter(x=>x.videoId);
  const wantsOst=/\b(ost|o\.s\.t\.?|soundtrack|jukebox|bgm|score)\b/i.test(query);
  let soundtrackAlbums = Array.isArray(data.albums) ? data.albums.filter(a=>a && a.browseId && a.title) : [];
  /* a plain movie name should still give its album: ask once more with "ost" when the first answer had none */
  if(!soundtrackAlbums.length && !wantsOst && query.split(/\s+/).length<=3){
    try{ const d2=await duotuneYoutubeRequest({action:'search',query:query+' ost',maxResults:6}); soundtrackAlbums=(Array.isArray(d2.albums)?d2.albums:[]).filter(a=>a&&a.browseId&&a.title); }catch(e){}
  }
  const qw=query.toLowerCase().replace(/\b(ost|soundtrack|original|jukebox|bgm|score|movie|film|songs?)\b/g,' ').split(/\s+/).filter(w=>w.length>1);
  const rank=a=>{const t=((a.title||'')+' '+(a.type||'')).toLowerCase();let sc=0;qw.forEach(w=>{if(t.includes(w))sc+=2;});if(wantsOst&&/soundtrack|\bost\b|original/.test(t))sc+=3;return sc;};
  soundtrackAlbums=soundtrackAlbums.map((a,i)=>({a,i,sc:rank(a)})).sort((x,y)=>y.sc-x.sc||x.i-y.i).map(x=>x.a).slice(0,8);
  DuoTune.ui.setSearchResults(results,soundtrackAlbums,{ost:wantsOst});
  try{ let q=JSON.parse(store.get('duotune_recent_q')||'[]'); q=[query,...q.filter(x=>x!==query)].slice(0,6); store.set('duotune_recent_q',JSON.stringify(q)); }catch(e){}
  const rb=$('#recommendations'); if(rb){ rb.dataset.loaded=''; clearTimeout(window._recT); window._recT=setTimeout(()=>duotuneLoadRecommendations(true),1200); }
  await duotuneSaveSearchHistory(query);
}

const cleanTitle=t=>String(t||'').replace(/[\(\[\{][^\)\]\}]*[\)\]\}]/g,' ').replace(/\b(official|video|audio|lyrics?|lyrical|hd|4k|mv|visuali[sz]er|full song|music)\b/ig,' ').replace(/\s+/g,' ').trim();
let recRound=0;
function recSeeds(){
  const out=[];
  const add=(title,artist='')=>{
    const t=cleanTitle(title),a=String(artist||'').trim();
    const q=[t,a].filter(Boolean).join(' ').trim();
    if(q.length>2&&!out.some(x=>x.toLowerCase()===q.toLowerCase()))out.push(q);
  };
  // Shared room history is already sorted newest-first by mergedHistory().
  mergedHistory().slice(0,8).forEach(x=>add(x.title,x.artist));
  const current=S.queue[S.index]||S.song;
  if(current?.title)add(current.title,current.artist);
  // Recent queue context and mutual favourites provide extra taste signals.
  S.queue.slice(Math.max(0,S.index-2),S.index+3).forEach(x=>add(x?.title,x?.artist));
  [...(S.favs?.me||[]),...(S.favs?.her||[])].slice(0,6).forEach(x=>add(x.title,x.artist));
  return out.slice(0,10);
}
async function duotuneLoadRecommendations(force=false){
  const box=$('#recommendations');if(!box||!duotuneSupabase)return;
  if(!force&&box.dataset.loaded==='yes')return;
  if(box._busy)return; box._busy=true;
  const seeds=recSeeds(), round=recRound++;
  const pick=seeds.length?[seeds[round%seeds.length],seeds[(round+1+Math.floor(Math.random()*Math.max(1,seeds.length-1)))%seeds.length]]:[];
  const queries=[...new Set(pick)].map(sd=>['songs like','similar songs to','more songs by'][round%3]+' '+sd);
  if(!queries.length) queries.push('popular songs trending music');
  box.innerHTML='<div class="empty">Finding songs you might both like…</div>';
  try{
    const lists=await Promise.all(queries.map(q=>duotuneYoutubeRequest({action:'search',query:q,maxResults:8}).catch(()=>({items:[]}))));
    const seen=new Set(S.queue.map(x=>ytVideoId(x)).filter(Boolean)), got=new Set(), items=[];
    lists.forEach(d=>(d.items||[]).forEach(x=>{ const id=x.id?.videoId; if(id&&!seen.has(id)&&!got.has(id)){got.add(id);items.push(x);} }));
    for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
    const recs=items.slice(0,8).map(x=>({videoId:x.videoId||x.id?.videoId,title:x.title||x.snippet?.title||'Music track',artist:x.artist||x.snippet?.channelTitle||'Unknown artist',album:x.album||'',dur:Number(x.duration||x.contentDetails?.duration||0),recording:x.recording||null,img:x.snippet?.thumbnails?.medium?.url||x.snippet?.thumbnails?.default?.url||`https://i.ytimg.com/vi/${x.id.videoId}/hqdefault.jpg`,source:'YouTube Music'}));
    box.innerHTML=recs.length?recs.map((r,i)=>`<button class="row rec-row" data-rec="${i}"><span class="q-art">${artHTML(r,i)}</span><span class="t"><div class="n">${esc(r.title)}</div><div class="s">${esc(r.artist)}</div></span><span class="plus">${ico('plus')}</span></button>`).join(''):'<div class="empty">No suggestions found. Try Refresh.</div>';
    box._items=recs;box.dataset.loaded='yes';
  }catch(e){box.innerHTML='<div class="empty">Could not load suggestions right now</div>';console.warn('[DUOTUNE] Recommendations failed',e);}
  finally{box._busy=false;}
}

async function duotuneSavePlaylist(owner,record){
  if(!duotuneSupabase||!S.code||!S.authUserId)throw new Error('Room connection is required.');
  const row={room_code:S.code,owner_user_id:S.authUserId,owner_name:owner==='me'?S.me.name:(S.her.name||'Her'),source_url:record.url,source:String(record.source||'').toLowerCase(),title:record.title,tracks:record.tracks,added_at:new Date().toISOString()};
  const {data,error}=await duotuneSupabase.from('duotune_playlists').insert(row).select().single();if(error)throw error;
  return data||row;
}
async function duotuneLoadPlaylists(){
  if(!duotuneSupabase||!S.code)return;
  const {data,error}=await duotuneSupabase.from('duotune_playlists').select('*').eq('room_code',S.code).order('added_at',{ascending:true});
  if(error){console.warn('[DUOTUNE] Playlist library table not ready:',error.message);return;}
  const mine=[],hers=[];(data||[]).forEach(row=>{const item={id:row.id,url:row.source_url,title:row.title,source:row.source,tracks:row.tracks||[],added_at:row.added_at,owner_name:row.owner_name,owner_user_id:row.owner_user_id};(row.owner_user_id===S.authUserId?mine:hers).push(item);});
  DuoTune.ui.setPlaylists({me:mine,her:hers});
}
async function duotuneSaveSearchHistory(query){
  if(!duotuneSupabase||!S.code||!S.authUserId)return;
  const {error}=await duotuneSupabase.from('duotune_search_history').insert({room_code:S.code,user_id:S.authUserId,query});
  if(error)console.warn('[DUOTUNE] Search history save unavailable:',error.message);
}
DuoTune.on('playlist:add',async p=>{
  const owner='me';
  try{
    toast('Importing playlist…');
    const record=/open\.spotify\.com\/playlist\//i.test(p.url)?await duotuneImportSpotifyPlaylist(p.url):await duotuneImportYouTubePlaylist(p.url);
    if(!record)return;
    const saved=await duotuneSavePlaylist(owner,record);
    S.playlists[owner].push({id:saved.id,url:record.url,title:record.title,source:record.source,tracks:record.tracks,added_at:saved.added_at||new Date().toISOString(),owner_name:owner==='me'?S.me.name:S.her.name});
    renderPlaylists();await duotuneBroadcast({kind:'playlist-refresh'});
    toast('Saved to '+(owner==='me'?'your':'her')+' playlist library.');
  }catch(e){console.error('[DUOTUNE] Playlist import failed',e);toast(e.message||'Playlist import failed');}
});
DuoTune.on('playlist:remove',async p=>{
  const list=S.playlists[p.owner]||[],item=list[p.index];if(!item)return;
  if(!(await uiConfirm('Remove this playlist from the shared library?','Remove')))return;
  const {error}=await duotuneSupabase.from('duotune_playlists').delete().eq('id',item.id).eq('owner_user_id',S.authUserId);
  if(error){toast('Could not remove playlist: '+error.message);return;}
  list.splice(p.index,1);renderPlaylists();await duotuneBroadcast({kind:'playlist-refresh'});
});
DuoTune.on('playlist:queue',async p=>{
  const tracks=Array.isArray(p.tracks)?p.tracks:[];if(!tracks.length)return;
  const firstAdded=S.queue.length;
  tracks.forEach(t=>{if(!S.queue.some(x=>(x.spotifyId&&x.spotifyId===t.spotifyId)||ytVideoId(x)===ytVideoId(t)))S.queue.push({...t,id:t.videoId||t.id,dur:t.duration||t.dur||0,img:t.snippet?.thumbnails?.medium?.url||t.img||''});});
  if(p.playFirst&&S.queue.length>firstAdded){S.index=firstAdded;DuoTune.ui.setNowPlaying(S.queue[S.index]);DuoTune.ui.setPlaying(true);if(ytReady&&ytPlayer)ytLoadCurrent(true);}
  DuoTune.ui.setQueue(S.queue,S.index);await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:!!p.playFirst||S.playing});toast(p.playFirst?'Soundtrack added · starting playback':'Soundtrack added to shared queue');
});
DuoTune.on('queue:remove',async p=>{
  const i=Number(p.index);if(!Number.isInteger(i)||!S.queue[i])return;
  S.queue.splice(i,1);if(S.index===i){S.index=Math.min(i,S.queue.length-1);if(S.index>=0){DuoTune.ui.setNowPlaying(S.queue[S.index]);ytLoadCurrent(false);}else{DuoTune.ui.setNowPlaying(null);DuoTune.ui.setPlaying(false);}}else if(S.index>i)S.index--;
  DuoTune.ui.setQueue(S.queue,S.index);await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:S.playing});
});
DuoTune.on('queue:move',async p=>{
  const from=Number(p.index),to=from+Number(p.delta);
  if(!Number.isInteger(from)||!Number.isInteger(to)||from<0||to<0||from>=S.queue.length||to>=S.queue.length)return;
  const [item]=S.queue.splice(from,1);S.queue.splice(to,0,item);
  if(S.index===from)S.index=to;else if(from<S.index&&to>=S.index)S.index--;else if(from>S.index&&to<=S.index)S.index++;
  DuoTune.ui.setQueue(S.queue,S.index);await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:S.playing});
});
DuoTune.on('queue:shuffle',async()=>{
  if(S.queue.length<2)return;
  const current=S.index>=0?S.queue[S.index]:null;
  const rest=S.queue.filter((_,i)=>i!==S.index);
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  S.queue=current?[current,...rest]:rest;S.index=current?0:-1;
  DuoTune.ui.setQueue(S.queue,S.index);await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:S.playing});toast('Shared queue shuffled');
});
DuoTune.on('queue:clear',async()=>{S.queue=[];S.index=-1;S.pos=0;DuoTune.ui.setQueue([], -1);DuoTune.ui.setNowPlaying(null);DuoTune.ui.setPlaying(false);if(ytReady&&ytPlayer)ytPlayer.stopVideo();await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:[],index:-1,playing:false});toast('Shared queue cleared');});
DuoTune.on('search',p=>{
  const query=String(p?.query||'').trim(); if(!query) return;
  duotuneSearchYouTube(query).catch(e=>{console.error(e);toast(e.message||'Search failed');});
});

function runMock(){

  clearInterval(tick);
