<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f6cdd8">
<title>DUOTUNE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fbe4ea'/%3E%3Ccircle cx='12.5' cy='16' r='8' fill='%23e48aa6'/%3E%3Ccircle cx='19.5' cy='16' r='8' fill='%231f1519' fill-opacity='.9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ivory:#fff9f5; --blush:#fbe4ea; --blush2:#f4c9d4; --rose:#dc8fa5; --rose2:#bf6a85;
  --ink:#1f1519; --mut:rgba(31,21,25,.55); --hair:rgba(31,21,25,.09);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --tab:60px; --top:52px; --ease:cubic-bezier(.3,.8,.3,1);
}
@property --w{syntax:'<percentage>';inherits:false;initial-value:-8%}
@property --c1{syntax:'<color>';inherits:false;initial-value:rgba(31,21,25,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#f2c3cf;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose2);outline-offset:3px}
.hidden{display:none!important}
.i{width:24px;height:24px;display:block;flex:none}

/* ============ SHELL ============ */
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;
  background:linear-gradient(172deg,#fdeef2 0%,#f8d6df 48%,#efb7c8 100%)}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.artglow{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(56px) saturate(1.25);opacity:0;transition:opacity 1.2s;transform:scale(1.25)}
.artglow.on{opacity:.5}
.veil{position:absolute;inset:0;background:linear-gradient(172deg,rgba(253,238,242,.62),rgba(248,214,223,.42) 50%,rgba(239,183,200,.4))}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
.blob.a{width:340px;height:340px;background:#ffd9c9;top:-90px;left:-110px}
.blob.b{width:380px;height:380px;background:#e58fa9;bottom:-140px;right:-150px;animation-duration:32s;opacity:.36}
.blob.c{width:240px;height:240px;background:#fff6ee;top:38%;left:46%;animation-duration:38s;opacity:.45}
.grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .3 0 0 0 0 .38 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes drift{to{transform:translate3d(46px,-38px,0) scale(1.14)}}

/* ============ WELCOME ============ */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;z-index:5;
  padding:calc(env(safe-area-inset-top) + 24px) 26px calc(env(safe-area-inset-bottom) + 24px);transition:opacity .45s,transform .45s var(--ease)}
.screen::-webkit-scrollbar{display:none}
.screen.leave{opacity:0;transform:scale(1.02);pointer-events:none}
.w-top{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:36px;height:27px}
.wordmark{font-weight:600;letter-spacing:.34em;font-size:12px;text-transform:uppercase}
.wordmark b{color:var(--rose2);font-weight:600}
.w-art{flex:1 1 0;min-height:130px;display:grid;place-items:center;margin:2px -14px 0}
.w-art svg{height:100%;width:auto;max-width:100%;max-height:440px;overflow:visible}
.orb-a{animation:bob 9s ease-in-out infinite alternate}
.orb-b{animation:bob 11s ease-in-out infinite alternate-reverse}
@keyframes bob{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.rip ellipse{transform-box:view-box;transform-origin:200px 336px;animation:ripple 7s ease-out infinite;opacity:0}
.rip ellipse:nth-child(2){animation-delay:2.3s}.rip ellipse:nth-child(3){animation-delay:4.6s}
@keyframes ripple{0%{transform:scale(.35);opacity:.8}100%{transform:scale(1.2);opacity:0}}
.tw{animation:tw 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw:nth-of-type(2n){animation-delay:1.4s}.tw:nth-of-type(3n){animation-delay:2.6s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.w-form{flex:none;animation:rise .9s var(--ease) both .15s}
.hello{font-size:clamp(30px,9.4vw,40px);line-height:1.05;font-weight:600;letter-spacing:-.04em;margin:0 0 16px}
.hello em{font-family:var(--serif);font-style:italic;font-weight:600;letter-spacing:-.01em;font-size:1.16em}
.hello .h{color:var(--rose2);font-weight:400}
.f{display:block;width:100%;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);border-radius:16px;
  padding:16px 18px;font-size:16px;margin-bottom:10px;outline:none;transition:background .2s,border-color .2s}
.f::placeholder{color:rgba(31,21,25,.38)}
.f:focus{background:rgba(255,255,255,.88);border-color:var(--rose)}
.idrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.idrow .f{margin:0;height:56px;padding:0 18px;flex:1;min-width:0}
.avatar-btn{position:relative;flex:none;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);cursor:pointer}
.avatar-btn #avatarPreview{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--rose2);font-size:20px}
.avatar-btn::after{content:"+";position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--ivory);font-size:14px;line-height:18px;text-align:center;border:2px solid #f8d6df}
.primary{width:100%;height:58px;border-radius:29px;background:var(--ink);color:var(--ivory);font-weight:600;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;transition:transform .2s,background .2s}
.primary:active{transform:scale(.98)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ============ ROOM FRAME ============ */
#room{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .6s}
#room.in{opacity:1}
.top{flex:none;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;justify-content:center;position:relative;z-index:3}
.pill{display:flex;align-items:center;gap:0;height:38px;padding:0 13px 0 5px;border-radius:19px;background:rgba(255,255,255,.55);box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
.av{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.av.me{background:var(--ink);color:var(--ivory)}
.av.her{background:var(--rose);color:#fff}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:#b9a9ae;border:1.5px solid #fbe4ea}
.av.on::after{background:#5fb48a}
.link{display:flex;align-items:flex-end;gap:2px;height:12px;margin:0 9px;opacity:.35}
.link i{width:2px;border-radius:1px;background:var(--rose2);height:4px}
.pill.together .link{opacity:1}
.pill.together.playing .link i{animation:eq 1s ease-in-out infinite}
.link i:nth-child(2){animation-delay:.2s!important}.link i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .4s,transform .45s var(--ease)}
.view.active{opacity:1;pointer-events:auto;transform:none}

.tabbar{flex:none;height:calc(var(--tab) + env(safe-area-inset-bottom));padding:0 30px env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,249,245,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--hair);position:relative;z-index:3}
.tab{position:relative;width:68px;height:42px;border-radius:21px;display:grid;place-items:center;color:var(--mut);transition:background .25s,color .25s}
.tab .i{width:26px;height:26px}
.tab.active{background:rgba(220,143,165,.2);color:var(--rose2)}
.tab .dot{position:absolute;top:7px;right:19px;width:9px;height:9px;border-radius:50%;background:var(--rose2);border:1.5px solid var(--ivory)}

/* ============ NOW PLAYING ============ */
#v-player{padding:0 28px 8px;align-items:stretch}
.art-stage{flex:1;min-height:0;display:grid;place-items:center}
.art{width:clamp(170px,calc(100dvh - 390px),100%);aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(145deg,#f9cbd6,#e58aa5);
  box-shadow:0 30px 60px -22px rgba(150,70,100,.55),0 8px 20px -10px rgba(150,70,100,.3);transition:transform .7s var(--ease);transform:scale(.88)}
.playing .art{transform:scale(1)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art-css{position:absolute;inset:0;background:radial-gradient(circle at 62% 38%,var(--s,#fff3e8) 0 15%,transparent 15.5%),linear-gradient(160deg,var(--a),var(--b))}
.art-css::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;border-radius:50% 50% 0 0;background:linear-gradient(var(--c),var(--d));opacity:.9}
.mini-art,.q-art{position:relative;overflow:hidden;flex:none;background:linear-gradient(145deg,#f9cbd6,#e58aa5)}
.mini-art{width:44px;height:44px;border-radius:9px}
.q-art{width:48px;height:48px;border-radius:9px}
.mini-art img,.q-art img{width:100%;height:100%;object-fit:cover;display:block}
.mini-art .art-css,.q-art .art-css{border-radius:0}
.info{display:flex;align-items:center;gap:14px;margin-top:18px}
.info .t{flex:1;min-width:0}
.title{font-size:22px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:17px;color:var(--rose2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(31,21,25,.07);flex:none}
.round .i{width:20px;height:20px}
.heart{color:var(--ink)}
.heart.on{color:var(--rose2)}
.heart.on .i{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.35)}}

.range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;outline:none;touch-action:none;display:block}
.range::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--ink) var(--p,0%),rgba(31,21,25,.14) var(--p,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .15s}
.range:active::-webkit-slider-thumb{transform:scale(1)}
.range::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--ink) var(--p,0%),rgba(31,21,25,.14) var(--p,0%))}
.range::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .15s}
.range:active::-moz-range-thumb{transform:scale(1)}
.seekwrap{margin-top:8px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:-2px}
.transport{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.transport button{display:grid;place-items:center;color:var(--ink);transition:transform .15s,opacity .15s;width:54px;height:60px}
.transport button:active{transform:scale(.86);opacity:.7}
.t-skip .i{width:30px;height:30px;opacity:.72}
.t-step .i{width:38px;height:38px}
.t-play{width:74px!important}
.t-play .i{width:68px;height:68px}
.flip{transform:scaleX(-1)}
.vol{display:flex;align-items:center;gap:12px;margin:8px 4px 4px;color:var(--mut)}
.vol .i{width:18px;height:18px}

/* ============ LYRICS + CHAT ============ */
.l-head{flex:none;display:flex;align-items:center;gap:12px;padding:2px 22px 10px}
.l-head .t{flex:1;min-width:0}
.l-head .title{font-size:16px}.l-head .artist{font-size:14px}
#lyrics{flex:1;min-height:0;position:relative;overflow-y:auto;scrollbar-width:none;padding:0 26px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 11%,#000 86%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 11%,#000 86%,transparent 100%)}
#lyrics::-webkit-scrollbar{display:none}
.pad{height:30%}.pad.b{height:70%}
.line{display:block;width:fit-content;max-width:100%;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.025em;padding:10px 0;cursor:pointer;
  --c1:rgba(31,21,25,.4);--c0:rgba(31,21,25,.4);
  background:linear-gradient(90deg,var(--c1) calc(var(--w) - 8%),var(--c0) calc(var(--w) + 8%));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  transform-origin:left center;transform:scale(.92);opacity:max(.3,calc(1 - var(--d,4)*.26));
  filter:blur(calc(var(--d,4)*.5px)) drop-shadow(0 0 0 rgba(224,120,155,0)) drop-shadow(0 0 0 rgba(236,140,170,0));
  transition:transform .6s var(--ease),opacity .6s,filter .7s,--c1 .7s}
.line.past{--w:108%}
.line.active{--c1:var(--ink);--c0:rgba(31,21,25,.28);transform:scale(1);opacity:1;filter:blur(0) drop-shadow(0 0 10px rgba(224,120,155,.55)) drop-shadow(0 0 26px rgba(236,140,170,.5))}
.line.picked{--c1:var(--rose2);--c0:var(--rose2);--w:108%}
.lyr-empty{font-family:var(--serif);font-style:italic;font-size:64px;color:rgba(191,106,133,.45);padding-top:14vh;text-align:center}
#lyricsSource{padding:0 26px 6px;text-align:center;font-size:11px;color:var(--mut);flex:none}
#lyricsSource:empty{display:none}

.dock{flex:none;position:relative;background:rgba(255,249,245,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:24px 24px 0 0;padding:2px 14px 12px;box-shadow:0 -10px 30px -18px rgba(150,70,100,.4)}
.grab{display:block;width:100%;height:20px;position:relative}
.grab::after{content:"";position:absolute;left:50%;top:8px;width:38px;height:4px;border-radius:2px;background:rgba(31,21,25,.18);transform:translateX(-50%)}
.msgwrap{height:0;overflow:hidden;transition:height .4s var(--ease)}
.dock.open .msgwrap{height:min(30dvh,260px)}
.msgs{height:100%;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px;padding:4px 2px 10px}
.msgs::-webkit-scrollbar{display:none}
.peek{display:none;flex-direction:column;gap:5px;padding:0 2px 8px}
.peek:empty{display:none}
.dock.open .peek{display:none}
.peek .mb{font-size:14.5px;padding:7px 13px}
.m{max-width:82%;display:flex;flex-direction:column;animation:rise .35s var(--ease) both}
.m.me{align-self:flex-end;align-items:flex-end}
.m.her{align-self:flex-start}
.mb{padding:9px 14px;border-radius:19px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.m.me .mb{background:var(--rose2);color:#fff;border-bottom-right-radius:6px}
.m.her .mb{background:#fff;border-bottom-left-radius:6px}
.mq{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--rose2);border-left:2px solid var(--rose);padding:1px 0 1px 9px;margin:0 4px 4px;max-width:100%}
.m.me .mq{text-align:right;border-left:0;border-right:2px solid var(--rose);padding:1px 9px 1px 0}
.quote{display:flex;align-items:center;gap:8px;margin:0 2px 8px;padding:7px 8px 7px 12px;border-radius:14px;background:rgba(220,143,165,.16)}
.quote span{flex:1;min-width:0;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--rose2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote button{width:24px;height:24px;color:var(--mut)}.quote .i{width:16px;height:16px}
.reacts{display:flex;justify-content:space-between;padding:0 6px 8px}
.reacts button{font-size:23px;width:48px;height:38px;border-radius:19px;transition:transform .15s,background .15s}
.reacts button:active{transform:scale(1.28);background:rgba(220,143,165,.22)}
.chat-form{display:flex;gap:8px;align-items:center}
.chat-form input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--hair);background:#fff;padding:0 18px;font-size:16px;outline:none}
.chat-form input:focus{border-color:var(--rose)}
@media(max-height:560px){.dock.open .msgwrap{height:min(24dvh,150px)}.dock{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
.send{width:44px;height:44px;border-radius:50%;background:var(--rose2);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,opacity .2s}
.send:active{transform:scale(.9)}.send:disabled{opacity:.35}

/* ============ LIBRARY ============ */
#v-library{padding:0 20px}
.seg{display:flex;background:rgba(31,21,25,.07);border-radius:12px;padding:3px;margin:2px 0 12px;flex:none}
.seg button{flex:1;height:34px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut);transition:all .25s}
.seg button.on{background:var(--ivory);color:var(--ink);box-shadow:0 1px 4px rgba(150,70,100,.15)}
.pane{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:88px}
.pane::-webkit-scrollbar{display:none}
.add-row{display:flex;gap:8px;margin-bottom:6px}
.add-row .f{margin:0;padding:12px 16px;border-radius:14px;font-size:16px}
.add-btn{flex:none;height:46px;padding:0 16px;border-radius:14px;background:var(--ink);color:var(--ivory);font-weight:600;font-size:14px}
.search{position:relative;flex:1;min-width:0}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);pointer-events:none}
.search .f{padding-left:42px;height:46px}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;width:100%;text-align:left}
a.row{color:inherit;text-decoration:none}
.row:active{background:rgba(255,255,255,.5)}
.row .t{flex:1;min-width:0}
.row .n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .n{color:var(--rose2)}
.ib,.plus{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(31,21,25,.06);color:var(--ink);flex:none;transition:background .2s,transform .15s}
.ib:active,.plus:active{transform:scale(.9);background:rgba(220,143,165,.25)}
.ib .i,.plus .i{width:18px;height:18px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 4px;min-height:36px}
.qhead .label{margin:0}
.qtools{display:flex;gap:8px}
.qrow{transition:transform .22s var(--ease);position:relative}
.qrow.dragging{transition:none;z-index:3;background:rgba(255,249,245,.96);box-shadow:0 12px 28px -12px rgba(150,70,100,.55)}
.grip{width:26px;height:44px;display:grid;place-items:center;color:rgba(31,21,25,.35);touch-action:none;cursor:grab;flex:none;margin-left:-4px}
.grip .i{width:18px;height:18px}
.q-play{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.pl-meta{font-size:12px;color:var(--mut);margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:2px;height:14px;width:16px;flex:none}
.bars i{flex:1;background:var(--rose2);border-radius:1px;height:4px}
.playing .row.cur .bars i{animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.25s!important}.bars i:nth-child(3){animation-delay:.5s!important}
.label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 6px 8px}
.pl-ico{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.6);display:grid;place-items:center;color:var(--rose2);flex:none}
.empty{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--mut);text-align:center;padding:22px 0}
.room-foot{text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(31,21,25,.35);padding:22px 0 6px}
.ghost{display:flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:19px;background:rgba(255,255,255,.55);font-size:14px;font-weight:600}
.ghost .i{width:16px;height:16px}
.imp{display:flex;justify-content:flex-end;padding:4px 2px 6px}
.stats{display:flex;align-items:flex-end;gap:24px;padding:6px 6px 26px}
.stat b{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:44px;line-height:1;letter-spacing:-.01em}
.stat b small{font-family:var(--sans);font-style:normal;font-size:14px;color:var(--mut);margin:0 6px 0 2px;font-weight:500;letter-spacing:0}
.stat span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:7px}
.wk{margin-left:auto;display:flex;align-items:flex-end;gap:6px;height:44px}
.wk i{position:relative;width:8px;height:100%;display:flex;align-items:flex-end}
.wk u{display:block;width:8px;height:var(--h);border-radius:4px;background:linear-gradient(var(--rose),var(--rose2));opacity:.85}
.wk em{position:absolute;top:100%;left:0;right:0;margin-top:4px;text-align:center;font-style:normal;font-size:9px;color:var(--mut)}
.fsel{display:flex;gap:8px;margin:0 0 6px;overflow-x:auto;scrollbar-width:none}
.fsel button{height:32px;padding:0 15px;border-radius:16px;font-size:14px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.5);flex:none;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsel button.on{background:var(--ink);color:var(--ivory)}
.both{display:flex;flex:none;margin-right:2px}
.both .i{width:16px;height:16px}
.both .i+.i{margin-left:-6px}
.minibar{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:16px;background:rgba(255,249,245,.92);box-shadow:0 10px 30px -14px rgba(150,70,100,.5)}
.minibar .t{flex:1;min-width:0}
.minibar .title{font-size:15px}.minibar .artist{font-size:13px}
.minibar .pp{width:38px;height:38px;display:grid;place-items:center}.minibar .pp .i{width:26px;height:26px}

/* ============ OVERLAYS ============ */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.rx{position:absolute;bottom:150px;font-size:36px;filter:drop-shadow(0 4px 10px rgba(191,106,133,.35));animation:rise-fx 2.8s ease-out forwards}
@keyframes rise-fx{0%{opacity:0;transform:translateY(0) scale(.5)}12%{opacity:1}100%{opacity:0;transform:translateY(-340px) translateX(var(--dx,0)) scale(1.25)}}
.banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:8;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:18px;
  background:rgba(255,249,245,.95);box-shadow:0 14px 34px -14px rgba(150,70,100,.55);transform:translateY(-140%);transition:transform .5s var(--ease);text-align:left;width:calc(100% - 24px)}
.banner.show{transform:none}
.banner .t{flex:1;min-width:0}
.banner .n{font-size:13px;font-weight:700}
.banner .s{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-bg{position:absolute;inset:0;background:rgba(31,21,25,.28);z-index:9;opacity:0;pointer-events:none;transition:opacity .35s}
.sheet-bg.show{opacity:1;pointer-events:auto}
#dlgBg{z-index:12}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--ivory);border-radius:26px 26px 0 0;padding:10px 24px calc(env(safe-area-inset-bottom) + 24px);
  transform:translateY(105%);transition:transform .5s var(--ease)}
#dlg{z-index:13}
.sheet.show{transform:none}
.sheet .gr{width:36px;height:4px;border-radius:2px;background:rgba(31,21,25,.18);margin:0 auto 18px}
.sheet-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.who{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:17px;font-weight:600}
.who small{margin-left:auto;font-size:13px;font-weight:500;color:var(--mut)}
.code-box{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;padding:14px 16px;border-radius:16px;background:var(--blush)}
.code-box strong{font-size:22px;letter-spacing:.2em;font-weight:600}
.code-box button{color:var(--rose2);width:34px;height:34px;display:grid;place-items:center}
.leave-btn{width:100%;height:50px;margin-top:8px;font-size:15px;font-weight:600;color:var(--rose2)}
#dlgText{font-size:18px;font-weight:600;line-height:1.35;margin:6px 0 18px;text-align:center}
.toast{position:absolute;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 90px);transform:translate(-50%,10px);z-index:14;background:var(--ink);color:var(--ivory);
  padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:all .35s var(--ease);max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* audio engine: kept at full size, painted BEHIND the app so it is never seen, but never hidden/offscreen so playback is not throttled */
#duotune-audio-deck{position:absolute;left:0;bottom:0;width:356px;height:200px;z-index:-1;pointer-events:none;overflow:hidden}
#duotune-audio-deck #ytplayer{width:100%;height:100%}
#yt-status{display:none}
@media (prefers-reduced-motion:reduce){*:not(.rx){animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================================
   DUOTUNE · frontend
   --------------------------------------------------------------------------
   HOW TO WIRE THE BACKEND
   1. Set MOCK = false.
   2. Listen for what the user does:       DuoTune.on('player:play', fn) ...
   3. Push remote state into the UI:       DuoTune.ui.setPlaying(true) ...

   UI → backend events (payloads)
     room:connect   {name, code, creating}     invite URL joins existing room
     room:leave     {}
     player:play    {seconds}   player:pause {seconds}   player:seek {seconds}
     player:next    {}          player:prev  {}           player:volume {value 0-100} (local only)
     queue:play     {index}     queue:add    {videoId?, url?, title?, artist?}
     search         {query}
     chat:send      {text, quote|null}      reaction:send {emoji}
     playlist:add   {owner:'me', url}   saves to personal library, not queue
     favorite:toggle {liked}

   backend → UI  (DuoTune.ui.*)
     enterRoom({name, code})      setPresence({me:{name,online}, her:{name,online}})
     setNowPlaying(song|null)     song = {id,title,artist,img?,dur}
     setPlaying(bool)             setProgress(pos, dur)
     setQueue(list, index)        setLyrics(lrcString)
     receiveMessage({text, quote?})   receiveReaction(emoji)
     setPlaylists({me:[urls], her:[urls]})   setSearchResults([{videoId,title,artist}])
   Own chat messages / reactions are shown optimistically by the UI.
   ========================================================================== */
const MOCK = false;

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = (id, cls='') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const fmt = t => { t = Math.max(0, Math.floor(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
const store = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };

/* ---------- event bridge ---------- */
const DuoTune = { _h:{}, ui:{},
  on(n,f){ this._h[n]=f; return this },
  emit(n,p){ if(MOCK) console.debug('[DuoTune]',n,p); this._h[n]?.(p) } };
window.DuoTune = DuoTune;
const act = (type, payload, local) => { DuoTune.emit(type, payload); if (MOCK && local) local(); };

/* ---------- state ---------- */
const S = { me:{name:'Kiran',online:true}, her:{name:'',online:false}, code:'', playing:false, pos:0, dur:0,
  song:null, queue:[], index:-1, lrc:[], line:-1, view:'player', avatar:null, herAvatar:null, isHost:false, lastRemoteTrack:null, chatOpen:false, unread:0, quote:null,
  liked:false, dragging:false, userScrollUntil:0, playlists:{me:[],her:[]}, msgs:[], playlistTracks:{}, searchHistory:[] };

const PALETTES = [
  {a:'#f9cbd6',b:'#e58aa5',c:'#c8627f',d:'#6e3248',s:'#fff3e8'},
  {a:'#ffe0cf',b:'#f3a9a9',c:'#d9708a',d:'#5d2c44',s:'#fffaf0'},
  {a:'#f6d4e6',b:'#cf8fb5',c:'#a8627f',d:'#432438',s:'#fff2f6'}];
/* ==========================================================================
   UI ADDITIONS · thumbnails, art glow, smooth progress, favourites, stats, dialogs
   (UI layer only; the Supabase adapter below is untouched except where marked "UI-FIX")
   ========================================================================== */
const ytThumb=(id,q)=>`https://i.ytimg.com/vi/${id}/${q}.jpg`;
const songKey=s=>{const k=s&&(ytVideoId(s)||s.videoId||s.id);return k||'';};
const gradArt=(i=0)=>{const p=PALETTES[(i<0?0:i)%PALETTES.length];return `<div class="art-css" style="--a:${p.a};--b:${p.b};--c:${p.c};--d:${p.d};--s:${p.s}"></div>`;};
/* thumbnail chain: maxres (big) -> mq -> default -> gradient. Square-crops the 16:9 frame, so no black bars. */
window.artErr=function(img){
  const n=+(img.dataset.try||0), id=img.dataset.id;
  if(id&&n<2){img.dataset.try=n+1;img.src=ytThumb(id,['mqdefault','default'][n]);return;}
  img.outerHTML=gradArt(0);
};
const artHTML=(song,i=0,big=false)=>{
  const k=song?songKey(song):'';
  const yt=/^[\w-]{11}$/.test(k)?k:null;
  const src=yt?ytThumb(yt,big?'maxresdefault':'mqdefault'):(song?.img||null);
  return src?`<img alt="" decoding="async" referrerpolicy="no-referrer" ${yt?`data-id="${yt}" data-try="${big?0:1}"`:''} src="${esc(src)}" onerror="artErr(this)">`:gradArt(i);
};
function setArtGlow(song){
  const el=$('#artglow'); if(!el)return;
  const k=song?songKey(song):''; const yt=/^[\w-]{11}$/.test(k)?k:null;
  const src=yt?ytThumb(yt,'mqdefault'):(song?.img||'');
  if(!src){el.classList.remove('on');return;}
  const im=new Image(); im.onload=()=>{el.style.backgroundImage=`url("${src}")`;el.classList.add('on');}; im.onerror=()=>el.classList.remove('on'); im.src=src;
}

/* ---- smooth progress: the player reports once a second, the UI interpolates between reports ---- */
const estPos=()=>S.playing?Math.min(S.dur||1e9,S.pos+(performance.now()-(S._tAt||performance.now()))/1000):S.pos;
function paintProgress(p){
  const pct=S.dur?Math.min(100,Math.max(0,p/S.dur*100)):0;
  if(!S.dragging){const sk=$('#seek');sk.value=pct*10;sk.style.setProperty('--p',pct+'%');}
  $('#elapsed').textContent=fmt(p); $('#remain').textContent='-'+fmt((S.dur||0)-p);
}
let _raf=0;
function frame(){
  _raf=0; if(!S.playing)return;
  const p=estPos();
  if(S.view==='player')paintProgress(p);
  if(S.view==='lyrics')updateLine(p);
  _raf=requestAnimationFrame(frame);
}
function kickFrame(){ if(!_raf&&S.playing)_raf=requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ S.pos=estPos(); S._tAt=performance.now(); kickFrame(); } });

/* ---- in-design confirm sheet (replaces the browser confirm()) ---- */
function uiConfirm(text,ok='Yes'){
  return new Promise(res=>{
    $('#dlgText').textContent=text; $('#dlgOk').textContent=ok;
    $('#dlg').classList.add('show'); $('#dlgBg').classList.add('show');
    const done=v=>{ $('#dlg').classList.remove('show'); $('#dlgBg').classList.remove('show'); $('#dlgOk').onclick=$('#dlgNo').onclick=$('#dlgBg').onclick=null; res(v); };
    $('#dlgOk').onclick=()=>done(true); $('#dlgNo').onclick=()=>done(false); $('#dlgBg').onclick=()=>done(false);
  });
}

/* ---- favourites (both of you) ---- */
S.favs={me:[],her:[]}; S.favFilter='all'; S.stats=null; S._favView=[]; S._histView=[];
const FAVKEY=()=>'duotune_favs_'+(S.code||'room');
function favLoad(){
  try{S.favs.me=JSON.parse(store.get(FAVKEY()+'_me')||'[]');}catch{S.favs.me=[];}
  try{S.favs.her=JSON.parse(store.get(FAVKEY()+'_her')||'[]');}catch{S.favs.her=[];}
}
function favSave(){ store.set(FAVKEY()+'_me',JSON.stringify(S.favs.me)); store.set(FAVKEY()+'_her',JSON.stringify(S.favs.her)); }
const favSlim=s=>({id:songKey(s),videoId:songKey(s),title:s.title,artist:s.artist||'',img:s.img||null,at:Date.now()});
const isFav=(s,who='me')=>{const k=songKey(s);return !!k&&S.favs[who].some(x=>x.id===k);};
function syncFavHeart(){
  const on=!!(S.song&&isFav(S.song)); S.liked=on;
  $('#fav').classList.toggle('on',on); $('#fav svg').style.setProperty('--hf',on?'var(--rose2)':'none');
}
function favToggle(){
  if(!S.song)return; const k=songKey(S.song); if(!k){toast('This track can’t be saved');return;}
  const had=isFav(S.song);
  if(had)S.favs.me=S.favs.me.filter(x=>x.id!==k); else S.favs.me.unshift(favSlim(S.song));
  favSave(); syncFavHeart(); renderFavs();
  DuoTune.emit('favorite:toggle',{liked:!had,song:favSlim(S.song)});
}
DuoTune.ui.setFavourites=p=>{ if(p.me)S.favs.me=p.me; if(p.her)S.favs.her=p.her; favSave(); syncFavHeart(); renderFavs(); };

/* ---- listening stats (kept on this device; history rows are merged in from the shared table when it exists) ---- */
const STATKEY=()=>'duotune_stats_'+(S.code||'room');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function statsLoad(){
  let st=null; try{st=JSON.parse(store.get(STATKEY())||'null');}catch{}
  S.stats=st&&typeof st==='object'?st:{sec:0,tracks:0,days:{},hist:[]};
  S.stats.days=S.stats.days||{}; S.stats.hist=S.stats.hist||[];
}
let _statAcc=0,_statSong=null,_statCounted=false;
setInterval(()=>{
  if(!S.playing||!S.song||!S.stats)return;
  const k=songKey(S.song); if(k!==_statSong){_statSong=k;_statAcc=0;_statCounted=false;}
  S.stats.sec+=1; const d=dayKey(); S.stats.days[d]=(S.stats.days[d]||0)+1; _statAcc++;
  if(!_statCounted&&_statAcc>=30){
    _statCounted=true; S.stats.tracks++;
    S.stats.hist.unshift({id:k,title:S.song.title,artist:S.song.artist||'',img:S.song.img||null,by:S.me.name,at:Date.now()});
    S.stats.hist=S.stats.hist.slice(0,60);
  }
  if(_statAcc%15===0)store.set(STATKEY(),JSON.stringify(S.stats));
  if(S.view==='library'&&!$('#paneFav').classList.contains('hidden')&&_statAcc%5===0)renderStats();
},1000);
const fmtTime=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h}<small>h</small>${m}<small>m</small>`:`${m}<small>m</small>`;};
const ago=t=>{const s=Math.max(1,(Date.now()-t)/1000|0);if(s<3600)return Math.max(1,s/60|0)+'m ago';if(s<86400)return (s/3600|0)+'h ago';const d=s/86400|0;return d===1?'yesterday':d+'d ago';};
function renderStats(){
  const st=S.stats,el=$('#stats'); if(!el)return; if(!st){el.innerHTML='';return;}
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:dayKey(d),l:'SMTWTFS'[d.getDay()]});}
  const max=Math.max(60,...days.map(d=>st.days[d.k]||0));
  el.innerHTML=`<div class="stat"><b>${fmtTime(st.sec)}</b><span>listened</span></div><div class="stat"><b>${st.tracks}</b><span>tracks</span></div><div class="wk">${days.map(d=>`<i title="${d.k}"><u style="--h:${Math.max(6,Math.round((st.days[d.k]||0)/max*100))}%"></u><em>${d.l}</em></i>`).join('')}</div>`;
}
function mergedHistory(){
  const rem=(window.DUOTUNE_HISTORY||[]).map(r=>({id:r.track_id,title:r.title,artist:r.artist,img:r.artwork_url,by:r.played_by,at:new Date(r.played_at||r.created_at||0).getTime()}));
  const all=[...rem,...((S.stats&&S.stats.hist)||[])].filter(x=>x.title&&x.at).sort((a,b)=>b.at-a.at);
  const out=[];
  for(const x of all){ if(!out.find(o=>o.id===x.id&&Math.abs(o.at-x.at)<12*60*1000))out.push(x); if(out.length>=25)break; }
  return out;
}
function renderFavSel(){
  const el=$('#fsel'); if(!el)return;
  el.innerHTML=[['all','All'],['me',S.me.name||'You'],['her',S.her.name||'Her']].map(([k,l])=>`<button type="button" data-f="${k}" class="${S.favFilter===k?'on':''}">${esc(l)}</button>`).join('');
}
const heartIco=c=>`<svg class="i" style="color:${c};--hf:${c}"><use href="#i-heart"/></svg>`;
function renderFavs(){
  if(!$('#favList'))return;
  renderFavSel(); renderStats();
  const map=new Map();
  S.favs.me.forEach(s=>map.set(s.id,{s,me:true,her:false}));
  S.favs.her.forEach(s=>{const e=map.get(s.id);if(e)e.her=true;else map.set(s.id,{s,me:false,her:true});});
  let list=[...map.values()];
  if(S.favFilter==='me')list=list.filter(x=>x.me); else if(S.favFilter==='her')list=list.filter(x=>x.her);
  list.sort((a,b)=>(b.s.at||0)-(a.s.at||0));
  S._favView=list.map(x=>x.s);
  $('#favList').innerHTML=list.length?list.map((x,i)=>`<div class="row"><span class="q-art">${artHTML(x.s,i)}</span><span class="t"><div class="n">${esc(x.s.title)}</div><div class="s">${esc(x.s.artist||'')}</div></span><span class="both">${x.me&&x.her?heartIco('var(--ink)')+heartIco('var(--rose2)'):heartIco(x.me?'var(--ink)':'var(--rose2)')}</span><button type="button" class="plus" data-favadd="${i}" aria-label="Add to queue">${ico('plus')}</button></div>`).join(''):'<div class="empty">Tap ♡ on a song to keep it here</div>';
  const h=mergedHistory(); S._histView=h;
  $('#histList').innerHTML=h.length?h.map((x,i)=>`<div class="row"><span class="q-art">${artHTML({id:x.id,img:x.img},i)}</span><span class="t"><div class="n">${esc(x.title)}</div><div class="s">${esc(x.by||'')} · ${ago(x.at)}</div></span><button type="button" class="plus" data-histadd="${i}" aria-label="Add to queue">${ico('plus')}</button></div>`).join(''):'<div class="empty">Nothing played yet</div>';
}
$('#paneFav').onclick=e=>{
  const f=e.target.closest('[data-f]'); if(f){S.favFilter=f.dataset.f;renderFavs();return;}
  const a=e.target.closest('[data-favadd]'), h=e.target.closest('[data-histadd]');
  const s=a?S._favView[+a.dataset.favadd]:h?S._histView[+h.dataset.histadd]:null; if(!s)return;
  DuoTune.emit('queue:add',{videoId:s.id,title:s.title,artist:s.artist,img:s.img||undefined});
};

/* ---- drag to reorder the queue (grip handle) ---- */
(function(){
  const q=$('#queue'); let drag=null;
  q.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.grip'); if(!g)return; e.preventDefault();
    const row=g.closest('.qrow'), rows=[...q.querySelectorAll('.qrow')];
    drag={row,rows,from:rows.indexOf(row),to:rows.indexOf(row),startY:e.clientY,h:row.offsetHeight};
    row.classList.add('dragging'); try{g.setPointerCapture(e.pointerId);}catch{}
  });
  q.addEventListener('pointermove',e=>{
    if(!drag)return; const dy=e.clientY-drag.startY;
    drag.row.style.transform=`translateY(${dy}px)`;
    drag.to=Math.max(0,Math.min(drag.rows.length-1,drag.from+Math.round(dy/drag.h)));
    drag.rows.forEach((r,i)=>{ if(r===drag.row)return;
      let sh=0; if(drag.from<drag.to&&i>drag.from&&i<=drag.to)sh=-drag.h; else if(drag.from>drag.to&&i<drag.from&&i>=drag.to)sh=drag.h;
      r.style.transform=sh?`translateY(${sh}px)`:''; });
  });
  const end=()=>{ if(!drag)return; const d=drag; drag=null;
    d.rows.forEach(r=>{r.style.transform='';}); d.row.classList.remove('dragging');
    if(d.to!==d.from)DuoTune.emit('queue:move',{index:d.from,delta:d.to-d.from}); };
  q.addEventListener('pointerup',end); q.addEventListener('pointercancel',end);
})();

/* ==========================================================================
   NOW PLAYING
   ========================================================================== */
const setText = (ids, v) => ids.forEach(id => $('#'+id).textContent = v);

DuoTune.ui.setNowPlaying = song => {
  S.song = song; S.pos = 0; S._tAt = performance.now(); S.dur = song?.dur || 0; S.line = -1; S.liked = false; S._lyricsDurationChecked=false;
  if(!MOCK && song) setTimeout(()=>duotuneFetchLyrics(song),120);
  syncFavHeart();
  setText(['title','title2','title3'], song ? song.title : 'Pick your first song');
  setText(['artist','artist2','artist3'], song ? (song.artist||'') : 'Add one in Library');
  const i = Math.max(S.index,0), art = song ? artHTML(song,i) : artHTML(null,0);
  $('#art').innerHTML = song ? artHTML(song,i,true) : art; $('#miniArt').innerHTML = art; $('#miniArt2').innerHTML = art; setArtGlow(song);
  DuoTune.ui.setLyrics(song && MOCK ? MOCK_LRC : '');
  renderQueue(); renderProgress();
};
DuoTune.ui.setPlaying = on => {
  if(S.playing)S.pos=estPos();
  S.playing = !!on;
  $('#v-player').classList.toggle('playing', S.playing);
  $('#v-library').classList.toggle('playing', S.playing);
  ['play','play2','play3'].forEach(id => { $('#'+id+' use').setAttribute('href', S.playing ? '#i-pause' : '#i-play'); $('#'+id).setAttribute('aria-label', S.playing?'Pause':'Play'); });
  S._tAt=performance.now(); kickFrame();
  renderPresence();
};
DuoTune.ui.setProgress = (pos, dur) => { S.pos = pos; if (dur) S.dur = dur; renderProgress(); };

function renderProgress(){
  S._tAt = performance.now();
  paintProgress(S.pos);
  updateLine(S.pos);
}

function jump(delta){
  if (!S.queue.length) return;
  const n = S.index + delta; if (n < 0 || n >= S.queue.length) { if (n<0) S.pos=0; return; }

function parseLrc(raw){
  const out = [];
  String(raw||'').split(/\n/).forEach(l => { const m = l.match(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\](.*)/); if(m) out.push({t:+m[1]*60 + +m[2] + (+(m[3]||0)/ (m[3]&&m[3].length===3?1000:100)), text:m[4].trim()}); });
  return out.filter(x=>x.text).sort((a,b)=>a.t-b.t);
}
DuoTune.ui.setLyrics = raw => {
  const source=$('#lyricsSource'); if(source) source.textContent='';
  S.lrc = parseLrc(raw); S._lrcRaw = raw; S._lineEls = null; S._act = null; S.line = -1; S.quote && clearQuote();
  const box = $('#lyrics');
  box.innerHTML = S.lrc.length
    ? `<div class="pad"></div>${S.lrc.map((l,i)=>`<div class="line" data-i="${i}" style="--d:4">${esc(l.text)}</div>`).join('')}<div class="pad b"></div>`
    : `<div class="lyr-empty">♪</div>`;
  box.scrollTop = 0;
};
function updateLine(p=estPos()){
  if (!S.lrc.length) return;
  let a = -1; for (let i=0;i<S.lrc.length;i++){ if (p >= S.lrc[i].t - 0.15) a = i; else break; }
  if (a !== S.line){
    S.line = a;
    const els = S._lineEls || (S._lineEls = $$('#lyrics .line'));
    els.forEach((el,i) => {
      const d = a<0 ? 4 : Math.min(Math.abs(i-a),6);
      el.style.setProperty('--d', d);
      el.classList.toggle('active', i===a);
      el.classList.toggle('past', a>=0 && i<a);
      if (i!==a) el.style.removeProperty('--w');
    });
    S._act = a>=0 ? els[a] : null;
    scrollToLine(false);
  }
  /* Apple-style sweep: LRCLIB gives line times only, so the fill is spread across the line's estimated sung length */
  if (S._act){
    const L = S.lrc[a], nx = S.lrc[a+1], len = (L.text||'').length;
    const gap = (nx ? nx.t : L.t+5) - L.t;
    const sung = Math.max(.8, Math.min(gap*.92, Math.max(1.4, len*.085)));
    const w = Math.max(0, Math.min(1, (p - L.t)/sung));
    S._act.style.setProperty('--w', (-8 + w*116) + '%');
  }
}
function scrollToLine(instant){
  if (S.view !== 'lyrics' && !instant) return;
  if (Date.now() < S.userScrollUntil && !instant) return;
  const box = $('#lyrics'), el = $('#lyrics .line.active') || $('#lyrics .line'); if (!el) return;
  box.scrollTo({top: el.offsetTop - box.clientHeight*.28, behavior: instant ? 'auto' : 'smooth'});
}

  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes=crypto.getRandomValues(new Uint8Array(6));
  return 'DUO-'+Array.from(bytes,b=>alphabet[b%alphabet.length]).join('');
}
async function duotuneBroadcast(payload){

function duotunePresence(){
  if(!duotuneChannel) return;
  const state=duotuneChannel.presenceState();
  const members=Object.entries(state||{}).flatMap(([key,items])=>(items||[]).map(m=>({...m,__presenceKey:key})));
  const me=members.find(m=>m.__presenceKey===duotunePresenceKey);
  const peer=members.find(m=>m.__presenceKey!==duotunePresenceKey);
  S.herAvatar=peer?.avatar||null;
  /* UI-FIX: share favourites when the partner appears */
  if(peer&&S._favPeer!==peer.__presenceKey){S._favPeer=peer.__presenceKey;duotuneBroadcast({kind:'favs',sender:duotunePresenceKey,list:S.favs.me});}
  if(!peer)S._favPeer=null;
  DuoTune.ui.setPresence({me:{name:me?.name||S.me.name,online:true},her:{name:peer?.name||'',online:!!peer,avatar:peer?.avatar||null}});
}
function duotuneReceive(payload){
  if(!payload || typeof payload!=='object') return;
  switch(payload.kind){
    case 'chat':
      if(payload.sender!==duotunePresenceKey) DuoTune.ui.receiveMessage({text:payload.text,quote:payload.quote||null});
      break;
    case 'reaction':
      DuoTune.ui.receiveReaction(payload.emoji);
      break;
    case 'queue':
      if(Array.isArray(payload.queue)){
        // Always accept the authoritative shared queue, including an empty queue or index -1.
        S.queue=payload.queue.map(x=>({...x}));
        S.index=Number.isInteger(payload.index)?payload.index:-1;
        S.playing=!!payload.playing;
        DuoTune.ui.setQueue(S.queue,S.index);
        const recBox=$('#recommendations');if(recBox)recBox.dataset.loaded='';
        if(S.index>=0 && S.queue[S.index]){
          const incoming=S.queue[S.index], incomingId=ytVideoId(incoming), currentId=ytVideoId(S.song);
          if(incomingId!==currentId){
            DuoTune.ui.setNowPlaying(incoming);
            if(ytReady&&ytPlayer) ytRemote(()=>ytPlayer.loadVideoById({videoId:incomingId}));
          }else{
            S.song=incoming; renderQueue();
          }
          DuoTune.ui.setPlaying(S.playing);
          if(S.playing && ytReady && ytPlayer && ytPlayer.getPlayerState()!==YT.PlayerState.PLAYING){
            ytRemote(()=>ytPlayer.playVideo());
          }
        }else if(!S.queue.length){
          S.pos=0;DuoTune.ui.setNowPlaying(null);DuoTune.ui.setPlaying(false);
        }
      }
      break;
    case 'sync': duotuneApplySync(payload); break;
    case 'player':
      if(payload.action==='play'){ DuoTune.ui.setPlaying(true); ytRemote(()=>{ytPlayer.seekTo(Number(payload.seconds)||0,true);ytPlayer.playVideo();}); }
      if(payload.action==='pause'){ DuoTune.ui.setPlaying(false); ytRemote(()=>ytPlayer.pauseVideo()); }
      if(payload.action==='seek'){ DuoTune.ui.setProgress(Number(payload.seconds)||0,S.dur); ytRemote(()=>ytPlayer.seekTo(Number(payload.seconds)||0,true)); }
      if(payload.action==='volume' && Number.isFinite(payload.value)) {
        $('#vol').value=payload.value;
        $('#vol').style.setProperty('--p',payload.value+'%');
      }
      break;
    case 'fav': /* UI-FIX: favourites */
      if(payload.sender!==duotunePresenceKey&&payload.song){const s=payload.song;S.favs.her=S.favs.her.filter(x=>x.id!==s.id);if(payload.liked)S.favs.her.unshift(s);favSave();renderFavs();if(payload.liked)toast((payload.by||'She')+' ♡ '+(s.title||'a song'));}
      break;
    case 'favs':
      if(payload.sender!==duotunePresenceKey&&Array.isArray(payload.list)){S.favs.her=payload.list;favSave();renderFavs();}
      break;
    case 'playlist-refresh': duotuneLoadPlaylists(); break;
    case 'profile': if(payload.sender!==duotunePresenceKey){S.herAvatar=payload.avatar||null;if(payload.name)S.her.name=payload.name;renderPresence();} break;
    case 'presence-ping':
      duotunePresence();
      break;
  }
}
async function duotuneConnect({name,code,password}){
  if(duotuneJoining) return;
  duotuneJoining=true;
  try{
    if(!window.supabase?.createClient) throw new Error('Supabase library did not load. Refresh the page and try again.');
    if(duotuneChannel){
      try{await duotuneChannel.untrack(); await duotuneSupabase.removeChannel(duotuneChannel);}catch{}
      duotuneChannel=null;
    }
    duotuneSupabase=window.supabase.createClient(DUOTUNE_SUPABASE_URL,DUOTUNE_SUPABASE_KEY,{
      realtime:{params:{eventsPerSecond:10}}
    });
    let {data:authData,error:authError}=await duotuneSupabase.auth.getSession();
    if(authError) throw authError;
    if(!authData.session){
      const signed=await duotuneSupabase.auth.signInAnonymously();
      if(signed.error) throw new Error('Anonymous sign-in failed. Check that Anonymous Sign-ins are enabled in Supabase Auth.');
      authData=signed.data;
    }
    S.authUserId=authData.session?.user?.id||null;
    if(!S.authUserId) throw new Error('Could not establish your private device identity.');
    S.isHost=false;
    const roomCode=code ? duotuneRoomCode(code) : INVITE_ROOM_TOKEN;
    if(roomCode!==INVITE_ROOM_TOKEN) throw new Error('DUOTUNE room code is fixed. Use KIRANUU.');
    if(!password || password!=='23') throw new Error('Incorrect password.');
    let access=await duotuneSupabase.rpc('duotune_request_room_access',{p_room_code:roomCode,p_display_name:name,p_password:password});
    if(access.error) throw new Error(access.error.message);
    if(access.data?.status==='setup_required'){
      const setup=await duotuneSupabase.rpc('duotune_set_room_password',{p_room_code:roomCode,p_password:password});
      if(setup.error) throw new Error('Only the existing room admin can set the shared password. '+setup.error.message);
      access=await duotuneSupabase.rpc('duotune_request_room_access',{p_room_code:roomCode,p_display_name:name,p_password:password});
      if(access.error) throw new Error(access.error.message);
    }
    if(access.data?.status==='pending') throw new Error('Access request sent. The room admin must approve you first.');
    if(access.data?.status!=='approved') throw new Error(access.data?.message||'Room access was not approved.');
    S.isHost=!!access.data?.is_admin;
    S.code=roomCode;
    S.roomId=access.data?.room_id||null;
    duotunePresenceKey=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`);
    duotuneChannel=duotuneSupabase.channel(`duotune:${roomCode}`,{
      config:{presence:{key:duotunePresenceKey},broadcast:{self:false}}
    });
    duotuneChannel
      .on('broadcast',{event:'duotune'},({payload})=>duotuneReceive(payload))
      .on('presence',{event:'sync'},duotunePresence)
      .on('presence',{event:'join'},duotunePresence)
      .on('presence',{event:'leave'},duotunePresence);

    const status=await new Promise((resolve,reject)=>{
      const timeout=setTimeout(()=>reject(new Error('Supabase connection timed out. Check the project Realtime settings and internet connection.')),12000);
      duotuneChannel.subscribe(async state=>{
        if(state==='SUBSCRIBED'){
          clearTimeout(timeout);
          try{
            const tracked=await duotuneChannel.track({name,avatar:S.avatar||null,joined_at:new Date().toISOString()});
            if(tracked!=='ok') throw new Error('Presence tracking failed: '+tracked);
            resolve(state);
          }catch(e){reject(e);}
        }else if(state==='CHANNEL_ERROR'||state==='TIMED_OUT'||state==='CLOSED'){
          clearTimeout(timeout);
          reject(new Error('Supabase channel status: '+state));
        }
      });
    });
    if(status!=='SUBSCRIBED') throw new Error('Could not subscribe to room.');
    DuoTune.ui.enterRoom({name,code:roomCode});
    ytInitPlayer();
    duotunePresence();
    await duotuneRestoreQueue(); await duotuneLoadChat(); await duotuneLoadHistory(); await duotuneLoadFavs(); await duotuneLoadPlaylists(); await duotuneLoadRecommendations();
    await duotuneBroadcast({kind:'profile',name:S.me.name,avatar:S.avatar||null});
    if(S.authUserId){
      const {error:profileError}=await duotuneSupabase.from('duotune_profiles').upsert({user_id:S.authUserId,room_code:S.code,display_name:S.me.name,avatar_url:S.avatar||null,updated_at:new Date().toISOString()});
      if(profileError) console.warn('[DUOTUNE] Profile record save failed:',profileError.message);
    }
    await duotuneBroadcast({kind:'presence-ping'});
    toast('Welcome back, '+(S.me.name||'there')+'!');
    console.info('[DUOTUNE] Connected to',roomCode);
  }catch(error){
    console.error('[DUOTUNE] Connect error:',error);
    toast(error.message||'Could not connect to Supabase');
  }finally{
    duotuneJoining=false;
  }
}

let ytPlayer = null, ytReady = false, ytProgressTimer = null, ytRemoteAction = false;
const ytStatus = (message) => { const el=$('#yt-status'); if(el) el.textContent=message; };
function ytVideoId(song){
  if(!song) return null;
  const direct=String(song.videoId||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(direct)) return direct;
  const raw=String(song.url||song.id||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
  try{
    const u=new URL(raw);
    const host=u.hostname.replace(/^www\./,'').replace(/^m\./,'');
    let id='';
    if(host==='youtu.be') id=u.pathname.split('/').filter(Boolean)[0]||'';
    else if(host.endsWith('youtube.com') || host==='youtube-nocookie.com'){
      id=u.searchParams.get('v')||'';
      if(!id){const parts=u.pathname.split('/').filter(Boolean);const marker=parts.findIndex(x=>['embed','shorts','live'].includes(x));if(marker>=0)id=parts[marker+1]||'';}
    }
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null;
  }catch{return null;}
}

    const videoId=ytVideoId(S.queue[S.index]);if(!videoId)return;
    duotuneBroadcast({kind:'sync',videoId,seconds:Number(ytPlayer.getCurrentTime())||0,playing:ytPlayer.getPlayerState()===YT.PlayerState.PLAYING,index:S.index,queue:S.queue});
  },1500);

function duotuneApplySync(p){
  if(S.isHost||!ytReady||!ytPlayer)return;
  if(Array.isArray(p.queue)){S.queue=p.queue;S.index=p.index;DuoTune.ui.setQueue(S.queue,S.index);}
  const song=S.queue[S.index],id=ytVideoId(song);
  if(id!==p.videoId){
    if(song){song.videoId=p.videoId;song.id=p.videoId;}
    ytRemote(()=>{
      ytPlayer.loadVideoById({videoId:p.videoId,startSeconds:Math.max(0,p.seconds||0)});
      if(p.playing) ytPlayer.playVideo(); else ytPlayer.pauseVideo();
    });
    return;
  }
  const local=Number(ytPlayer.getCurrentTime())||0,remote=Number(p.seconds)||0;
  if(Math.abs(local-remote)>1.25)ytRemote(()=>ytPlayer.seekTo(remote,true));
  const playing=ytPlayer.getPlayerState()===YT.PlayerState.PLAYING;
  if(p.playing&&!playing)ytRemote(()=>ytPlayer.playVideo());
  if(!p.playing&&playing)ytRemote(()=>ytPlayer.pauseVideo());
}

function duotuneParseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}
  row.push(cell);if(row.some(v=>v.trim()))rows.push(row);
  if(rows.length<2)throw new Error('CSV has no track rows.');
  const headers=rows.shift().map(x=>x.trim().toLowerCase());
  const find=(names)=>headers.findIndex(h=>names.some(n=>h===n||h.includes(n)));
  const ti=find(['track name','track']),ai=find(['artist name','artist']);
  if(ti<0||ai<0)throw new Error('CSV must include Track Name and Artist Name columns.');
  return rows.map(r=>({title:(r[ti]||'').trim(),artist:(r[ai]||'').trim()})).filter(x=>x.title);
}
async function duotuneImportSpotifyCSV(file){
  const raw=duotuneParseCSV(await file.text());if(!raw.length)throw new Error('No tracks found in CSV.');
  const tracks=[];let missed=0;
  for(let i=0;i<raw.length;i++){
    const song=raw[i];
    try{const result=await duotuneYoutubeRequest({action:'search',query:song.title+' '+song.artist,maxResults:5});const hit=(result.items||[]).find(x=>x.id?.videoId);if(!hit){missed++;continue;}const id=hit.id.videoId;tracks.push({id,videoId:id,url:'https://www.youtube.com/watch?v='+id,title:song.title,artist:song.artist,img:hit.snippet?.thumbnails?.medium?.url||null,dur:0,source:'YouTube',spotifyTitle:song.title});}
    catch(e){missed++;console.warn('[DUOTUNE] Spotify CSV match skipped:',song.title,e.message);}
  }
  if(!tracks.length)throw new Error('Could not match any CSV tracks on YouTube.');
  return {title:file.name.replace(/\.csv$/i,'')||'Spotify import',url:'spotify-csv:'+file.name,source:'spotify',tracks,missed};
}
$('#spotifyCsvBtn').onclick=()=>$('#spotifyCsvInput').click();
$('#spotifyCsvInput').onchange=async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{toast('Matching Spotify tracks on YouTube…');const record=await duotuneImportSpotifyCSV(file);const saved=await duotuneSavePlaylist('me',record);S.playlists.me.push({id:saved.id,url:record.url,title:record.title,source:'spotify',tracks:record.tracks,added_at:saved.added_at||new Date().toISOString(),owner_name:S.me.name});renderPlaylists();await duotuneBroadcast({kind:'playlist-refresh'});toast(`Imported ${record.tracks.length} tracks${record.missed?`; ${record.missed} unmatched`:''}`);}
  catch(err){toast(err.message||'CSV import failed');}finally{e.target.value='';}
};

async function duotuneResolveSpotifyTrack(song){
  if(!song?.spotifyId||ytVideoId(song))return song;
  const d=await duotuneYoutubeRequest({action:'search',query:song.title+' '+song.artist,maxResults:5});
  const hit=(d.items||[]).find(x=>x.id?.videoId);if(!hit)throw new Error('No YouTube match for '+song.title);
  song.videoId=hit.id.videoId;song.id=hit.id.videoId;song.url='https://www.youtube.com/watch?v='+song.videoId;return song;
}

async function duotuneSearchYouTube(query){
  const data=await duotuneYoutubeRequest({action:'search',query,maxResults:12});
  const results=(data.items||[]).map(x=>({videoId:x.id.videoId,title:x.snippet.title,artist:x.snippet.channelTitle,img:x.snippet.thumbnails?.medium?.url,source:'YouTube'}));
  DuoTune.ui.setSearchResults(results);
  await duotuneSaveSearchHistory(query);
}

async function duotuneLoadRecommendations(force=false){
  const box=$('#recommendations');if(!box||!duotuneSupabase)return;
  if(!force&&box.dataset.loaded==='yes')return;
  const current=S.queue[S.index]||S.song;
  const recent=(window.DUOTUNE_HISTORY||[]).slice(-12).reverse();
  const artists=[...new Set([current?.artist,...recent.map(x=>x.artist)].filter(x=>x&&x!=='YouTube'))];
  const seed=artists.slice(0,2).join(' ');
  const query=seed?`songs similar to ${seed} popular music recommendations`:'popular songs trending music';
  box.innerHTML='<div class="empty">Finding songs you might both like…</div>';
  try{
    const data=await duotuneYoutubeRequest({action:'search',query,maxResults:8});
    const seen=new Set(S.queue.map(x=>ytVideoId(x)).filter(Boolean));
    const recs=(data.items||[]).filter(x=>x.id?.videoId&&!seen.has(x.id.videoId)).map(x=>({videoId:x.id.videoId,title:x.snippet?.title||'YouTube song',artist:x.snippet?.channelTitle||'YouTube',img:x.snippet?.thumbnails?.medium?.url||x.snippet?.thumbnails?.default?.url||`https://i.ytimg.com/vi/${x.id.videoId}/hqdefault.jpg`,source:'YouTube'}));
    box.innerHTML=recs.length?recs.map((r,i)=>`<button class="row rec-row" data-rec="${i}"><span class="q-art">${artHTML(r,i)}</span><span class="t"><div class="n">${esc(r.title)}</div><div class="s">${esc(r.artist)}</div></span><span class="plus">${ico('plus')}</span></button>`).join(''):'<div class="empty">No suggestions found. Try Refresh.</div>';
    box._items=recs;box.dataset.loaded='yes';
  }catch(e){box.innerHTML='<div class="empty">Could not load suggestions right now</div>';console.warn('[DUOTUNE] Recommendations failed',e);}
}
$('#recommendations').onclick=e=>{const b=e.target.closest('[data-rec]');if(!b)return;const r=$('#recommendations')._items?.[+b.dataset.rec];if(!r)return;DuoTune.emit('queue:add',{videoId:r.videoId,title:r.title,artist:r.artist,img:r.img});b.disabled=true;b.style.opacity='.5';};

/* UI-FIX: favourites. Works live over the room channel; the table below is optional (see duotune-favourites.sql). */
async function duotuneLoadFavs(){
  if(!duotuneSupabase||!S.code)return;
  try{
    const {data,error}=await duotuneSupabase.from('duotune_favorites').select('*').eq('room_code',S.code).order('created_at',{ascending:false});
    if(error||!Array.isArray(data))return;
    const slim=r=>({id:r.track_id,videoId:r.track_id,title:r.title,artist:r.artist||'',img:r.artwork_url||null,at:new Date(r.created_at||0).getTime()});
    const mine=data.filter(r=>r.user_id===S.authUserId).map(slim), hers=data.filter(r=>r.user_id!==S.authUserId).map(slim);
    const merge=(a,b)=>{const m=new Map();[...a,...b].forEach(s=>{if(s.id&&!m.has(s.id))m.set(s.id,s);});return [...m.values()];};
    DuoTune.ui.setFavourites({me:merge(S.favs.me,mine),her:hers.length?hers:S.favs.her});
  }catch(e){console.warn('[DUOTUNE] Favourites table not ready (optional):',e);}
}
DuoTune.on('favorite:toggle',async p=>{
  duotuneBroadcast({kind:'fav',sender:duotunePresenceKey,by:S.me.name,liked:p.liked,song:p.song});
  if(!duotuneSupabase||!S.code||!S.authUserId)return;
  try{
    if(p.liked)await duotuneSupabase.from('duotune_favorites').insert({room_code:S.code,user_id:S.authUserId,owner_name:S.me.name,track_id:p.song.id,title:p.song.title,artist:p.song.artist,artwork_url:p.song.img||null});
    else await duotuneSupabase.from('duotune_favorites').delete().eq('room_code',S.code).eq('user_id',S.authUserId).eq('track_id',p.song.id);
  }catch(e){console.warn('[DUOTUNE] Favourite not saved to table (optional)',e);}
});
DuoTune.on('room:connect',duotuneConnect);
/* Profile picture upload hook: call DuoTune.uploadAvatar(file) from an existing avatar click handler. */
DuoTune.uploadAvatar = async function(file){
  if(!file || !/^image\//.test(file.type)) throw new Error('Choose an image file.');
  if(file.size>5*1024*1024) throw new Error('Avatar must be 5 MB or smaller.');
  if(!duotuneSupabase) throw new Error('Join your room first.');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=(S.authUserId||'anonymous')+'/'+(duotunePresenceKey||'member')+'.'+ext;
  const {error}=await duotuneSupabase.storage.from('duotune-avatars').upload(path,file,{upsert:true,contentType:file.type});
  if(error) throw error;
  const {data}=duotuneSupabase.storage.from('duotune-avatars').getPublicUrl(path);
  localStorage.setItem('duotune_avatar_'+(S.code||'')+'_'+S.me.name,data.publicUrl);
  return data.publicUrl;
};
DuoTune.on('room:leave',async()=>{
  if(duotuneChannel){
    try{await duotuneChannel.untrack();await duotuneSupabase.removeChannel(duotuneChannel);}catch(e){console.warn(e);}
  }
  duotuneChannel=null;clearInterval(syncHeartbeat);
  if(ytReady && ytPlayer){try{ytPlayer.stopVideo();}catch{}}
  S.code='';
  const deck=$('#duotune-audio-deck'); if(deck) deck.style.display='none';
  leaveRoom();
});
DuoTune.on('player:play',p=>{
  DuoTune.ui.setPlaying(true);
  if(ytReady && ytPlayer){try{if(S.index>=0 && ytPlayer.getPlayerState()===YT.PlayerState.CUED){} ytPlayer.seekTo(Number(p?.seconds)||S.pos,true);ytPlayer.playVideo();ytStatus('Starting playback…');}catch(e){console.error(e);}}
  duotuneBroadcast({kind:'player',action:'play',seconds:p?.seconds||S.pos});
  if(S.isHost)duotuneBroadcast({kind:'sync',videoId:ytVideoId(S.queue[S.index]),seconds:Number(p?.seconds)||S.pos,playing:true,index:S.index,queue:S.queue});
});
DuoTune.on('player:pause',p=>{DuoTune.ui.setPlaying(false);ytRemote(()=>ytPlayer?.pauseVideo());duotuneBroadcast({kind:'player',action:'pause',seconds:p?.seconds||S.pos});});
DuoTune.on('player:seek',p=>{const seconds=Number(p?.seconds)||0;DuoTune.ui.setProgress(seconds,S.dur);ytRemote(()=>ytPlayer?.seekTo(seconds,true));duotuneBroadcast({kind:'player',action:'seek',seconds});});
DuoTune.on('player:volume',p=>duotuneBroadcast({kind:'player',action:'volume',value:p.value}));
DuoTune.on('chat:send',async p=>{
  duotuneBroadcast({kind:'chat',by:S.me.name,sender:duotunePresenceKey,text:p.text,quote:p.quote||null});
  if(duotuneSupabase && S.code){const {error}=await duotuneSupabase.from('duotune_chat').insert({room_code:S.code,user_id:S.authUserId,sender_name:S.me.name,message:p.text,quote:p.quote||null});if(error)console.warn('[DUOTUNE] Chat save failed. Run setup SQL.',error);}
});
DuoTune.on('reaction:send',p=>duotuneBroadcast({kind:'reaction',emoji:p.emoji}));
DuoTune.on('queue:add',async p=>{
  const incomingUrl=String(p?.url||'').trim();
  const videoId=ytVideoId({videoId:p?.videoId,url:incomingUrl,id:p?.videoId||incomingUrl});
  if(!videoId){toast('Could not read a YouTube video ID from that link.');ytStatus('Invalid YouTube link');return;}
  let song={id:videoId,videoId,url:'https://www.youtube.com/watch?v='+videoId,title:p.title||'YouTube song',artist:p.artist||'YouTube',img:p.img||`https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,dur:0};
  let target=S.queue.findIndex(x=>ytVideoId(x)===videoId);
  if(target<0){S.queue.push(song);target=S.queue.length-1;}
  // If this is the first track, select and load it immediately, before any network await.
  const firstTrack=S.index<0;
  if(firstTrack){
    S.index=target;S.playing=false;DuoTune.ui.setNowPlaying(song);
    if(ytReady && ytPlayer){
      try{ytPlayer.loadVideoById({videoId});ytStatus('Loading selected track…');}
      catch(e){console.error('[DUOTUNE] Immediate load failed',e);}
    }else{ytStatus('Track queued · preparing player');}
  }
  DuoTune.ui.setQueue(S.queue,S.index);
  const recBox=$('#recommendations');if(recBox)recBox.dataset.loaded='';
  await duotunePersistQueue();
  store.set('duotune_queue_'+(S.code||'local'),JSON.stringify({queue:S.queue,index:S.index}));
  await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:false});
  // Fetch display metadata after the player load request, never before it.
  try{
    const r=await fetch('https://www.youtube.com/oembed?url='+encodeURIComponent(song.url)+'&format=json');
    if(r.ok){
      const d=await r.json();
      song.title=d.title||song.title;song.artist=d.author_name||song.artist;song.img=d.thumbnail_url||song.img;
      const ix=S.queue.findIndex(x=>ytVideoId(x)===videoId);
      if(ix>=0){S.queue[ix]={...S.queue[ix],...song};DuoTune.ui.setQueue(S.queue,S.index);if(ix===S.index)DuoTune.ui.setNowPlaying(S.queue[ix]);}
      await duotunePersistQueue();
      await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:S.playing});
    }
  }catch(e){console.warn('[DUOTUNE] Could not load YouTube metadata',e);}
  toast('Added to shared queue');
});
DuoTune.on('queue:play',async p=>{
  if(!Number.isInteger(p.index)||!S.queue[p.index]) return;
  S.index=p.index;
  try{S.queue[S.index]=await duotuneResolveSpotifyTrack(S.queue[S.index]);}catch(e){toast(e.message);return;}
  DuoTune.ui.setNowPlaying(S.queue[S.index]);DuoTune.ui.setPlaying(true);
  const id=ytVideoId(S.queue[S.index]);
  if(ytReady && id){ytPlayer.loadVideoById({videoId:id});ytStatus('Loading selected track…');}
  else ytLoadCurrent(false);
  await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:true});
});
DuoTune.on('player:next',async()=>{
  if(S.index+1<S.queue.length){S.index++;try{S.queue[S.index]=await duotuneResolveSpotifyTrack(S.queue[S.index]);}catch(e){toast(e.message);return;}DuoTune.ui.setNowPlaying(S.queue[S.index]);DuoTune.ui.setPlaying(true);ytLoadCurrent(true);await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:true});}
});
DuoTune.on('player:prev',async()=>{
  if(S.index>0){S.index--;DuoTune.ui.setNowPlaying(S.queue[S.index]);DuoTune.ui.setPlaying(true);ytLoadCurrent(true);await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:true});}
});
async function duotuneSavePlaylist(owner,record){
  if(!duotuneSupabase||!S.code||!S.authUserId)throw new Error('Room connection is required.');
  const row={room_code:S.code,owner_user_id:S.authUserId,owner_name:owner==='me'?S.me.name:(S.her.name||'Her'),source_url:record.url,source:String(record.source||'').toLowerCase(),title:record.title,tracks:record.tracks,added_at:new Date().toISOString()};
  const {data,error}=await duotuneSupabase.from('duotune_playlists').insert(row).select().single();if(error)throw error;
  return data||row;
}
async function duotuneLoadPlaylists(){
  if(!duotuneSupabase||!S.code)return;
  const {data,error}=await duotuneSupabase.from('duotune_playlists').select('*').eq('room_code',S.code).order('added_at',{ascending:true});
  if(error){console.warn('[DUOTUNE] Playlist library table not ready:',error.message);return;}
  const mine=[],hers=[];(data||[]).forEach(row=>{const item={id:row.id,url:row.source_url,title:row.title,source:row.source,tracks:row.tracks||[],added_at:row.added_at,owner_name:row.owner_name,owner_user_id:row.owner_user_id};(row.owner_user_id===S.authUserId?mine:hers).push(item);});
  DuoTune.ui.setPlaylists({me:mine,her:hers});
}
async function duotuneSaveSearchHistory(query){
  if(!duotuneSupabase||!S.code||!S.authUserId)return;
  const {error}=await duotuneSupabase.from('duotune_search_history').insert({room_code:S.code,user_id:S.authUserId,query});
  if(error)console.warn('[DUOTUNE] Search history save unavailable:',error.message);
}
DuoTune.on('playlist:add',async p=>{
  const owner='me';
  try{
    toast('Importing playlist…');
    const record=/open\.spotify\.com\/playlist\//i.test(p.url)?await duotuneImportSpotifyPlaylist(p.url):await duotuneImportYouTubePlaylist(p.url);
    if(!record)return;
    const saved=await duotuneSavePlaylist(owner,record);
    S.playlists[owner].push({id:saved.id,url:record.url,title:record.title,source:record.source,tracks:record.tracks,added_at:saved.added_at||new Date().toISOString(),owner_name:owner==='me'?S.me.name:S.her.name});
    renderPlaylists();await duotuneBroadcast({kind:'playlist-refresh'});
    toast('Saved to '+(owner==='me'?'your':'her')+' playlist library.');
  }catch(e){console.error('[DUOTUNE] Playlist import failed',e);toast(e.message||'Playlist import failed');}
});
DuoTune.on('playlist:remove',async p=>{
  const list=S.playlists[p.owner]||[],item=list[p.index];if(!item)return;
  if(!(await uiConfirm('Remove this playlist from the shared library?','Remove')))return;
  const {error}=await duotuneSupabase.from('duotune_playlists').delete().eq('id',item.id).eq('owner_user_id',S.authUserId);
  if(error){toast('Could not remove playlist: '+error.message);return;}
  list.splice(p.index,1);renderPlaylists();await duotuneBroadcast({kind:'playlist-refresh'});
});
DuoTune.on('playlist:queue',async p=>{
  const tracks=Array.isArray(p.tracks)?p.tracks:[];if(!tracks.length)return;
  tracks.forEach(t=>{if(!S.queue.some(x=>(x.spotifyId&&x.spotifyId===t.spotifyId)||ytVideoId(x)===ytVideoId(t)))S.queue.push({...t});});
  DuoTune.ui.setQueue(S.queue,S.index);await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:S.playing});toast('Playlist tracks added to shared queue');
});
DuoTune.on('queue:remove',async p=>{
  const i=Number(p.index);if(!Number.isInteger(i)||!S.queue[i])return;
  S.queue.splice(i,1);if(S.index===i){S.index=Math.min(i,S.queue.length-1);if(S.index>=0){DuoTune.ui.setNowPlaying(S.queue[S.index]);ytLoadCurrent(false);}else{DuoTune.ui.setNowPlaying(null);DuoTune.ui.setPlaying(false);}}else if(S.index>i)S.index--;
  DuoTune.ui.setQueue(S.queue,S.index);await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:S.playing});
});
DuoTune.on('queue:move',async p=>{
  const from=Number(p.index),to=from+Number(p.delta);
  if(!Number.isInteger(from)||!Number.isInteger(to)||from<0||to<0||from>=S.queue.length||to>=S.queue.length)return;
  const [item]=S.queue.splice(from,1);S.queue.splice(to,0,item);
  if(S.index===from)S.index=to;else if(from<S.index&&to>=S.index)S.index--;else if(from>S.index&&to<=S.index)S.index++;
  DuoTune.ui.setQueue(S.queue,S.index);await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:S.playing});
});
DuoTune.on('queue:shuffle',async()=>{
  if(S.queue.length<2)return;
  const current=S.index>=0?S.queue[S.index]:null;
  const rest=S.queue.filter((_,i)=>i!==S.index);
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  S.queue=current?[current,...rest]:rest;S.index=current?0:-1;
  DuoTune.ui.setQueue(S.queue,S.index);await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:S.queue,index:S.index,playing:S.playing});toast('Shared queue shuffled');
});
DuoTune.on('queue:clear',async()=>{S.queue=[];S.index=-1;S.pos=0;DuoTune.ui.setQueue([], -1);DuoTune.ui.setNowPlaying(null);DuoTune.ui.setPlaying(false);if(ytReady&&ytPlayer)ytPlayer.stopVideo();await duotunePersistQueue();await duotuneBroadcast({kind:'queue',queue:[],index:-1,playing:false});toast('Shared queue cleared');});
DuoTune.on('search',p=>{
  const query=String(p?.query||'').trim(); if(!query) return;
  duotuneSearchYouTube(query).catch(e=>{console.error(e);toast(e.message||'Search failed');});
});
