const ytStatus = (message) => { const el=$('#yt-status'); if(el) el.textContent=message; };
function ytVideoId(song){
  if(!song) return null;
  const direct=String(song.videoId||song.recording?.videoId||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(direct)) return direct;
  const raw=String(song.url||song.id||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
  try{
    const u=new URL(raw),host=u.hostname.replace(/^www\./,'').replace(/^m\./,'');
    let id='';
    if(host==='youtu.be') id=u.pathname.split('/').filter(Boolean)[0]||'';
    else if(host.endsWith('youtube.com')||host==='youtube-nocookie.com'){
      id=u.searchParams.get('v')||'';
      if(!id){const parts=u.pathname.split('/').filter(Boolean),marker=parts.findIndex(x=>['embed','shorts','live'].includes(x));if(marker>=0)id=parts[marker+1]||'';}
    }
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null;
  }catch{return null;}
}
function ytLoadApi(){

    if(!tag){tag=document.createElement('script');tag.id='youtube-iframe-api';tag.src='https://www.youtube.com/iframe_api';tag.async=true;tag.onerror=()=>reject(new Error('Could not load the YouTube player API.'));document.head.appendChild(tag);}
    setTimeout(()=>{if(!window.YT?.Player)reject(new Error('YouTube player API did not become ready.'));},20000);
  }).catch(error=>{ytApiPromise=null;throw error;});
  return ytApiPromise;
}
function ytSetMediaSession(song){

    const actions={play:()=>ytPlayer?.playVideo(),pause:()=>ytPlayer?.pauseVideo(),previoustrack:()=>DuoTune.emit('player:prev',{}),nexttrack:()=>DuoTune.emit('player:next',{}),seekbackward:d=>ytPlayer?.seekTo(Math.max(0,ytPlayer.getCurrentTime()-(d.seekOffset||10)),true),seekforward:d=>ytPlayer?.seekTo(ytPlayer.getCurrentTime()+(d.seekOffset||10),true)};

  }catch(e){console.debug('[DUOTUNE] Media Session unavailable:',e);}

function ytHandleStateChange(event){
  const state=event.data, states=window.YT.PlayerState;
  if(state===states.PLAYING){
    S.playing=true;DuoTune.ui.setPlaying(true);ytStatus('Playing');ytSetMediaSession(S.queue[S.index]||S.song);
    if(!ytRemoteAction&&S.isHost)duotuneBroadcast({kind:'player',action:'play',seconds:ytPlayer.getCurrentTime()||0});
    if(S.queue[S.index])duotuneSaveHistory(S.queue[S.index]);

    S.playing=false;DuoTune.ui.setPlaying(false);ytStatus('Paused');
    if(!ytRemoteAction&&S.isHost)duotuneBroadcast({kind:'player',action:'pause',seconds:ytPlayer.getCurrentTime()||0});
  }else if(state===states.BUFFERING){ytStatus('Buffering…');}
  else if(state===states.CUED){ytStatus('Ready to play');}
  else if(state===states.ENDED){S.playing=false;DuoTune.ui.setPlaying(false);ytStatus('Track ended');if(!ytRemoteAction)DuoTune.emit('player:next',{});}

function duotuneApplySync(p){
  if(S.isHost||!ytReady||!ytPlayer)return;
  if(Array.isArray(p.queue)){S.queue=p.queue;S.index=p.index;DuoTune.ui.setQueue(S.queue,S.index);}
  const song=S.queue[S.index],id=ytVideoId(song);
  if(id!==p.videoId){
    if(song){song.videoId=p.videoId;song.id=p.videoId;}
    ytRemote(()=>ytPlayer.loadVideoById({videoId:p.videoId,startSeconds:Math.max(0,p.seconds||0)}));
    if(!p.playing)ytRemote(()=>ytPlayer.pauseVideo());
    return;
  }
  const local=Number(ytPlayer.getCurrentTime())||0,remote=Number(p.seconds)||0;
  if(Math.abs(local-remote)>1.25)ytRemote(()=>ytPlayer.seekTo(remote,true));
  const playing=ytPlayer.getPlayerState()===YT.PlayerState.PLAYING;
  if(p.playing&&!playing)ytRemote(()=>ytPlayer.playVideo());
  if(!p.playing&&playing)ytRemote(()=>ytPlayer.pauseVideo());
}

let lyricsRequestToken=0;
async function duotuneFetchLyrics(song,keep){
  const token=++lyricsRequestToken;
  if(!keep)DuoTune.ui.setLyrics('',{loading:true});
  const source=$('#lyricsSource');
  
  if(!song?.title||!song?.artist){DuoTune.ui.setLyrics('');return;}

  // Prefer metadata from the selected YouTube Music song entity. Do not replace
  // it with YouTube video/oEmbed metadata, which may describe a cover or upload.
  const duration=Number(song.dur||song.duration||song.recording?.duration||0);
  // Duration strengthens the match but is optional; title + artist still
  // allow a lookup when a YouTube Music result omits duration metadata.
  const lookupKey=[song.videoId||song.id,song.title,song.artist,song.album,duration].join('|');
  if(S._lyricsLookupKey===lookupKey)return;
  S._lyricsLookupKey=lookupKey;

  try{
    const result=await duotuneYoutubeRequest({
      action:'lyrics',
      title:song.title,
      artist:song.artist,
      album:song.album||song.recording?.album||'',
      duration:Math.round(duration),
    });
    if(token!==lyricsRequestToken)return;
    if(result?.found&&(result.syncedLyrics||result.plainLyrics)){
      const synced=!!(result.synced&&result.syncedLyrics);
      const native=synced?result.syncedLyrics:result.plainLyrics;
      const romanized=result.romanizedLyrics||null;
      if(keep&&S._lrcRaw===native)return;
      S._lyricsVariants={native,romanized,synced};
      // Telugu-script lyrics stay native by default. Other detected Indic scripts
      // open in Roman transliteration, with a one-tap switch back to the source.
      const preferRomanized=!!romanized&&result.detectedScript!=='telugu';
      duotuneRenderLyricsVariant(preferRomanized);
      
    }else{
      S._lyricsVariants=null;
      DuoTune.ui.setLyrics('');
      
    }
  }catch(error){
    console.warn('[DUOTUNE] Exact lyrics lookup failed:',error);
    if(token===lyricsRequestToken&&!keep)DuoTune.ui.setLyrics('');
  }
}

function duotuneRenderLyricsVariant(useRomanized){
  const variants=S._lyricsVariants;if(!variants)return;
  const raw=useRomanized&&variants.romanized?variants.romanized:variants.native;
  DuoTune.ui.setLyrics(raw,{synced:variants.synced});
  const tg=$('#lyrToggle');
  if(tg){ if(variants.romanized){ tg.textContent=useRomanized?'Original':'Romanized'; tg.classList.remove('hidden'); } else tg.classList.add('hidden'); }
  S._lyricsRomanized=!!useRomanized;
}
$('#lyrToggle').addEventListener('click',()=>duotuneRenderLyricsVariant(!S._lyricsRomanized));

async function duotuneYoutubeRequest(payload){
  if(!duotuneSupabase)throw new Error('Connect to the room first.');
  const {data:sessionData,error:sessionError}=await duotuneSupabase.auth.getSession();
  if(sessionError)throw sessionError;
  const accessToken=sessionData.session?.access_token;
  if(!accessToken)throw new Error('Your DUOTUNE session expired. Rejoin the room and try again.');
  const response=await fetch(DUOTUNE_API_BASE+'/youtube',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+accessToken},
    body:JSON.stringify(payload)
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok||data?.error)throw new Error(data?.error||'YouTube request failed. Try again shortly.');
  return data;
}

async function duotuneImportSpotifyPlaylist(url){

  throw new Error('Spotify playlist links need Spotify-authorized tracklist access. To avoid Developer App setup, export the playlist tracklist as CSV and import that file instead. A Spotify URL alone does not expose its full tracklist.');
}
function duotuneParseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}
  row.push(cell);if(row.some(v=>v.trim()))rows.push(row);
  if(rows.length<2)throw new Error('CSV has no track rows.');
  const headers=rows.shift().map(x=>x.trim().toLowerCase());
  const find=(names)=>headers.findIndex(h=>names.some(n=>h===n||h.includes(n)));
  const ti=find(['track name','track']),ai=find(['artist name','artist']);
  if(ti<0||ai<0)throw new Error('CSV must include Track Name and Artist Name columns.');
  return rows.map(r=>({title:(r[ti]||'').trim(),artist:(r[ai]||'').trim()})).filter(x=>x.title);
}
async function duotuneImportSpotifyCSV(file){
  const raw=duotuneParseCSV(await file.text());if(!raw.length)throw new Error('No tracks found in CSV.');
  const tracks=[];let missed=0;
  for(let i=0;i<raw.length;i++){
    const song=raw[i];
    try{const result=await duotuneYoutubeRequest({action:'search',query:song.title+' '+song.artist,maxResults:5});const hit=(result.items||[]).find(x=>x.id?.videoId);if(!hit){missed++;continue;}const id=hit.id.videoId;tracks.push({id,videoId:id,url:'https://www.youtube.com/watch?v='+id,title:song.title,artist:song.artist,img:hit.snippet?.thumbnails?.medium?.url||null,dur:0,source:'YouTube',spotifyTitle:song.title});}
    catch(e){missed++;console.warn('[DUOTUNE] Spotify CSV match skipped:',song.title,e.message);}
  }
  if(!tracks.length)throw new Error('Could not match any CSV tracks on YouTube.');
  return {title:file.name.replace(/\.csv$/i,'')||'Spotify import',url:'spotify-csv:'+file.name,source:'spotify',tracks,missed};
}

async function duotuneSearchYouTube(query){
  const data=await duotuneYoutubeRequest({action:'search',query,maxResults:12});
  const results=(data.items||[]).map(x=>({
    videoId:x.videoId||x.id?.videoId,
    title:x.title||x.snippet?.title||'Music track',
    artist:x.artist||x.snippet?.channelTitle||'',
    album:x.album||'',
    dur:Number(x.duration||x.contentDetails?.duration||0),
    img:x.snippet?.thumbnails?.medium?.url||x.snippet?.thumbnails?.default?.url||'',
    recording:x.recording||null,
    source:'YouTube Music'
  })).filter(x=>x.videoId);
  const wantsOst=/\b(ost|o\.s\.t\.?|soundtrack|jukebox|bgm|score)\b/i.test(query);
  let soundtrackAlbums = Array.isArray(data.albums) ? data.albums.filter(a=>a && a.browseId && a.title) : [];
  /* a plain movie name should still give its album: ask once more with "ost" when the first answer had none */
  if(!soundtrackAlbums.length && !wantsOst && query.split(/\s+/).length<=3){
    try{ const d2=await duotuneYoutubeRequest({action:'search',query:query+' ost',maxResults:6}); soundtrackAlbums=(Array.isArray(d2.albums)?d2.albums:[]).filter(a=>a&&a.browseId&&a.title); }catch(e){}
  }
  const qw=query.toLowerCase().replace(/\b(ost|soundtrack|original|jukebox|bgm|score|movie|film|songs?)\b/g,' ').split(/\s+/).filter(w=>w.length>1);
  const rank=a=>{const t=((a.title||'')+' '+(a.type||'')).toLowerCase();let sc=0;qw.forEach(w=>{if(t.includes(w))sc+=2;});if(wantsOst&&/soundtrack|\bost\b|original/.test(t))sc+=3;return sc;};
  soundtrackAlbums=soundtrackAlbums.map((a,i)=>({a,i,sc:rank(a)})).sort((x,y)=>y.sc-x.sc||x.i-y.i).map(x=>x.a).slice(0,8);
  DuoTune.ui.setSearchResults(results,soundtrackAlbums,{ost:wantsOst});
  try{ let q=JSON.parse(store.get('duotune_recent_q')||'[]'); q=[query,...q.filter(x=>x!==query)].slice(0,6); store.set('duotune_recent_q',JSON.stringify(q)); }catch(e){}
  const rb=$('#recommendations'); if(rb){ rb.dataset.loaded=''; clearTimeout(window._recT); window._recT=setTimeout(()=>duotuneLoadRecommendations(true),1200); }
  await duotuneSaveSearchHistory(query);
}

const cleanTitle=t=>String(t||'').replace(/[\(\[\{][^\)\]\}]*[\)\]\}]/g,' ').replace(/\b(official|video|audio|lyrics?|lyrical|hd|4k|mv|visuali[sz]er|full song|music)\b/ig,' ').replace(/\s+/g,' ').trim();
let recRound=0;
function recSeeds(){
  const out=[];
  const add=(title,artist='')=>{
    const t=cleanTitle(title),a=String(artist||'').trim();
    const q=[t,a].filter(Boolean).join(' ').trim();
    if(q.length>2&&!out.some(x=>x.toLowerCase()===q.toLowerCase()))out.push(q);
  };
  // Shared room history is already sorted newest-first by mergedHistory().
  mergedHistory().slice(0,8).forEach(x=>add(x.title,x.artist));
  const current=S.queue[S.index]||S.song;
  if(current?.title)add(current.title,current.artist);
  // Recent queue context and mutual favourites provide extra taste signals.
  S.queue.slice(Math.max(0,S.index-2),S.index+3).forEach(x=>add(x?.title,x?.artist));
  [...(S.favs?.me||[]),...(S.favs?.her||[])].slice(0,6).forEach(x=>add(x.title,x.artist));
  return out.slice(0,10);
}
async function duotuneLoadRecommendations(force=false){
  const box=$('#recommendations');if(!box||!duotuneSupabase)return;
  if(!force&&box.dataset.loaded==='yes')return;
  if(box._busy)return; box._busy=true;
  const seeds=recSeeds(), round=recRound++;
  const pick=seeds.length?[seeds[round%seeds.length],seeds[(round+1+Math.floor(Math.random()*Math.max(1,seeds.length-1)))%seeds.length]]:[];
  const queries=[...new Set(pick)].map(sd=>['songs like','similar songs to','more songs by'][round%3]+' '+sd);
  if(!queries.length) queries.push('popular songs trending music');
  box.innerHTML='<div class="empty">Finding songs you might both like…</div>';
  try{
    const lists=await Promise.all(queries.map(q=>duotuneYoutubeRequest({action:'search',query:q,maxResults:8}).catch(()=>({items:[]}))));
    const seen=new Set(S.queue.map(x=>ytVideoId(x)).filter(Boolean)), got=new Set(), items=[];
    lists.forEach(d=>(d.items||[]).forEach(x=>{ const id=x.id?.videoId; if(id&&!seen.has(id)&&!got.has(id)){got.add(id);items.push(x);} }));
    for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
    const recs=items.slice(0,8).map(x=>({videoId:x.videoId||x.id?.videoId,title:x.title||x.snippet?.title||'Music track',artist:x.artist||x.snippet?.channelTitle||'Unknown artist',album:x.album||'',dur:Number(x.duration||x.contentDetails?.duration||0),recording:x.recording||null,img:x.snippet?.thumbnails?.medium?.url||x.snippet?.thumbnails?.default?.url||`https://i.ytimg.com/vi/${x.id.videoId}/hqdefault.jpg`,source:'YouTube Music'}));
    box.innerHTML=recs.length?recs.map((r,i)=>`<button class="row rec-row" data-rec="${i}"><span class="q-art">${artHTML(r,i)}</span><span class="t"><div class="n">${esc(r.title)}</div><div class="s">${esc(r.artist)}</div></span><span class="plus">${ico('plus')}</span></button>`).join(''):'<div class="empty">No suggestions found. Try Refresh.</div>';
    box._items=recs;box.dataset.loaded='yes';
  }catch(e){box.innerHTML='<div class="empty">Could not load suggestions right now</div>';console.warn('[DUOTUNE] Recommendations failed',e);}
  finally{box._busy=false;}
}

    });
  }
  let t=0,sx=0,sy=0;
  box.addEventListener('pointerdown',e=>{const m=e.target.closest('.m');if(!m||m.classList.contains('typing'))return;sx=e.clientX;sy=e.clientY;
    t=setTimeout(()=>{t=0;haptic(18);m.classList.add('pressed');setTimeout(()=>{m.classList.remove('pressed');openMenu(m);},90);},420);});
  const stop=()=>{if(t){clearTimeout(t);t=0;}};
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>box.addEventListener(ev,stop));
  box.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8))stop();});
})();

/* same song re-announced by a sync: keep art + lyrics DOM untouched (no flash) */
(function(){const orig=DuoTune.ui.setNowPlaying;
  DuoTune.ui.setNowPlaying=function(song){const k=song?songKey(song):'';
    if(song&&k&&k===S._npKey&&S.lrc&&S.lrc.length){S.song=song;S.pos=0;S._tAt=performance.now();S.line=-1;S._swLine=-1;syncFavHeart();renderQueue();renderProgress();return;}
    S._npKey=k;return orig.call(this,song);};})();
</script>
